<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandah — Sistema de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#141B33; --navy2:#1D2547; --navy3:#242C57;
  --amber:#0EA57E; --amber-dark:#0B7F62;
  --cream:#F5F6FA; --paper:#fffdf9;
  --green:#276B45; --green-l:#e5f2ea;
  --red:#c1443c; --red-l:#fbeae8;
  --blue:#3568b0; --blue-l:#e7eff9;
  --ink:#161B2E; --muted:#68708A; --line:#e4dfd2;
  --brand-teal-l:#E3F7F0;
}
*{box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden}body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;}
.mono{font-family:'Space Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}

#app{width:100%;max-width:none;margin:0;padding:0;display:none;height:100vh;height:100dvh;min-height:0;overflow:hidden;}
#app.show{display:flex;flex-direction:column;}
html[data-theme="dark"]{ --cream:#20242c; --paper:#282d38; --ink:#eceef2; --muted:#9aa2b1; --line:#3a4050; }

/* ===== LOGIN ===== */
#loginOverlay{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
#loginOverlay.hide{display:none;}
.login-box{background:var(--paper);border-radius:12px;padding:32px;max-width:480px;width:100%;position:relative;}
.login-powered{position:absolute;top:16px;right:20px;display:flex;align-items:center;gap:6px;font-family:'Sora';font-weight:700;font-size:12px;color:var(--muted);}
.login-brand{width:72px;height:72px;margin:0 auto 14px;border-radius:18px;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;font:700 30px 'Oswald';overflow:hidden;box-shadow:0 10px 30px #0002}.login-brand img{width:100%;height:100%;object-fit:contain;background:#fff}.brand-preview{width:110px;height:110px;border:1px dashed var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center}.brand-preview img{width:100%;height:100%;object-fit:contain}.color-choice{display:flex;align-items:center;gap:10px}.color-choice input[type=color]{width:52px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.login-box h1{color:var(--navy);font-size:22px;margin:0 0 4px;text-align:center;}
.login-box p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px;}
.user-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.user-pick button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:14px;text-align:left;}
.user-pick button:hover{border-color:var(--amber);}
.user-pick .un{font-weight:700;font-size:14px;}
.user-pick .ur{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0;}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);}
.pin-dots span.filled{background:var(--navy);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.pin-pad button{padding:16px;font-size:18px;border:1px solid var(--line);background:#fff;border-radius:8px;}
.pin-pad button:hover{background:var(--navy);color:#fff;}

/* ===== WINDOW TITLE BAR ===== */
.winbar{background:var(--navy);color:#e7e9ee;display:flex;align-items:center;padding:0 14px;height:44px;font-size:13px;gap:14px;}
.winbar .wb-logo{width:26px;height:26px;border-radius:8px;background:var(--amber);color:var(--navy);font-family:'Sora';font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.winbar .wb-title{font-family:'Sora';font-weight:700;font-size:14px;color:#fff;letter-spacing:-.01em;}
.winbar .wb-title small{display:block;font-family:'Inter';font-weight:400;font-size:11px;color:#9aa2c4;margin-top:1px;}
.winbar .wb-right{display:flex;align-items:center;gap:14px;margin-left:auto;}
.winbar .wb-dark{display:flex;align-items:center;gap:6px;font-size:12px;color:#c7cad1;}
.winbar .wb-dark input{accent-color:var(--amber);}
.winbar .wb-user{background:none;border:1px solid #363e63;color:#c7cad1;padding:6px 12px;border-radius:7px;font-size:12px;}
.winbar .wb-user:hover{border-color:var(--amber);color:var(--amber);}
.winbar .wb-ctrl{display:flex;gap:2px;}
.winbar .wb-ctrl span{width:28px;height:44px;display:flex;align-items:center;justify-content:center;color:#8a8f99;font-size:13px;cursor:default;}
.winbar .wb-ctrl span.wb-close:hover{background:#c1443c;color:#fff;}

/* ===== RIBBON ===== */
.ribbon{background:#F0F1F6;border-bottom:1px solid #dcdfe8;}
html[data-theme="dark"] .ribbon{background:#31353f;border-bottom:1px solid #40454f;}
.ribbon-tabs{display:flex;background:var(--navy);}
.ribbon-tabs button{background:none;border:none;color:#9fb0cc;padding:9px 20px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.ribbon-tabs button.active{color:#fff;background:#F0F1F6;color:var(--navy);}
html[data-theme="dark"] .ribbon-tabs button.active{background:#31353f;color:#fff;}
.ribbon-tabs button:hover:not(.active){color:#fff;}
.ribbon-toolbar{display:flex;align-items:stretch;padding:8px 14px;gap:0;overflow-x:auto;max-width:100%;min-width:0;}
.rb-group{display:flex;flex-direction:column;align-items:center;padding:0 14px;border-right:1px solid #dcdfe8;flex:0 0 auto;}
html[data-theme="dark"] .rb-group{border-right:1px solid #40454f;}
.rb-group:last-child{border-right:none;}
.rb-icons{display:flex;gap:4px;}
.rb-icons button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;min-width:64px;}
.rb-icons button .ic{font-size:24px;line-height:1;}
.rb-icons button .ic svg{width:22px;height:22px;stroke:var(--navy);}
.rb-icons button .lb{font-size:10.5px;color:#444;white-space:nowrap;font-weight:500;}
html[data-theme="dark"] .rb-icons button .lb{color:#c7cad1;}
.rb-icons button:hover{background:var(--brand-teal-l);}
.rb-icons button.active{background:var(--brand-teal-l);border-color:var(--amber);}
.rb-icons button.active .ic svg{stroke:var(--amber-dark);}
.rb-icons button.disabled{opacity:.38;cursor:not-allowed;}
.rb-icons button.disabled:hover{background:none;}
html[data-theme="dark"] .rb-icons button:hover{background:#3d4250;}
html[data-theme="dark"] .rb-icons button.active{background:#164a3c;}
.rb-caption{font-size:10px;color:#8a8f99;text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
.ribbon-toolbar.reports-mode{overflow-x:hidden;padding-left:5px;padding-right:5px;justify-content:stretch}.ribbon-toolbar.reports-mode .rb-group{padding:0 3px;min-width:0;flex:1 1 auto}.ribbon-toolbar.reports-mode .rb-icons{gap:0;width:100%;justify-content:center}.ribbon-toolbar.reports-mode .rb-icons button{width:clamp(58px,7.25vw,108px);min-width:0;padding:5px 2px}.ribbon-toolbar.reports-mode .rb-icons button .lb{white-space:normal;text-align:center;line-height:1.2;min-height:25px;font-size:10px;overflow-wrap:anywhere}.ribbon-toolbar.reports-mode .rb-icons button .ic{font-size:23px}.ribbon-toolbar.reports-mode .rb-caption{white-space:nowrap}@media(max-width:1050px){.ribbon-toolbar.reports-mode .rb-icons button .lb{font-size:11px}.ribbon-toolbar.reports-mode .rb-icons button .ic{font-size:20px}.ribbon-toolbar.reports-mode .rb-group{padding:0 1px}.ribbon-toolbar.reports-mode .rb-caption{font-size:11px}}
.ribbon-flyout{position:fixed;z-index:80;background:#fff;border:1px solid #aaa;box-shadow:0 5px 14px #0003;min-width:255px;padding:0}.ribbon-flyout button{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;width:100%!important;min-width:0!important;border:0!important;border-radius:0!important;padding:12px!important;gap:12px!important;text-align:left}.ribbon-flyout button:hover{background:#eee!important}.scale-config-modal{width:650px!important;max-width:calc(100vw - 32px)!important;padding:0!important;border-radius:0!important}.scale-config{margin:13px;border:1px solid #bbb;padding:16px;min-height:520px}.scale-config h4{margin:7px 0 13px}.scale-config select,.scale-config input{height:36px;border-radius:0;border-color:#aaa}.scale-config .row{gap:6px}.scale-capture label{display:flex;gap:8px;align-items:flex-start;margin:12px 0}.scale-capture input{width:auto;height:auto}.app-config-modal{width:680px!important;max-width:calc(100vw - 32px)!important;padding:0!important;border-radius:0!important}.app-config-body{margin:13px;border:1px solid #bbb;padding:18px;min-height:360px}.app-status{display:flex;align-items:center;justify-content:space-between;background:#e8e8e8;padding:13px;margin-bottom:17px}.app-status .tag{font-size:12px}
.sms-window-modal{width:calc(100vw - 110px)!important;max-width:1170px!important;height:calc(100vh - 115px);min-height:570px;padding:0!important;border-radius:0!important;overflow:hidden!important}.sms-window-modal>h3{height:40px;padding:10px 12px}.sms-window-body{height:calc(100% - 40px);display:flex;flex-direction:column}.sms-toolbar{height:72px;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 14px}.sms-toolbar .op-btn{height:47px;min-width:145px}.sms-welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;color:#555}.sms-welcome .sms-icon{font-size:48px}.sms-welcome h2{font-family:'Inter';text-transform:none;font-size:19px}.sms-welcome p{max-width:720px;line-height:1.8}.campaign-modal{width:760px!important;max-width:calc(100vw - 32px)!important;padding:0!important;border-radius:0!important}.campaign-body{margin:13px;border:1px solid #bbb;padding:16px;min-height:430px}.campaign-rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}.campaign-rules label{display:flex;gap:8px;align-items:center;padding:9px;border:1px solid #ddd}.campaign-rules input{width:auto;height:auto}@media(max-width:750px){.sms-window-modal{width:calc(100vw - 24px)!important;height:calc(100vh - 24px)}.campaign-rules{grid-template-columns:1fr}}
.integration-modal{width:760px!important;max-width:calc(100vw - 32px)!important;padding:0!important;border-radius:0!important}.integration-form{margin:13px;border:1px solid #bbb;padding:16px;min-height:390px}.integration-form input,.integration-form select{height:36px;border-radius:0;border-color:#aaa}.nfe-stock-modal{width:1100px!important;max-width:calc(100vw - 32px)!important;height:calc(100vh - 72px);min-height:620px;padding:0!important;border-radius:0!important;overflow:hidden!important}.nfe-stock-body{height:calc(100% - 40px);display:flex;flex-direction:column;padding:13px}.nfe-import-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;padding:14px;border:1px solid #bbb;background:#f4f4f4}.nfe-summary{display:grid;grid-template-columns:1.5fr .7fr .7fr 1fr .8fr;gap:1px;margin-top:10px;border:1px solid #bbb;background:#bbb}.nfe-summary>div{min-width:0;padding:8px 10px;background:#f7f7f7}.nfe-summary small{display:block;color:#777}.nfe-summary b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nfe-preview{flex:1;min-height:0;margin-top:10px}.nfe-preview select{min-width:190px;height:30px}.nfe-preview input[type=checkbox]{width:17px;height:17px}.nfe-actions{display:flex;justify-content:space-between;gap:10px;padding-top:12px}.nfe-actions .right{display:flex;gap:10px}

/* ===== STATUS BAR (rodapé) ===== */
.statusbar{background:var(--navy);color:#cfd8e8;display:flex;justify-content:space-between;align-items:center;padding:8px 20px;font-size:11.5px;flex-wrap:wrap;gap:10px;}
.winbar,.ribbon,.statusbar{flex:0 0 auto}.statusbar{position:relative;z-index:4}
.statusbar .st-metrics{display:flex;gap:20px;flex-wrap:wrap;}
.statusbar .st-metrics b{color:var(--amber);font-family:'Space Mono';}
.statusbar .st-metrics b.open{color:#7fd4a0;} .statusbar .st-metrics b.closed{color:#e78787;}

main{padding:24px 24px 44px;width:100%;max-width:none;margin:0;min-width:0;min-height:0;flex:1 1 auto;overflow:auto;}
@media(max-width:760px){
  .ribbon-toolbar{padding:6px 8px;}
  .rb-group{padding:0 8px;}
  main{padding:16px;}
  .winbar .wb-title{display:none;}
}
.view{display:none;min-width:0;max-width:100%;padding-bottom:2px;} .view.active{display:block;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;}
.panel h2{font-size:16px;margin:0 0 4px;color:var(--navy);}
.panel .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--amber);border-color:var(--amber);}
.row{display:flex;gap:10px;} .row>*{flex:1;}

.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:10px 16px;border-radius:6px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em;}
.btn:hover{background:var(--navy);color:#fff;}
.btn-primary{background:var(--amber);border-color:var(--amber-dark);color:var(--navy);}
.btn-primary:hover{background:var(--amber-dark);color:#fff;}
.btn-danger{border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-green{border-color:var(--green);color:var(--green);}
.btn-green:hover{background:var(--green);color:#fff;}
.btn-blue{border-color:var(--blue);color:var(--blue);}
.btn-blue:hover{background:var(--blue);color:#fff;}
.btn-sm{padding:6px 10px;font-size:11.5px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.btn[disabled]:hover{background:#fff;color:var(--navy);}
.btn-block{width:100%;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 8px;background:var(--navy);color:#cfd8e8;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:#faf7ef;}

.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.tag-green{background:var(--green-l);color:var(--green);}
.tag-red{background:var(--red-l);color:var(--red);}
.tag-amber{background:#fdf1de;color:var(--amber-dark);}
.tag-blue{background:var(--blue-l);color:var(--blue);}
.tag-gray{background:#eee;color:#777;}

.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px;}
.card-list{display:flex;flex-direction:column;gap:10px;}
.tab-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.tab-card .who{font-weight:600;font-size:14px;} .tab-card .meta{font-size:12px;color:var(--muted);}
.tab-card .total{font-family:'Space Mono';font-weight:700;font-size:16px;color:var(--navy);}

.modal-overlay{position:fixed;inset:0;background:rgba(16,28,51,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:16px;overflow:auto;}
.modal{background:#fff;border-radius:10px;max-width:600px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;margin:auto 0;min-height:0;}
.modal.wide{max-width:760px;}
.modal h3{margin:0 0 14px;font-size:17px;color:var(--navy);}
.modal-close{float:right;background:none;border:none;font-size:18px;color:var(--muted);}
.modal-title{cursor:move;user-select:none;}
.icn{display:inline-flex;vertical-align:-4px;margin-right:4px;}
.np-section{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;}
.np-section select,.np-section input{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:13.5px;background:#fff;}
.np-label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.np-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.np-row2>div .np-label{margin-bottom:6px;}
.np-product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:230px;overflow:auto;margin-top:10px;}
.np-product-grid .btn{min-width:0;height:40px;}
.np-empty{text-align:center;padding:10px;color:var(--muted);font-size:12.5px;margin:0;}
.np-cart{background:#fff;padding-top:10px;padding-bottom:10px;}
.np-origin-badge{background:#eef0f6;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.np-cat-tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 2px;padding-bottom:6px;scrollbar-width:thin;}
.np-cat-tabs::-webkit-scrollbar{height:5px;}
.np-cat-tabs::-webkit-scrollbar-thumb{background:#d3d5df;border-radius:4px;}
.np-cat-tabs::-webkit-scrollbar-track{background:transparent;}
.np-cat-tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;}
.import-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;}
.import-tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;margin-right:22px;font-size:13px;color:var(--muted);font-weight:600;}
.import-tab.active{color:var(--navy);border-color:var(--amber);}
.import-sheet-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.import-sheet-item{display:block;width:100%;text-align:left;background:#fff;border:none;padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line);}
.import-sheet-item:last-child{border-bottom:none;}
.import-sheet-item.active{background:var(--navy);color:#fff;}
.np-cat-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.np-prod-btn{position:relative;display:flex!important;flex-direction:column;align-items:flex-start!important;justify-content:flex-start!important;gap:4px;text-align:left;min-height:56px;padding:9px 10px!important;}
.np-prod-btn .np-prod-name{font-size:12.5px;font-weight:600;line-height:1.3;color:var(--ink);word-break:break-word;}
.np-prod-btn .np-prod-price{margin-top:auto;align-self:flex-end;font-size:12.5px;color:var(--navy);font-weight:700;}
.np-prod-btn.has-qty{border-color:var(--amber)!important;background:var(--brand-teal-l)!important;}
.np-prod-btn .np-qty-badge{position:absolute;top:-7px;right:-7px;background:var(--amber);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.np-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:16px;font-weight:700;color:var(--navy);}

/* ===== MODO GARÇOM (mobile — no padrão Consumer) ===== */
:root{ --gc-blue:#1C86EE; --gc-green:#2E9E5B; --gc-amber:#9C6212; --gc-orange:#A8560D; --gc-purple:#AE2D96; }
#garcomApp{display:none;min-height:100vh;background:#F4F4F6;}
#garcomApp.show{display:block;}
.gc-bar{background:var(--gc-blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;z-index:20;}
.gc-bar .gc-title{font-size:17px;font-weight:600;}
.gc-bar .gc-title small{display:block;font-size:11px;font-weight:400;opacity:.85;}
.gc-bar .gc-menu-btn{background:none;border:none;color:#fff;padding:6px;}
.gc-bar .gc-menu-btn svg{width:22px;height:22px;stroke:#fff;}
.gc-menu-panel{display:none;position:absolute;right:10px;top:52px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:30;overflow:hidden;min-width:170px;}
.gc-menu-panel.open{display:block;}
.gc-menu-panel button{display:block;width:100%;text-align:left;padding:12px 16px;border:none;background:#fff;font-size:14px;color:var(--ink);border-bottom:1px solid #eee;}

}

function buildNav(){
  const allowed = rolePermissions(currentUser.role);
  const tabs = currentUser.role==='cozinha' ? SIMPLE_RIBBON_COZINHA : RIBBON_TABS;
  visibleTabs = tabs;
  activeRibbonTab = tabs[0].id;
  activeView = currentUser.role==='cozinha' ? 'cozinha' : 'comandas';
  activeViewRibbonTab=activeRibbonTab;viewHistory=[];
  renderRibbonTabs(); renderRibbonToolbar();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+activeView).classList.add('active');
  updateTitle();
}
function renderRibbonTabs(){
  const el = document.getElementById('ribbonTabs');
  el.innerHTML = visibleTabs.map(t=>`<button data-tab="${t.id}" class="${t.id===activeRibbonTab?'active':''}">${t.label.toUpperCase()}</button>`).join('');
  el.onclick = (e)=>{ const btn=e.target.closest('button[data-tab]'); if(!btn) return; activeRibbonTab=btn.dataset.tab; renderRibbonTabs(); renderRibbonToolbar(); };
}
function renderRibbonToolbar(){
  const el = document.getElementById('ribbonToolbar');
  const allowed = rolePermissions(currentUser.role);
  const tab = visibleTabs.find(t=>t.id===activeRibbonTab);
  if(!tab){ el.innerHTML=''; return; }
  el.classList.toggle('reports-mode',tab.id==='relatorios');
  el.innerHTML = tab.groups.map(g=>`
    <div class="rb-group">
      <div class="rb-icons">${g.items.map(it=>{
        const hasAction = !!it.action;
        const hasView = !!it.view;
        const permitted = hasView ? allowed.includes(it.view) : true;
        const enabled = permitted;
        const reason = !hasAction && !hasView ? 'Abrir detalhes e requisitos do módulo'
          : (!permitted ? 'Sem permissão para o seu perfil' : '');
        return `<button class="${enabled?'':'disabled'} ${(it.view && it.view===activeView)||it.label===activeRibbonAction?'active':''}" title="${reason}"
          onclick="${enabled ? (hasAction ? `${it.action}(${it.actionArg?`'${it.actionArg}'`:''})` : hasView ? `openRibbonView('${it.view}','${h(it.label)}')` : `openReferenceModule('${h(it.label)}')`) : `toast('${reason}')`}">
          <span class="ic">${it.icon}</span><span class="lb">${it.label}</span></button>`;
      }).join('')}</div>
      <div class="rb-caption">${g.label}</div>
    </div>`).join('');
}
function openRibbonView(viewId,label){ activeRibbonAction=label||''; switchView(viewId); }
function openReportView(label){activeRibbonAction=label;switchView('relatorios');}
function switchView(viewId){
  if(activeView&&activeView!==viewId){viewHistory.push({view:activeView,tab:activeViewRibbonTab||activeRibbonTab,action:activeRibbonAction});if(viewHistory.length>30)viewHistory.shift();}
  activeView = viewId;
  activeViewRibbonTab=activeRibbonTab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+activeView).classList.add('active');
  renderRibbonToolbar(); updateTitle(); renderAll();
}
function closeOperationalWindow(){
  const modalRoot=document.getElementById('modalRoot');
  if(modalRoot&&modalRoot.innerHTML.trim()){closeModal();return;}
  if(activeView==='config-sistema'&&(settingsPane==='impressora'||settingsPane==='numeracao')){settingsPane='geral';activeRibbonAction='Configurações do Sistema';renderRibbonToolbar();renderConfigSistema();updateTitle();return;}
  let previous=null;while(viewHistory.length&&!previous){const candidate=viewHistory.pop();if(candidate&&candidate.view!==activeView&&document.getElementById('view-'+candidate.view))previous=candidate;}
  if(previous){activeView=previous.view;activeRibbonTab=previous.tab;activeViewRibbonTab=previous.tab;activeRibbonAction=previous.action||'';renderRibbonTabs();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+activeView).classList.add('active');renderRibbonToolbar();updateTitle();renderAll();return;}
  const home=currentUser&&currentUser.role==='cozinha'?'cozinha':'comandas';activeRibbonTab=currentUser&&currentUser.role==='cozinha'?'cozinha_tab':'principal';activeRibbonAction='';activeView=home;activeViewRibbonTab=activeRibbonTab;renderRibbonTabs();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+home).classList.add('active');renderRibbonToolbar();updateTitle();renderAll();
}

let pendingNfeItems=[],pendingNfeMeta={};
function openNfeStockWindow(){pendingNfeItems=[];pendingNfeMeta={};openModal('Alterar Estoque com NFe',`<div class="nfe-stock-body"><div class="nfe-import-head"><div><b>Importar XML da Nota Fiscal Eletrônica</b><p class="sub">Selecione o XML para conferir a nota, os vínculos e as quantidades antes da entrada.</p><input id="nfeXmlFile" type="file" accept=".xml,text/xml,application/xml"></div><button class="op-btn" onclick="readNfeXml()">▧ &nbsp; Ler XML</button></div><div id="nfeSummary" class="nfe-summary"><div><small>Fornecedor</small><b>—</b></div><div><small>Número</small><b>—</b></div><div><small>Série</small><b>—</b></div><div><small>Emissão</small><b>—</b></div><div><small>Total</small><b>R$ 0,00</b></div></div><div class="finance-grid nfe-preview"><table><thead><tr><th style="width:44px"><input type="checkbox" checked onchange="document.querySelectorAll('.nfe-apply').forEach(x=>x.checked=this.checked);updateNfeSelection()"></th><th>Código</th><th>Produto da NFe</th><th>Quantidade</th><th>Un.</th><th>Valor Unitário</th><th>Vincular ao Insumo</th></tr></thead><tbody id="nfePreviewRows"><tr><td colspan="7" class="empty">Nenhum arquivo carregado.</td></tr></tbody></table></div><div class="nfe-actions"><span id="nfeSelectionStatus" class="sub">0 item selecionado</span><div class="right"><button class="consumer-back" onclick="closeModal()">〈 Voltar</button><button class="op-btn" onclick="clearNfeImport()">Limpar</button><button class="consumer-save" onclick="applyNfeStock()">✓ Atualizar Estoque</button></div></div></div>`,true);document.querySelector('#modalRoot .modal').classList.add('nfe-stock-modal');}
function xmlValue(node,name){return node.getElementsByTagName(name)[0]?.textContent?.trim()||'';}
function nfeNormalized(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();}
function findNfeInsumo(item){return state.insumos.find(ins=>(item.code&&String(ins.nfeCode||ins.code||'')===String(item.code))||nfeNormalized(ins.name)===nfeNormalized(item.name));}
function clearNfeImport(){pendingNfeItems=[];pendingNfeMeta={};const file=document.getElementById('nfeXmlFile');if(file)file.value='';document.getElementById('nfeSummary').innerHTML='<div><small>Fornecedor</small><b>—</b></div><div><small>Número</small><b>—</b></div><div><small>Série</small><b>—</b></div><div><small>Emissão</small><b>—</b></div><div><small>Total</small><b>R$ 0,00</b></div>';document.getElementById('nfePreviewRows').innerHTML='<tr><td colspan="7" class="empty">Nenhum arquivo carregado.</td></tr>';updateNfeSelection();}
function updateNfeSelection(){const checked=[...document.querySelectorAll('.nfe-apply:checked')],linked=checked.filter(x=>document.getElementById('nfeLink'+x.dataset.index)?.value).length,total=checked.reduce((sum,x)=>sum+(pendingNfeItems[Number(x.dataset.index)]?.qty||0)*(pendingNfeItems[Number(x.dataset.index)]?.unitValue||0),0),status=document.getElementById('nfeSelectionStatus');if(status)status.textContent=`${checked.length} item(ns) selecionado(s) • ${linked} vinculado(s) • ${fmt(total)}`;}
function readNfeXml(){const file=document.getElementById('nfeXmlFile').files[0];if(!file){toast('Selecione um arquivo XML.');return;}const reader=new FileReader();reader.onload=()=>{const xml=new DOMParser().parseFromString(reader.result,'application/xml');if(xml.querySelector('parsererror')){toast('XML inválido.');return;}const inf=xml.getElementsByTagName('infNFe')[0],emit=xml.getElementsByTagName('emit')[0],ide=xml.getElementsByTagName('ide')[0],total=xml.getElementsByTagName('ICMSTot')[0];pendingNfeMeta={key:String(inf?.getAttribute('Id')||'').replace(/^NFe/,''),number:xmlValue(ide,'nNF'),series:xmlValue(ide,'serie'),issuedAt:xmlValue(ide,'dhEmi')||xmlValue(ide,'dEmi'),supplier:xmlValue(emit,'xNome'),document:xmlValue(emit,'CNPJ')||xmlValue(emit,'CPF'),total:Number(xmlValue(total,'vNF'))||0,fileName:file.name};const imports=state.settings.nfeImports||[];if(pendingNfeMeta.key&&imports.some(x=>x.key===pendingNfeMeta.key)){pendingNfeItems=[];toast('Esta NFe já foi aplicada ao estoque.');return;}pendingNfeItems=[...xml.getElementsByTagName('det')].map((det,i)=>{const p=det.getElementsByTagName('prod')[0];return{id:'nfe-'+i,code:xmlValue(p,'cProd'),name:xmlValue(p,'xProd'),qty:Number(xmlValue(p,'qCom'))||0,unit:xmlValue(p,'uCom'),unitValue:Number(xmlValue(p,'vUnCom'))||0};});document.getElementById('nfeSummary').innerHTML=`<div title="${h(pendingNfeMeta.supplier)}"><small>Fornecedor</small><b>${h(pendingNfeMeta.supplier||'Não informado')}</b></div><div><small>Número</small><b>${h(pendingNfeMeta.number||'—')}</b></div><div><small>Série</small><b>${h(pendingNfeMeta.series||'—')}</b></div><div><small>Emissão</small><b>${pendingNfeMeta.issuedAt?h(pendingNfeMeta.issuedAt.slice(0,10).split('-').reverse().join('/')):'—'}</b></div><div><small>Total</small><b>${fmt(pendingNfeMeta.total)}</b></div>`;document.getElementById('nfePreviewRows').innerHTML=pendingNfeItems.length?pendingNfeItems.map((x,i)=>{const match=findNfeInsumo(x);return`<tr><td><input class="nfe-apply" data-index="${i}" type="checkbox" checked onchange="updateNfeSelection()"></td><td>${h(x.code)}</td><td>${h(x.name)}</td><td>${x.qty}</td><td>${h(x.unit)}</td><td>${fmt(x.unitValue)}</td><td><select id="nfeLink${i}" onchange="updateNfeSelection()"><option value="">Não vincular</option>${state.insumos.map(ins=>`<option value="${ins.id}" ${match&&match.id===ins.id?'selected':''}>${h(ins.name)}</option>`).join('')}</select></td></tr>`;}).join(''):'<tr><td colspan="7" class="empty">A NFe não contém itens de produto.</td></tr>';updateNfeSelection();};reader.onerror=()=>toast('Não foi possível ler o arquivo.');reader.readAsText(file);}
function applyNfeStock(){if(!pendingNfeItems.length){toast('Carregue uma NFe antes de atualizar.');return;}const imports=state.settings.nfeImports||[];if(pendingNfeMeta.key&&imports.some(x=>x.key===pendingNfeMeta.key)){toast('Esta NFe já foi aplicada ao estoque.');return;}const selected=[...document.querySelectorAll('.nfe-apply:checked')].map(x=>Number(x.dataset.index));if(!selected.length){toast('Selecione ao menos um item.');return;}const missing=selected.filter(i=>!document.getElementById('nfeLink'+i)?.value);if(missing.length){toast(`Vincule os ${missing.length} item(ns) selecionado(s) a um insumo.`);return;}const applied=[],at=new Date().toISOString();selected.forEach(i=>{const x=pendingNfeItems[i],id=document.getElementById('nfeLink'+i).value,ins=state.insumos.find(y=>y.id===id);if(!ins)return;const before=Number(ins.stock)||0;ins.stock=before+x.qty;ins.costPerUnit=x.unitValue||ins.costPerUnit;if(x.code&&!ins.nfeCode)ins.nfeCode=x.code;state.stockMovements.unshift({id:uid(),type:'entrada',name:ins.name,unit:ins.unit,operation:`NFe ${pendingNfeMeta.number||''}`.trim(),reference:pendingNfeMeta.key||pendingNfeMeta.fileName,before,qty:x.qty,after:ins.stock,user:currentUser.name,at});applied.push({code:x.code,name:x.name,qty:x.qty,unit:x.unit,unitValue:x.unitValue,insumoId:ins.id});});if(!applied.length){toast('Nenhum item pôde ser atualizado.');return;}state.settings.nfeImports=imports;imports.unshift({...pendingNfeMeta,id:uid(),importedAt:at,user:currentUser.name,items:applied});save('insumos');save('stockMovements');save('settings');closeModal();renderAll();toast(`${applied.length} item(ns) atualizado(s) pela NFe ${pendingNfeMeta.number||''}.`);}

function toggleAppRibbonMenu(kind){const anchor=event.currentTarget,existing=document.querySelector('.ribbon-flyout');if(existing){existing.remove();return;}const box=document.createElement('div'),r=anchor.getBoundingClientRect();box.className='ribbon-flyout';box.style.left=Math.max(4,Math.min(r.left,window.innerWidth-275))+'px';box.style.top=r.bottom+'px';box.innerHTML=kind==='bina'?`<button onclick="closeRibbonFlyout();openBinaConfig()"><span style="font-size:25px">⚙</span> Ativar / Configurar</button><button onclick="closeRibbonFlyout();openCallHistory()"><span style="font-size:25px">📞</span> Histórico de Chamadas</button>`:`<button onclick="closeRibbonFlyout();openMapKeyConfig()"><span style="font-size:25px">🔑</span> Definir Chave Para Mapas</button><button onclick="closeRibbonFlyout();reprocessMemberGeolocation()"><span style="font-size:25px">⚙</span> Reprocessar Geolocalização</button><button onclick="closeRibbonFlyout();openCustomerMap()"><span style="font-size:25px">🗺️</span> Mapa de Clientes</button>`;document.body.appendChild(box);}

function saveCallRecord(id){const phone=document.getElementById('callPhone').value.trim(),at=document.getElementById('callAt').value;if(!phone||!at){toast('Informe data e telefone.');return;}state.settings.callHistory=state.settings.callHistory||[];const item=state.settings.callHistory.find(x=>x.id===id),data={phone,at:new Date(at).toISOString(),customer:document.getElementById('callCustomer').value.trim(),duration:document.getElementById('callDuration').value,status:document.getElementById('callStatus').value,notes:document.getElementById('callNotes').value.trim()};if(item)Object.assign(item,data);else state.settings.callHistory.unshift({id:uid(),...data});save('settings');closeModal();toast('Chamada registrada.');}

let modalDragState=null;
if(typeof document.addEventListener==='function'){
  document.addEventListener('mousedown', e=>{
    const handle = e.target.closest && e.target.closest('#modalRoot .modal>h3.modal-title, #modalRoot .modal>h3');
    if(!handle) return;
    const modal = handle.closest('.modal'); if(!modal) return;
    const rect = modal.getBoundingClientRect();
    modalDragState = { modal, offsetX: e.clientX-rect.left, offsetY: e.clientY-rect.top };
    modal.style.position='fixed'; modal.style.margin='0';
    modal.style.left=rect.left+'px'; modal.style.top=rect.top+'px';
    modal.style.right='auto'; modal.style.bottom='auto';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove', e=>{
    if(!modalDragState) return;
    let left=e.clientX-modalDragState.offsetX, top=e.clientY-modalDragState.offsetY;
    left=Math.max(-modalDragState.modal.offsetWidth+80, Math.min(left, window.innerWidth-80));
    top=Math.max(0, Math.min(top, window.innerHeight-40));
    modalDragState.modal.style.left=left+'px'; modalDragState.modal.style.top=top+'px';
  });
  document.addEventListener('mouseup', ()=>{ modalDragState=null; document.body.style.userSelect=''; });
}

function importInsumosFile(format='csv'){insumoOptionsOpen=false;const input=document.createElement('input');input.type='file';input.accept=format==='json'?'.json,application/json':'.csv,text/csv';input.onchange=async()=>{const file=input.files&&input.files[0];if(!file)return;try{let incoming;if(format==='json'){const data=JSON.parse(await file.text());incoming=Array.isArray(data)?data:data&&data.format==='cantina-insumos'?data.insumos:null;if(!Array.isArray(incoming))throw new Error('Pacote de insumos inválido.');}else{const lines=(await file.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);incoming=lines.slice(1).map(line=>{const c=line.split(';').map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"'));return{code:(c[0]||'').trim(),name:(c[1]||'').trim(),unit:(c[2]||'un').trim(),stock:Number(String(c[3]||0).replace(',','.'))||0,minStock:Number(String(c[4]||0).replace(',','.'))||0,costPerUnit:Number(String(c[5]||0).replace(',','.'))||0,pdvCode:(c[6]||'').trim(),nfeCode:(c[7]||'').trim(),active:String(c[8]||'ativo').toLowerCase()!=='pausado'};}).filter(x=>x.name);}if(!incoming.length)throw new Error('Nenhum insumo válido foi encontrado.');if(!confirm(`Importar ${incoming.length} insumo(s) de ${file.name}? Registros com o mesmo código serão atualizados.`))return;let added=0,updated=0;incoming.forEach(raw=>{const code=String(raw.code||'').trim(),existing=state.insumos.find(x=>(raw.id&&x.id===raw.id)||(code&&x.code===code)||(raw.nfeCode&&x.nfeCode===raw.nfeCode));const target=existing||{id:raw.id||uid()};Object.assign(target,{code,name:String(raw.name||'').trim(),unit:UNIT_OPTIONS.includes(raw.unit)?raw.unit:'un',stock:Math.max(0,Number(raw.stock)||0),minStock:Math.max(0,Number(raw.minStock)||0),costPerUnit:Math.max(0,Number(raw.costPerUnit)||0),pdvCode:String(raw.pdvCode||''),nfeCode:String(raw.nfeCode||''),active:raw.active!==false});if(existing)updated++;else{state.insumos.push(target);added++;}});save('insumos');renderAll();toast(`${added} insumo(s) incluído( /* ============ PRODUTOS (com ficha técnica) ============ */
let tempRecipe = [];
function effectiveProductRecipe(product,seen){
  if(!product)return [];
  const visited=seen||new Set();if(visited.has(product.id))return [];visited.add(product.id);
  const quantities={};
  (product.recipe||[]).forEach(r=>quantities[r.insumoId]=(quantities[r.insumoId]||0)+(Number(r.qty)||0));
  (product.comboProductIds||[]).forEach(id=>effectiveProductRecipe(state.products.find(x=>x.id===id),new Set(visited)).forEach(r=>quantities[r.insumoId]=(quantities[r.insumoId]||0)+(Number(r.qty)||0)));
  return Object.entries(quantities).map(([insumoId,qty])=>({insumoId,qty}));
}
function productCost(p){ return effectiveProductRecipe(p).reduce((sum,r)=>{ const ins=state.insumos.find(i=>i.id===r.insumoId); return sum + (ins?ins.costPerUnit*r.qty:0); },0); }
function productAvailable(p){
  const recipe=effectiveProductRecipe(p);if(!recipe.length) return Infinity;
  return Math.floor(Math.min(...recipe.map(r=>{ const ins=state.insumos.find(i=>i.id===r.insumoId); return ins ? ins.stock / r.qty : 0; })));
}
function productAvailability(p){return productAvailable(p);}
let produtosTab = 'produto';
let selectedProductId = null;
let productOptionsOpen = false;
function productKind(p){ return p.kind==='tamanho'||p.kind==='combo' ? p.kind : 'produto'; }

function openSelectedProductStock(){if(!selectedProductId){toast('Selecione um produto para consultar o estoque.');return;}const p=state.products.find(x=>x.id===selectedProductId);if(!p)return;const recipe=p.recipe||[],availability=recipe.length?Math.max(0,Math.floor(Math.min(...recipe.map(r=>{const i=state.insumos.find(x=>x.id===r.insumoId);return i&&Number(r.qty)>0?Number(i.stock||0)/Number(r.qty):0})))):null,rows=recipe.map(r=>{const i=state.insumos.find(x=>x.id===r.insumoId);const qty=Number(r.qty)||0;return `<tr><td>${h(i&&i.name||'Insumo removido')}</td><td>${qty} ${h(i&&i.unit||'')}</td><td>${Number(i&&i.stock)||0} ${h(i&&i.unit||'')}</td><td>${qty>0?Math.floor((Number(i&&i.stock)||0)/qty):0}</td><td>${fmt((Number(i&&i.costPerUnit)||0)*qty)}</td><td>${Number(i&&i.stock)<=Number(i&&i.minStock)?'Estoque baixo':'Disponível'}</td></tr>`}).join('');openModal('Estoque — '+p.name,`<div class="grid3" style="padding:12px"><div class="stat"><div class="lbl">Disponibilidade estimada</div><div class="val">${availability===null?'—':availability}</div></div><div class="stat"><div class="lbl">Estoque mínimo</div><div class="val">${Number(p.minStock)||0}</div></div><div class="stat"><div class="lbl">Custo da ficha</div><div class="val" style="font-size:18px">${fmt(productCost(p))}</div></div></div><div class="finance-grid" style="height:360px"><table><thead><tr><th>Insumo</th><th>Consumo por venda</th><th>Estoque atual</th><th>Rendimento</th><th>Custo</th><th>Situação</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Produto sem ficha técnica. O estoque não pode ser calculado automaticamente.</td></tr>'}</tbody></table></div><div class="consumer-modal-actions"><button onclick="closeModal()">Voltar</button><button class="op-btn" onclick="closeModal();switchView('insumos')">Abrir Insumos</button><button class="consumer-save" onclick="openProductStockAdjustment('${p.id}')">Ajustar estoque</button></div>`,true);document.querySelector('#modalRoot .modal').classList.add('app-config-modal');}
function openProductStockAdjustment(productId){closeModal();const p=state.products.find(x=>x.id===productId),recipe=p&&p.recipe||[];if(!recipe.length){toast('Cadastre uma ficha técnica para ajustar os insumos deste produto.');return;}openModal('Ajustar Estoque — '+p.name,`<div class="consumer-form-frame"><p class="sub">Informe quantas unidades completas deseja adicionar ao estoque estimado. Cada insumo receberá sua quantidade proporcional da ficha técnica.</p><div class="field"><label>Unidades do produto</label><input id="productStockUnits" type="number" min="0.001" step="0.001" value="1"></div><div class="field"><label>Motivo</label><input id="productStockReason" placeholder="Inventário, compra ou correção"></div></div><div class="consumer-modal-actions"><button onclick="closeModal()">Voltar</button><button class="consumer-save" onclick="saveProductStockAdjustment('${productId}')">✓ Registrar entrada</button></div>`);document.querySelector('#modalRoot .modal').classList.add('finance-record-modal');}
function saveProductStockAdjustment(productId){const p=state.products.find(x=>x.id===productId),units=parseFloat(document.getElementById('productStockUnits').value),reason=document.getElementById('productStockReason').value.trim();if(!p||!Number.isFinite(units)||units<=0||!reason){toast('Informe unidades e motivo.');return;}(p.recipe||[]).forEach(r=>{const i=state.insumos.find(x=>x.id===r.insumoId);if(!i)return;const qty=units*Number(r.qty||0),before=Number(i.stock)||0;i.stock=before+qty;state.stockMovements.unshift({id:uid(),type:'entrada',name:i.name,insumoName:i.name,productId:p.id,operation:'Ajuste por produto',before,qty,after:i.stock,note:reason,user:currentUser.name,at:new Date().toISOString()});});save('insumos');save('stockMovements');closeModal();renderAll();toast('Entrada proporcional registrada.');}

  document.querySelector('#modalRoot .modal').classList.add('app-config-modal');

  closeModal();const p=state.products.find(x=>x.id===productId),recipe=effectiveProductRecipe(p);if(!p||!recipe.length){toast('Cadastre uma ficha técnica para ajustar os insumos deste produto.');return;}
  openModal('Ajustar Estoque — '+p.name,`<div class="consumer-form-frame"><p class="sub">Informe quantas unidades completas deseja adicionar. A composição total do produto ou combo será aplicada aos insumos.</p><div class="field"><label>Unidades do produto</label><input id="productStockUnits" type="number" min="0.001" step="0.001" value="1"></div><div class="field"><label>Motivo</label><input id="productStockReason" placeholder="Inventário, compra ou correção"></div></div><div class="consumer-modal-actions"><button onclick="closeModal()">Voltar</button><button class="consumer-save" onclick="saveProductStockAdjustment('${productId}')">✓ Registrar entrada</button></div>`);document.querySelector('#modalRoot .modal').classList.add('finance-record-modal');

function saveProductStockAdjustment(productId){
  const p=state.products.find(x=>x.id===productId),units=parseFloat(document.getElementById('productStockUnits').value),reason=document.getElementById('productStockReason').value.trim();if(!p||!Number.isFinite(units)||units<=0||!reason){toast('Informe unidades e motivo.');return;}

function pickProductsImport(format){
  productOptionsOpen=false;
  const input=document.createElement('input');input.type='file';
  input.accept=format==='csv'?'.csv,text/csv':format==='xlsx'?'.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel':'.ccprod,.json,application/json';
  input.onchange=()=>{
    const file=input.files&&input.files[0];if(!file)return;
    if(format==='xlsx'){
      if(!window.XLSX){toast('Não foi possível carregar o leitor de planilhas — verifique sua conexão e tente de novo.');return;}
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const wb=XLSX.read(reader.result,{type:'array'});
          const sheet=wb.Sheets[wb.SheetNames[0]];
          const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
          const incoming=parseProductsSheetRows(rows);
          mergeImportedProducts(incoming,file.name);
        }catch(error){toast(error.message||'Não foi possível ler essa planilha.');}
      };
      reader.onerror=()=>toast('Não foi possível ler o arquivo.');
      reader.readAsArrayBuffer(file);
      return;
    }
    const reader=new FileReader();
    reader.onload=()=>{try{const incoming=format==='csv'?parseProductsCsv(String(reader.result||'')):parseProductsPackage(String(reader.result||''));mergeImportedProducts(incoming,file.name);}catch(error){toast(error.message||'Não foi possível importar o arquivo.');}};
    reader.readAsText(file,'UTF-8');
  };
  input.click();
}
function pickHeaderValue(row,candidates){
  const keys=Object.keys(row);
  for(const cand of candidates){
    const found=keys.find(k=>k.trim().toLowerCase()===cand.toLowerCase());
    if(found!==undefined) return row[found];
  }
  return '';
}
function parseProductsSheetRows(rows){
  if(!rows.length) throw new Error('A planilha não possui linhas de produtos.');
  return rows.map(row=>{
    const name=String(pickHeaderValue(row,['Nome','Produto','Descrição'])||'').trim();
    const code=String(pickHeaderValue(row,['Código','Cód. Busca','Cod. Busca','Cód','Codigo'])||'').trim();
    const pdvCode=String(pickHeaderValue(row,['Cód. PDV','Cod. PDV','Código PDV'])||'').trim();
    const category=String(pickHeaderValue(row,['Categoria'])||'').trim();
    const measure=String(pickHeaderValue(row,['Medida','Unidade'])||'un').trim()||'un';
    const priceRaw=pickHeaderValue(row,['Preço Venda','Preço de venda','Preco Venda','Preço']);
    const costRaw=pickHeaderValue(row,['Preço Custo','Custo estimado','Preco Custo','Custo']);
    const minStockRaw=pickHeaderValue(row,['Estoque Mín','Estoque mínimo','Estoque Min']);
    const statusRaw=String(pickHeaderValue(row,['Status Venda','Status','Sit. Estoque'])||'ativo').trim().toLowerCase();
    return {
      name, code, pdvCode, category, measure,
      kind:'produto',
      price: Number(String(priceRaw||0).toString().replace(',','.'))||0,
      costPerUnit: Number(String(costRaw||0).toString().replace(',','.'))||0,
      minStock: Number(String(minStockRaw||0).toString().replace(',','.'))||0,
      active: statusRaw!=='pausado' && statusRaw!=='inativo'
    };
  }).filter(p=>p.name && !/^total\s*itens/i.test(p.name));
}
function parseProductsCsv(text){
  const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(ch===';'&&!quoted){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()))rows.push(row);row=[];}else cell+=ch;}if(cell||row.length){row.push(cell);rows.push(row);}if(rows.length<2)throw new Error('A planilha não possui produtos.');
  return rows.slice(1).map(cols=>({code:(cols[0]||'').trim(),kind:(cols[1]||'produto').trim(),category:(cols[2]||'').trim(),name:(cols[3]||'').trim(),measure:(cols[4]||'un').trim(),price:Number(String(cols[5]||0).replace(',','.'))||0,minStock:Number(String(cols[7]||0).replace(',','.'))||0,active:(cols[8]||'ativo').trim().toLowerCase()!=='pausado'})).filter(p=>p.name);
}
function parseProductsPackage(text){const data=JSON.parse(text);const list=Array.isArray(data)?data:data&&(data.format==='commandah-produtos'||data.format==='cantina-produtos')&&Array.isArray(data.products)?data.products:null;if(!list)throw new Error('Pacote de produtos inválido.');return list.filter(p=>p&&typeof p.name==='string'&&p.name.trim());}

function mergeImportedProducts(incoming,fileName){

  if(!confirm(`Importar ${incoming.length} produto(s) de ${fileName}? Produtos com o mesmo código serão atualizados.`))return;
  incoming.forEach(raw=>{
    const code=String(raw.code||'').trim();
    const pdvCode=String(raw.pdvCode||'').trim();
    const existing=state.products.find(p=>
      (raw.id&&p.id===raw.id) ||
      (pdvCode && String(p.pdvCode||'').trim()===pdvCode) ||
      (code && code!=='0' && String(p.code||'').trim()===code)
    );
    const normalized={...raw,id:existing?existing.id:(raw.id||uid()),name:String(raw.name).trim(),code,pdvCode,kind:['produto','tamanho','combo'].includes(raw.kind)?raw.kind:'produto',category:String(raw.category||''),measure:String(raw.measure||'un'),price:Math.max(0,Number(raw.price)||0),minStock:Math.max(0,Number(raw.minStock)||0),active:raw.active!==false,recipe:Array.isArray(raw.recipe)?raw.recipe:(existing&&existing.recipe||[])};
    if(existing)Object.assign(existing,normalized);else state.products.push(normalized);

}

function selectProductImage(){const input=document.getElementById('productImageFile');if(!input)return;input.onchange=()=>{const file=input.files&&input.files[0];if(!file)return;if(file.size>500000){toast('Escolha uma imagem de até 500 KB.');return;}const reader=new FileReader();reader.onload=()=>{window.productImageDraft=reader.result;const preview=document.getElementById('productImagePreview');if(preview)preview.innerHTML=`<img src="${reader.result}" alt="Produto" style="width:100%;height:100%;object-fit:contain">`;};reader.readAsDataURL(file);};input.click();}

function deleteProduct(id){
  const product=state.products.find(p=>p.id===id);if(!product)return;
  const activeUse=state.sales.some(s=>s.status==='open'&&(s.items||[]).some(i=>i.productId===id));
  if(activeUse){toast('Este produto está em um pedido aberto. Finalize ou remova o item antes de excluir.');return;}
  if(!confirm('Excluir este produto? O histórico de vendas será preservado.')) return;
  state.products=state.products.filter(p=>p.id!==id);state.products.forEach(p=>p.comboProductIds=(p.comboProductIds||[]).filter(productId=>productId!==id));
  save('products');renderAll();toast('Produto excluído.');logAction('Produto excluído: '+product.name);
}

function pickImportMembersExcelFile(){
  if(!window.XLSX){ toast('Não foi possível carregar o leitor de planilhas — verifique sua conexão e tente de novo.'); return; }
  const input=document.createElement('input'); input.type='file'; input.accept='.xlsx,.xls';
  input.onchange=()=>{
    const file=input.files&&input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        importMembersWorkbook = XLSX.read(reader.result,{type:'array'});
        importMembersSheetName = importMembersWorkbook.SheetNames[0];
        renderImportMembersSheetList();
        loadImportMembersSheet();
      }catch(e){ toast('Não foi possível ler esse arquivo.'); }
    };
    reader.onerror=()=>toast('Não foi possível ler o arquivo.');
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

  const el=document.getElementById('importMembersSheetList'); if(!el) return;
  el.innerHTML = importMembersWorkbook.SheetNames.map(name=>`<button class="import-sheet-item ${name===importMembersSheetName?'active':''}" onclick="selectImportMembersSheet('${h(name).replace(/'/g,"\\'")}')">${h(name)}</button>`).join('');

function selectImportMembersSheet(name){ importMembersSheetName=name; renderImportMembersSheetList(); loadImportMembersSheet(); }
function loadImportMembersSheet(){
  const sheet = importMembersWorkbook.Sheets[importMembersSheetName];
  const raw = XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
  if(!raw.length){ importMembersHeaders=[]; importMembersRows=[]; }
  else{
    importMembersHeaders = raw[0].map(c=>String(c||'').trim()).filter(Boolean);
    importMembersRows = raw.slice(1).filter(r=>r.some(v=>String(v||'').trim()) && !r.some(v=>/^total\s*(itens|registros)/i.test(String(v||''))));
  }
  IMPORT_MEMBER_FIELDS.forEach(f=>{
    const guess = importMembersHeaders.find(col=>f.guesses.some(g=>g.toLowerCase()===col.toLowerCase()));
    importMembersMapping[f.key] = guess || '';
  });
  renderImportMembersMapTable();
  renderImportMembersPreview();
  updateImportMembersStartState();
}

  const el=document.getElementById('importMembersMapRows'); if(!el) return;

function extractCotaFromName(rawName){
  const m = String(rawName||'').trim().match(/^(.*?)\s*-\s*(\d+)\s*-?\s*(.*)$/);
  if(!m) return { name: String(rawName||'').trim(), code:'' };
  const cleanName = m[1].trim();
  const cota = m[2].trim();
  const trailing = m[3].trim();
  return { name: trailing ? `${cleanName} (${trailing})` : cleanName, code: cota };
}
function fixExistingMemberCotas(){
  memberOptionsOpen=false;
  const candidates = state.members.filter(m=>!m.code && /^(.*?)\s*-\s*\d+/.test(m.name||''));
  if(!candidates.length){ toast('Nenhum cliente com esse padrão pendente de correção foi encontrado.'); return; }
  const preview = candidates.slice(0,5).map(m=>{ const r=extractCotaFromName(m.name); return `${h(m.name)} → <b>${h(r.name)}</b> (cota ${h(r.code)})`; }).join('<br>');
  openModal('Corrigir Cota nos Nomes Já Importados', `
    <p class="sub">Encontrados <b>${candidates.length}</b> clientes sem cota cadastrada, cujo nome parece ter o código no final (ex: "Fabricio - 1801"). Isso corrige o cadastro que já existe — não cria clientes novos.</p>
    <div class="panel" style="background:var(--cream);font-size:12.5px;line-height:1.8;padding:12px">${preview}${candidates.length>5?`<br><i>... e mais ${candidates.length-5}.</i>`:''}</div>
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmFixExistingMemberCotas()">Corrigir ${candidates.length} cliente(s)</button>
    </div>
  `);

function confirmFixExistingMemberCotas(){

    const r = extractCotaFromName(m.name);
    if(!r.code) return;
    const dup = state.members.find(x=>x.id!==m.id && x.code===r.code);
    if(dup) return;
    m.name = r.name; m.code = r.code; fixed++;
  });

  toast(fixed+' cliente(s) corrigido(s).');
  logAction('Correção de cota aplicada em '+fixed+' clientes já cadastrados');
}

// Mantém a conta de acesso real (Edge Function staff-auth) alinhada com o cadastro local.
// Sem Supabase (modo local) ou sem sessão, só grava localmente como sempre — nada quebra.
async function syncStaffAuth(id, existing, data){
  if(!supabaseClient) return;
  const needsCreateOrReset = !existing || !existing.migratedAuth || existing.pin!==data.pin;
  if(needsCreateOrReset){
    const action = (existing && existing.migratedAuth) ? 'reset_pin' : 'create_operator';
    try{
      const { data: fnData, error } = await supabaseClient.functions.invoke('staff-auth', { body:{ action, staff_id:id, name:data.name, role:data.role, pin:data.pin } });
      if(error || !fnData || fnData.error) toast('Aviso: não foi possível configurar o acesso seguro agora ('+((fnData&&fnData.error)||'erro')+'). Salvo só localmente — tente salvar de novo depois.');
      else data.migratedAuth = true;
    }catch(e){ toast('Aviso: não foi possível configurar o acesso seguro agora. Salvo só localmente — tente salvar de novo depois.'); }
  } else {
    data.migratedAuth = true;
  }
  if(existing && existing.migratedAuth && (existing.active!==false) !== (data.active!==false)){
    try{ await supabaseClient.functions.invoke('staff-auth', { body:{ action:'set_active', staff_id:id, active:data.active!==false } }); }catch(e){}
  }
}
async function migrateAllStaffAuth(){
  userOptionsOpen=false;
  if(!supabaseClient){ toast('Disponível só no modo nuvem (Supabase).'); return; }
  const pending = state.users.filter(u=>!u.migratedAuth);
  if(!pending.length){ toast('Todos os colaboradores já estão com acesso seguro.'); renderUsuarios(); return; }
  if(!confirm(`Migrar ${pending.length} colaborador(es) pro acesso seguro agora? Não muda os PINs — só passa a validá-los pelo servidor.`)) return;
  let ok=0, fail=0;
  for(const u of pending){
    try{
      const { data: fnData, error } = await supabaseClient.functions.invoke('staff-auth', { body:{ action:'create_operator', staff_id:u.id, name:u.name, role:u.role, pin:u.pin } });
      if(error || !fnData || fnData.error) fail++; else { u.migratedAuth = true; ok++; }
    }catch(e){ fail++; }
  }
  await save('users'); renderUsuarios();
  toast(`Migração concluída: ${ok} colaborador(es) migrado(s)`+(fail?`, ${fail} falharam (tente de novo depois)`:'.'));
}

}

/* ============ COZINHA (KDS) ============ */
function requiredInsumosForItems(items){
  const required = {};
  items.forEach(it=>{
    const p=state.products.find(x=>x.id===it.productId);
    effectiveProductRecipe(p).forEach(r=>required[r.insumoId]=(required[r.insumoId]||0)+(Number(r.qty)||0)*(Number(it.qty)||0));
    ((it.customization&&it.customization.complementIds)||[]).forEach(id=>{
      const complement=state.complementos.find(x=>x.id===id);
      (complement&&complement.recipe||[]).forEach(r=>required[r.insumoId]=(required[r.insumoId]||0)+(Number(r.qty)||0)*(Number(it.qty)||0));
    });
  });
  return required;
}
function canFulfillItems(items){
  return Object.entries(requiredInsumosForItems(items)).every(([id,qty])=>{
    const ins=state.insumos.find(x=>x.id===id);
    return ins && Number(ins.stock)>=qty-1e-9;
  });
}
function consumeInsumosForItems(items){
  if(!canFulfillItems(items)) return false;
  items.forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    effectiveProductRecipe(p).forEach(r=>{
      const ins = state.insumos.find(x=>x.id===r.insumoId);
      if(ins){const qty=r.qty*it.qty;const before=Number(ins.stock)||0;ins.stock-=qty;state.stockMovements.unshift({id:uid(),insumoId:ins.id,name:ins.name,unit:ins.unit,type:'saida',operation:productKind(p)==='combo'?'Baixa por ficha do combo: '+p.name:'Baixa por ficha técnica',before,qty,after:ins.stock,user:currentUser?currentUser.name:'—',at:new Date().toISOString()});}
    });
    ((it.customization&&it.customization.complementIds)||[]).forEach(id=>{
      const complement=state.complementos.find(x=>x.id===id);
      (complement&&complement.recipe||[]).forEach(r=>{
        const ins=state.insumos.find(x=>x.id===r.insumoId);
        if(ins){const qty=(Number(r.qty)||0)*(Number(it.qty)||0),before=Number(ins.stock)||0;ins.stock-=qty;state.stockMovements.unshift({id:uid(),insumoId:ins.id,name:ins.name,unit:ins.unit,type:'saida',operation:'Baixa por complemento: '+complement.nome,before,qty,after:ins.stock,user:currentUser?currentUser.name:'—',at:new Date().toISOString()});}
      });
    });
  });
  save('insumos');save('stockMovements');
  return true;
}
function saidaModoEstacao(estacao){
  const e = state.estacoes.find(x=>x.chave===estacao);
  return e ? e.saida : (estacao==='cozinha' ? 'ambos' : 'imprime');
}
function saidaTemTela(estacao){ const m=saidaModoEstacao(estacao); return m==='ambos'||m==='tela'; }
function saidaTemImpressao(estacao){ const m=saidaModoEstacao(estacao); return m==='ambos'||m==='imprime'; }
function sendItemsToKitchen(saleId, items, who, source, local){
  if(!items.length) return false;
  if(!consumeInsumosForItems(items)){ toast('Estoque insuficiente para enviar todos os itens. Revise as quantidades.'); return false; }
  const monitorItems=items.filter(i=>{const product=state.products.find(p=>p.id===i.productId);const estacao=product&&product.estacao?product.estacao:'cozinha';return saidaTemTela(estacao);});
  if(!monitorItems.length) return true;
  const order = { id:uid(), saleId, who, local: local||'', items: monitorItems.map(i=>({productId:i.productId,name:i.name,qty:i.qty,price:i.price,notes:i.notes||'',customization:i.customization?JSON.parse(JSON.stringify(i.customization)):null})),
    status:'pendente', createdAt:new Date().toISOString(), source };
  state.orders.unshift(order); save('orders');
  return true;
}

}

function returnKitchenOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const previous={preparo:'pendente',pronto:'preparo',entregue:'pronto'}[o.status];if(!previous)return;if(!confirm('Retornar o pedido para a etapa anterior?'))return;const from=o.status;o.status=previous;o.statusHistory=Array.isArray(o.statusHistory)?o.statusHistory:[];o.statusHistory.push({from,to:previous,at:new Date().toISOString(),user:currentUser.name,reason:'Retorno manual'});save('orders');closeModal();renderAll();}

/* ============ VENDA — lógica compartilhada Balcão/Comandas ============ */
function newDraft(type){ currentSaleDraft = { items:[], memberId:null, customerName:'', type }; }
function productEnabledForCurrentChannel(product){
  if(!product||product.active===false)return false;
  const channels=product.channels||{};
  const channel=currentSaleDraft&&currentSaleDraft.type==='delivery'?'online':currentSaleDraft&&currentSaleDraft.type==='comanda'?'mobile':'pdv';
  return channels[channel]!==false;
}
function renderProductPicker(containerId){

  if(!state.products.length){ el.innerHTML = `<p class="empty">Cadastre produtos na aba Produtos antes de vender.</p>`; return; }
  el.innerHTML = `<div class="grid3">` + state.products.filter(productEnabledForCurrentChannel).sort((a,b)=>(Number(a.sortOrder)||0)-(Number(b.sortOrder)||0)).map(p=>{
    const av = productAvailable(p); const out = av!==Infinity && av<=0;
    return `<button class="btn" style="text-align:left;display:flex;align-items:center;gap:8px;justify-content:space-between" data-search="${h(p.name.toLowerCase())}" ${out?'disabled':''} onclick="addDraftItem('${p.id}')">

function addDraftItem(productId){
  if(currentSaleDraft&&currentSaleDraft.type==='comanda'&&!window.currentComandaRequester){toast('Selecione quem está solicitando antes de adicionar o produto.');return;}
  if(currentSaleDraft&&currentSaleDraft.type==='comanda'&&window.currentComandaRequester&&window.currentComandaRequester.canOrder===false){toast('Esta pessoa está bloqueada para consumir nesta cota.');return;}
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const questions=(p.questionIds||[]).map(id=>state.perguntas.find(q=>q.id===id)).filter(q=>q&&q.active!==false);
  const complements=(p.complementIds||[]).map(id=>state.complementos.find(c=>c.id===id)).filter(c=>c&&c.active!==false);
  const observations=(p.observationIds||[]).map(id=>state.observacoes.find(o=>o.id===id)).filter(Boolean);
  const sizes=(p.sizeIds||[]).map(id=>state.complementos.find(s=>s.id===id)).filter(s=>s&&s.recordKind==='size'&&s.active!==false);
  if(questions.length||complements.length||observations.length||sizes.length){ openProductCustomization(productId,questions,complements,observations,sizes); return; }
  commitDraftItem(productId,null);
}
function commitDraftItem(productId,customization){
  const p=state.products.find(x=>x.id===productId);if(!p)return;
  const comboItems=(p.comboProductIds||[]).map(id=>state.products.find(x=>x.id===id)).filter(Boolean).map(x=>({productId:x.id,name:x.name,qty:1}));
  if(comboItems.length){customization=customization?{...customization}:{answers:[],complementIds:[],observationIds:[],notes:'',extra:0};const comboText='Combo: '+comboItems.map(x=>x.name).join(', ');customization.comboItems=comboItems;customization.summary=[comboText,customization.summary].filter(Boolean).join(' · ');}
  const extra=customization?Number(customization.extra)||0:0;
  const requester=currentSaleDraft.type==='comanda'?window.currentComandaRequester:null,requesterKey=requester&&requester.key||'';
  const signature=(customization?JSON.stringify({sizeId:customization.sizeId||null,answers:customization.answers,complementIds:customization.complementIds,observationIds:customization.observationIds,notes:customization.notes}):'')+'|'+requesterKey;
  const existing = currentSaleDraft.items.find(i=>i.productId===productId && !i.sent && (i.customizationSignature||'')===signature);
  const candidate={productId,name:p.name,basePrice:Number(p.price)||0,price:(Number(p.price)||0)+extra,qty:1,sent:false,isCombo:productKind(p)==='combo',comboItems,customization:customization||null,customizationSignature:signature,notes:customization&&customization.summary||'',addedAt:new Date().toISOString(),addedById:currentUser&&currentUser.id||null,addedBy:currentUser&&currentUser.name||'—',requesterId:requester&&requester.id||null,requesterName:requester&&requester.name||'',requesterType:requester&&requester.type||''};
  const unsent=currentSaleDraft.items.filter(i=>!i.sent).map(i=>({...i}));
  const proposed=unsent.find(i=>i.productId===productId&&(i.customizationSignature||'')===signature);
  if(proposed) proposed.qty+=1; else unsent.push(candidate);
  if(!canFulfillItems(unsent)){ toast('Estoque insuficiente para aumentar este item.'); return; }
  if(existing) existing.qty+=1; else currentSaleDraft.items.push(candidate);
  renderDraftItems();renderComandaAuditHistory();
}
function openProductCustomization(productId,questions,complements,observations,sizes){

  const questionHtml=questions.map(q=>{
    const answers=Array.isArray(q.answers)?q.answers:[];
    if(q.type==='text')return `<div class="field product-question" data-question="${q.id}" data-type="text" data-required="${q.required?'1':'0'}"><label>${h(q.texto)}${q.required?' *':''}</label><textarea class="custom-text" rows="2"></textarea></div>`;
    if(q.type==='quantity')return `<div class="field product-question" data-question="${q.id}" data-type="quantity" data-required="${q.required?'1':'0'}"><label>${h(q.texto)}${q.required?' *':''}</label><input class="custom-quantity" type="number" min="${q.required?'1':'0'}" value="${q.required?'1':'0'}"></div>`;
    const inputType=q.type==='multiple'?'checkbox':'radio';
    return `<fieldset class="product-question" data-question="${q.id}" data-type="${q.type||'single'}" data-required="${q.required?'1':'0'}" data-max="${Number(q.maxChoices)||1}"><legend>${h(q.texto)}${q.required?' *':''}</legend>${answers.map(a=>`<label class="item-line"><span>${h(a.text)} ${Number(a.price)?`<small>+ ${fmt(a.price)}</small>`:''}</span><input class="custom-answer" type="${inputType}" name="question_${q.id}" value="${a.id}" data-text="${h(a.text)}" data-price="${Number(a.price)||0}"></label>`).join('')}</fieldset>`;
  }).join('');
  const complementHtml=complements.length?`<fieldset><legend>Complementos</legend>${complements.map(c=>`<label class="item-line"><span>${h(c.nome)} ${Number(c.preco)?`<small>+ ${fmt(c.preco)}</small>`:''}</span><input class="custom-complement" type="checkbox" value="${c.id}" data-name="${h(c.nome)}" data-price="${Number(c.preco)||0}"></label>`).join('')}</fieldset>`:'';
  const sizeHtml=(sizes||[]).length?`<fieldset class="product-size-group"><legend>Tamanho *</legend>${sizes.map(s=>`<label class="item-line"><span>${h(s.nome)} ${Number(s.preco)?`<small>+ ${fmt(s.preco)}</small>`:''}</span><input class="custom-size" type="radio" name="custom_product_size" value="${s.id}" data-name="${h(s.nome)}" data-price="${Number(s.preco)||0}"></label>`).join('')}</fieldset>`:'';
  const observationHtml=(observations||[]).length?`<fieldset><legend>Observações rápidas</legend>${observations.map(o=>`<label class="item-line"><span>${h(o.texto)}</span><input class="custom-observation" type="checkbox" value="${o.id}" data-text="${h(o.texto)}"></label>`).join('')}</fieldset>`:'';
  openModal('Personalizar item',`<div class="consumer-form-frame"><div class="app-status"><b>${h(p.name)}</b><span id="customItemPrice" class="mono">${fmt(p.price)}</span></div><div class="customization-scroll">${sizeHtml}${questionHtml}${complementHtml}${observationHtml}<div class="field"><label>Observações para o preparo</label><textarea id="customItemNotes" rows="3" placeholder="Ex.: retirar ingrediente, ponto de preparo..."></textarea></div></div></div><div class="consumer-modal-actions"><button onclick="closeModal()">Voltar</button><button class="consumer-save" onclick="saveProductCustomization('${productId}')">✓ Adicionar</button></div>`,true);
  document.querySelector('#modalRoot .modal').classList.add('record-modal');
  document.querySelectorAll('#modalRoot .custom-answer,#modalRoot .custom-complement,#modalRoot .custom-size').forEach(el=>el.addEventListener('change',()=>{const group=el.closest('.product-question');if(group&&group.dataset.type==='multiple'){const checked=group.querySelectorAll('.custom-answer:checked');const max=Number(group.dataset.max)||1;if(checked.length>max){el.checked=false;toast('Escolha no máximo '+max+' opção(ões).');}}updateCustomizationPrice(productId);}));
}
function updateCustomizationPrice(productId){const p=state.products.find(x=>x.id===productId);const extras=[...document.querySelectorAll('#modalRoot .custom-answer:checked,#modalRoot .custom-complement:checked,#modalRoot .custom-size:checked')].reduce((sum,x)=>sum+(Number(x.dataset.price)||0),0);const el=document.getElementById('customItemPrice');if(el)el.textContent=fmt((Number(p&&p.price)||0)+extras);}
function saveProductCustomization(productId){
  const answers=[];let invalid='';
  document.querySelectorAll('#modalRoot .product-question').forEach(group=>{if(invalid)return;const q=state.perguntas.find(x=>x.id===group.dataset.question);if(!q)return;let values=[];
    if(group.dataset.type==='text'){const value=group.querySelector('.custom-text').value.trim();if(value)values=[{text:value,price:0}];}
    else if(group.dataset.type==='quantity'){const value=Number(group.querySelector('.custom-quantity').value)||0;if(value>0)values=[{text:String(value),value,price:0}];}
    else values=[...group.querySelectorAll('.custom-answer:checked')].map(x=>({id:x.value,text:x.dataset.text,price:Number(x.dataset.price)||0}));
    if(group.dataset.required==='1'&&!values.length){invalid='Responda: '+q.texto;return;}if(values.length)answers.push({questionId:q.id,question:q.texto,type:q.type,values});
  });
  if(invalid){toast(invalid);return;}
  const sizeInput=document.querySelector('#modalRoot .custom-size:checked'),hasSizes=!!document.querySelector('#modalRoot .product-size-group');
  if(hasSizes&&!sizeInput){toast('Escolha o tamanho do produto.');return;}

  const selectedComplements=[...document.querySelectorAll('#modalRoot .custom-complement:checked')].map(x=>({id:x.value,name:x.dataset.name,price:Number(x.dataset.price)||0}));
  const selectedObservations=[...document.querySelectorAll('#modalRoot .custom-observation:checked')].map(x=>({id:x.value,text:x.dataset.text}));
  const typedNotes=document.getElementById('customItemNotes').value.trim(),notes=[...selectedObservations.map(o=>o.text),typedNotes].filter(Boolean).join(' · ');
  const extra=answers.flatMap(a=>a.values).reduce((s,a)=>s+(Number(a.price)||0),0)+selectedComplements.reduce((s,c)=>s+c.price,0)+(selectedSize?selectedSize.price:0);
  const parts=[];if(selectedSize)parts.push('Tamanho: '+selectedSize.name);answers.forEach(a=>parts.push(a.question+': '+a.values.map(v=>v.text).join(', ')));if(selectedComplements.length)parts.push('Complementos: '+selectedComplements.map(c=>c.name).join(', '));if(notes)parts.push('Obs.: '+notes);
  commitDraftItem(productId,{sizeId:selectedSize&&selectedSize.id,size:selectedSize,answers,complementIds:selectedComplements.map(c=>c.id),complements:selectedComplements,observationIds:selectedObservations.map(o=>o.id),observations:selectedObservations,notes,extra,summary:parts.join(' · ')});
  const locatorSaleId = window.comandaLocatorSaleId;
  if(currentSaleDraft.type==='comanda' && locatorSaleId){
    const sale = state.sales.find(x=>x.id===locatorSaleId);
    if(sale){ sale.items = currentSaleDraft.items; sale.total = draftTotal(); save('sales'); }
    closeModal();
    openComandaProductLocator(locatorSaleId);
  } else {
    closeModal();
  }
}
function changeDraftQty(idx, delta){
  const it = currentSaleDraft.items[idx]; if(!it) return;
  if(it.sent){ toast('Itens enviados não podem ser alterados. Use um fluxo de cancelamento com estorno.'); return; }
  if(delta>0){
    const unsent=currentSaleDraft.items.filter(i=>!i.sent).map(i=>({...i}));
    const proposed=unsent.find(i=>i.productId===it.productId&&(i.customizationSignature||'')===(it.customizationSignature||''));
    if(proposed) proposed.qty+=delta;
    if(!canFulfillItems(unsent)){ toast('Estoque insuficiente para aumentar este item.'); return; }
  }
  it.qty += delta;
  if(it.qty<=0) currentSaleDraft.items.splice(idx,1);
  renderDraftItems();renderComandaAuditHistory();
}
function draftTotal(){ return currentSaleDraft.items.reduce((s,i)=>s+i.price*i.qty,0)+(Number(currentSaleDraft.deliveryFee)||0); }
function serviceRatePct(){ return Math.max(0,Number(state.settings.serviceRate)||0); }
function serviceChargeAmount(base){ return base*serviceRatePct()/100; }
function renderTotalWithService(subtotal){

function methodConfig(){
  const base=[
    {key:'A',method:'dinheiro',label:'Dinheiro',icon:'💵'},
    {key:'P',method:'pix',label:'Pix',icon:'⚡'},
    {key:'C',method:'credito',label:'Crédito',icon:'💳'},
    {key:'B',method:'debito',label:'Débito',icon:'💳'},
    {key:'V',method:'vale',label:'Vale Refeição',icon:'🍽'},
    {key:'F',method:'fiado',label:'Fiado',icon:'📋'},
  ];
  const usedKeys=new Set(base.map(b=>b.key));
  const extras=state.paymentMethods.map((pm,i)=>{
    let key = pm.nome.trim().charAt(0).toUpperCase();
    if(!key || usedKeys.has(key)) key = 'ZYXWQJK'[i%7];
    usedKeys.add(key);
    return {key,method:'outro:'+pm.nome,label:pm.nome,icon:'●'};
  });
  base.push({key:'O',method:'outro',label:'Outros',icon:'●'});
  return [...base,...extras];
}
function openPaymentModal(mode, comandaId){
  if(!currentSaleDraft.items.length){ toast('Adicione ao menos um item.'); return; }
  const subtotal = draftTotal();
  const applyService = mode==='comanda' && serviceRatePct()>0;
  const memberOptions = state.members.filter(m=>!m.archived).map(m=>`<option value="${m.id}" ${m.debt>0?'data-blocked="1"':''}>${h((m.code?m.code+' — ':'')+m.name+(m.debt>0?' (deve '+fmt(m.debt)+')':''))}</option>`).join('');

  const methods = methodConfig();
  openModal('Pagamento', `
    <div class="pay-summary">
      <div><span>Subtotal</span><span class="mono" id="paySubtotalLine">${fmt(subtotal)}</span></div>
