    </div>
    <label class="comp-switch" style="margin:12px 0 4px"><input type="checkbox" id="paySplitToggle"><span></span> Rachar a conta</label>
    <div id="paySplitBox" style="display:none;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px">
      <div class="field" style="margin-bottom:0"><label>Dividir em quantas partes?</label><input id="paySplitCount" type="number" min="2" value="2"></div>
      <p class="sub" style="margin:8px 0 0">Cada parte: <b class="mono" id="paySplitPerPart">R$ 0,00</b> — clique numa forma de pagamento pra lançar cada parte.</p>
    </div>
    <div class="field"><label>Associado (opcional — necessário para fiado)</label>
      <select id="paySelMember"><option value="">— Cliente avulso —</option>${memberOptions}</select></div>
    <label class="np-label" style="margin-top:12px;display:block">Forma de pagamento <span style="text-transform:none;font-weight:400">(atalho de teclado entre parênteses)</span></label>
    <div class="pay-method-grid" id="payMethodGrid">
      ${methods.map(m=>`<button class="pay-method-btn" data-key="${m.key}" data-method="${h(m.method)}" onclick="selectPayMethod('${m.key}')"><span class="pay-method-icon">${m.icon}</span><span>${h(m.label)}</span><span class="pay-method-key">${m.key}</span></button>`).join('')}
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field" style="flex:1"><label>Valor desta forma</label><input id="payPartAmount" type="number" min="0.01" step="0.01"></div>
      <button class="btn" id="addPaymentBtn" style="align-self:flex-end">+ &nbsp; Adicionar</button>
    </div>
    <p id="fiadoWarning" style="display:none;color:var(--red);font-size:12px">Este associado possui saldo devedor pendente e não pode usar fiado até quitar.</p>
    <div id="paymentParts"></div>
    <div class="panel pay-progress-panel">
      <div class="pay-progress-track"><div class="pay-progress-fill" id="payProgressFill" style="width:0%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <div><small class="sub">Total Pago</small><br><b class="mono" id="payReceived">R$ 0,00</b></div>
        <div style="text-align:right"><small class="sub" id="payBalanceLabel">Falta pagar</small><br><b class="mono" id="payBalance">R$ 0,00</b></div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="confirmPayBtn">Confirmar pagamento</button>`,true);
  const modal=document.querySelector('#modalRoot .modal'); modal.classList.add('record-modal'); modal.style.width='520px';
  const selMember = document.getElementById('paySelMember');
  let finalTotal = subtotal, discount = 0, selectedMethodKey = 'A';
  tempPayments = [];
  if(preselected) selMember.value = preselected;
  function currentMethod(){ return methods.find(m=>m.key===selectedMethodKey)||methods[0]; }
  function recomputeTotals(){
    const afterDiscount = Math.max(0, subtotal-discount);
    const service = applyService ? serviceChargeAmount(afterDiscount) : 0;
    finalTotal = afterDiscount+service;
    document.getElementById('payDiscountRow').style.display = discount>0 ? 'flex':'none';
    if(discount>0) document.getElementById('payDiscountLine').textContent = '− '+fmt(discount);
    if(applyService) document.getElementById('payServiceLine').textContent = fmt(service);
    document.getElementById('payFinalTotal').textContent = fmt(finalTotal);
    updateSplitInfo(); renderPaymentParts();
  }
  function splitActive(){ return document.getElementById('paySplitToggle').checked; }
  function splitCount(){ return Math.max(2,parseInt(document.getElementById('paySplitCount').value,10)||2); }
  function updateSplitInfo(){
    const box=document.getElementById('paySplitBox');
    box.style.display = splitActive() ? 'block':'none';
    if(splitActive()) document.getElementById('paySplitPerPart').textContent = fmt(finalTotal/splitCount());
  }
  document.getElementById('paySplitToggle').onchange = updateSplitInfo;
  document.getElementById('paySplitCount').oninput = updateSplitInfo;
  window.selectPayMethod = function(key){
    selectedMethodKey = key;
    document.querySelectorAll('.pay-method-btn').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
    const received = tempPayments.reduce((a,p)=>a+p.amount,0);
    const remaining = Math.max(0, finalTotal-received);
    const suggested = splitActive() ? Math.min(remaining, finalTotal/splitCount()) : remaining;
    document.getElementById('payPartAmount').value = suggested.toFixed(2);
    checkFiado();
  };
  function checkFiado(){
    const opt = selMember.options[selMember.selectedIndex];
    const blocked = opt && opt.dataset.blocked==='1';
    document.getElementById('fiadoWarning').style.display = (currentMethod().method==='fiado' && blocked) ? 'block':'none';
  }
  selMember.onchange = checkFiado;
  function renderPaymentParts(){
    const received = tempPayments.reduce((a,p)=>a+p.amount,0);
    const balance = finalTotal-received;
    document.getElementById('paymentParts').innerHTML = tempPayments.length ? tempPayments.map((p,idx)=>`
      <div class="item-line"><span>${methodLabel(p.method)}</span><div><b class="mono">${fmt(p.amount)}</b>
      <button class="btn btn-sm btn-danger" style="margin-left:8px" onclick="tempPayments.splice(${idx},1);renderPaymentPartsGlobal()">Remover</button></div></div>`).join('') : '<p class="empty" style="padding:12px">Clique numa forma de pagamento e depois em Adicionar.</p>';
    document.getElementById('payReceived').textContent = fmt(received);
    document.getElementById('payBalanceLabel').textContent = balance>=0 ? 'Falta pagar' : 'Troco';
    document.getElementById('payBalance').textContent = fmt(Math.abs(balance));
    document.getElementById('payBalance').style.color = balance>0.009 ? 'var(--red)' : 'var(--green)';
    const pct = finalTotal>0 ? Math.min(100,(received/finalTotal)*100) : 0;
    document.getElementById('payProgressFill').style.width = pct+'%';
    document.getElementById('payProgressFill').style.background = balance>0.009 ? 'var(--amber)':'var(--green)';
    if(!splitActive()) document.getElementById('payPartAmount').value = Math.max(0,balance).toFixed(2);
    else updateSplitInfo();
  }
  window.renderPaymentPartsGlobal = renderPaymentParts;
  document.getElementById('addPaymentBtn').onclick = ()=>{
    const method = currentMethod().method; const amount = parseFloat(document.getElementById('payPartAmount').value);
    const member = selMember.value ? state.members.find(m=>m.id===selMember.value) : null;
    if(!amount || amount<=0){ toast('Informe o valor desta forma de pagamento.'); return; }
    if(method==='fiado' && (!member || member.debt>0)){ toast(!member?'Selecione um associado para usar fiado.':'Associado com pendência não pode usar fiado.'); return; }
    tempPayments.push({method,amount}); renderPaymentParts();
  };
  document.getElementById('payPartAmount').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('addPaymentBtn').click(); } });
  selectPayMethod('A');
  recomputeTotals();
  document.getElementById('applyCouponBtn').onclick = ()=>{
    const code = document.getElementById('payCoupon').value.trim().toUpperCase();
    const c = state.coupons.find(x=>x.code===code && isCouponUsable(x));
    if(!c){ toast('Cupom inválido ou inativo.'); return; }
    discount = c.type==='percent' ? subtotal*(c.value/100) : Math.min(subtotal,c.value);
    recomputeTotals();
    tempPayments = []; renderPaymentParts();
    toast('Cupom '+code+' aplicado.');
  };
  function payKeyHandler(e){
    if(!document.getElementById('confirmPayBtn')){ document.removeEventListener('keydown',payKeyHandler); return; }
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea') return;
    const key = e.key.toUpperCase();
    const btn = document.querySelector('.pay-method-btn[data-key="'+key+'"]');
    if(btn){ e.preventDefault(); btn.click(); }
  }
  document.addEventListener('keydown', payKeyHandler);
  document.getElementById('confirmPayBtn').onclick = ()=>{
    const memberId = selMember.value || null;
    const member = memberId ? state.members.find(m=>m.id===memberId) : null;
    if(tempPayments.some(p=>p.method==='fiado')){
      if(!member){ toast('Selecione um associado para usar fiado.'); return; }
      if(member.debt>0){ toast('Associado com pendência não pode usar fiado.'); return; }
    }
    const received = tempPayments.reduce((a,p)=>a+p.amount,0);
    if(received+0.009<finalTotal){ toast('Ainda falta '+fmt(finalTotal-received)+'.'); return; }
    if(received>finalTotal+0.009 && !tempPayments.some(p=>p.method==='dinheiro')){ toast('Valor excedente só é permitido em dinheiro para cálculo de troco.'); return; }
    const payments = tempPayments.map(p=>({...p}));
    const change = Math.max(0,received-finalTotal);
    if(change){ const cash = payments.find(p=>p.method==='dinheiro'); cash.received=cash.amount; cash.change=change; cash.amount-=change; }
    document.removeEventListener('keydown', payKeyHandler);
    if(finalizeSale(mode, comandaId, memberId, payments, finalTotal)){
      if(mode==='balcao') document.getElementById('modalRoot').dataset.confirmPdv='false';
      closeModal();
    }
  };

function finalizeSale(mode, comandaId, memberId, payments, total){
  const saleMember = memberId ? state.members.find(m=>m.id===memberId) : null;
  const who = memberId ? (saleMember||{}).name : (currentSaleDraft.customerName||'Cliente avulso');
  const cota = saleMember ? saleMember.code : '';
  const isExistingComanda = (mode==='comanda' && comandaId);
  const isExistingDelivery = (mode==='delivery' && comandaId);
  const sale = {
    id: (isExistingComanda||isExistingDelivery) ? comandaId : uid(), type: mode, orderNumber: (isExistingComanda||isExistingDelivery) ? null : nextOrderNumber(), memberId, customerName: currentSaleDraft.customerName||'',
    items: currentSaleDraft.items, total, status:'closed', notes:currentSaleDraft.notes||'',
    payments, operatorId: currentUser.id, operatorName: currentUser.name,
    openedAt: new Date().toISOString(), closedAt: new Date().toISOString()
  };
  if(mode==='balcao'){
    const unsent = currentSaleDraft.items.filter(i=>!i.sent);
    if(unsent.length){
      const unsentWithEstacao = unsent.map(i=>{ const prod=state.products.find(p=>p.id===i.productId); return {...i, estacao: i.estacao || (prod&&prod.estacao) || 'cozinha'}; });
      if(!sendItemsToKitchen(sale.id, unsentWithEstacao, who, mode)) return false;
      unsent.forEach(i=>i.sent=true);
      const origem = currentUser.origem||'caixa';
      const groups = {};
      unsentWithEstacao.forEach(i=>{ const key=i.estacao||'cozinha'; (groups[key]=groups[key]||[]).push(i); });
      const printJobs = Object.keys(groups).map(estacao=>{
        const printer = resolvePrinterFor(estacao, origem);
        return { estacao, items:groups[estacao], printer: printer?printer.nome:null };
      });
      printNovoPedidoTickets(who, cota, '', printJobs, sale.orderNumber);
      if(currentUser.caixaPrinterOsName){
        printCaixaReceipt(who, cota, currentSaleDraft.items, sale.orderNumber, currentUser.caixaPrinterOsName);
      }
    }
  } else if(mode==='agendamento'){
    const unsent = currentSaleDraft.items.filter(i=>!i.sent);
    if(unsent.length && !sendItemsToKitchen(sale.id, unsent, who, mode)) return false;
    unsent.forEach(i=>i.sent=true);
  }
  if(mode==='comanda' && comandaId){
    const idx = state.sales.findIndex(s=>s.id===comandaId);
    if(idx>-1) state.sales[idx] = {...state.sales[idx], items:currentSaleDraft.items, total, status:'closed', payments:sale.payments, operatorId:sale.operatorId, operatorName:sale.operatorName, closedAt:sale.closedAt};
  } else if(isExistingDelivery){const idx=state.sales.findIndex(s=>s.id===comandaId);if(idx>-1)state.sales[idx]={...state.sales[idx],memberId,customerName:currentSaleDraft.customerName||state.sales[idx].customerName,items:currentSaleDraft.items,total,status:'closed',deliveryStatus:'entregue',payments:sale.payments,operatorId:sale.operatorId,operatorName:sale.operatorName,closedAt:sale.closedAt};}
  else { state.sales.push(sale); }
  if(mode==='agendamento' && comandaId){
    const sch = state.scheduled.find(x=>x.id===comandaId);
    if(sch){ sch.status='entregue'; save('scheduled'); }
  }
  const fiadoTotal = payments.filter(p=>p.method==='fiado').reduce((a,p)=>a+p.amount,0);
  let fiadoMemberForPrompt = null;
  if(fiadoTotal>0 && memberId){
    const m = state.members.find(x=>x.id===memberId);
    if(m){ m.debt += fiadoTotal; save('members'); fiadoMemberForPrompt = m; }
  }
  applyAutomaticLoyalty(memberId,total,sale.id);
  save('sales'); newDraft(mode); toast('Venda registrada.'); logAction('Venda registrada — '+fmt(total)); renderAll();
  if(fiadoMemberForPrompt) promptWhatsAppCollection(fiadoMemberForPrompt);
  return true;
}

/* ============ DELIVERY ============ */
let selectedDeliveryId=null,deliveryShowClosed=false,deliveryOptionsOpen=false,deliveryShowMore=false;
function deliveryStatusLabel(status){return ({iniciado:'Iniciado',preparando:'Preparando',pronto:'Pronto',saiu:'Em Rota',entregue:'Finalizado',cancelado:'Cancelado'})[status]||'Iniciado';}
function renderDelivery(){
  const el=document.getElementById('view-delivery');const list=state.sales.filter(s=>s.type==='delivery'&&(deliveryShowClosed||s.status!=='closed')).slice().sort((a,b)=>new Date(b.openedAt)-new Date(a.openedAt));
  const rows=list.map(s=>{const m=s.memberId?state.members.find(x=>x.id===s.memberId):null;const who=m?m.name:(s.customerName||'Cliente');return `<tr data-search="${h((who+' '+(s.orderNumber||'')+' '+(s.deliveryLocal||s.address||'')+' '+(s.operatorName||'')).toLowerCase())}" class="${selectedDeliveryId===s.id?'selected':''}" onclick="selectDeliveryRow('${s.id}')" ondblclick="openDeliveryModal('${s.id}')"><td>#${s.orderNumber||'—'}</td><td>${reportDateTime(s.openedAt)}</td><td>${h(who)}</td><td>${s.deliveryLocal?'📍 '+h(s.deliveryLocal):h(s.address||'—')}</td><td><span class="tag ${s.deliveryStatus==='entregue'?'tag-green':'tag-amber'}">${deliveryStatusLabel(s.deliveryStatus)}</span></td><td>${reportDateTime(s.deliveryStatusAt||s.openedAt)}</td><td>${h(s.driver||'—')}</td><td>${fmt(s.total)}</td>${deliveryShowMore?`<td>${h(s.operatorName||'—')}</td><td>${h(s.deliveryReference||'—')}</td><td>${(s.items||[]).reduce((a,i)=>a+Number(i.qty||0),0)}</td>`:''}</tr>`}).join('');
  const columnCount=deliveryShowMore?11:8;
  el.innerHTML=`<div class="pdv-shell"><div class="pdv-actions"><div class="pdv-search"><input id="deliverySearch" placeholder="Pesquisar cliente..."></div><div class="spacer"></div><div class="pdv-menu-wrap"><button class="pdv-action ${deliveryOptionsOpen?'active':''}" onclick="toggleDeliveryOptions()">••• &nbsp; Opções ▾</button>${deliveryOptionsOpen?`<div class="pdv-menu" style="top:48px;right:0;left:auto;min-width:220px"><button onclick="toggleDeliveryColumns()">☰ &nbsp; ${deliveryShowMore?'Menos colunas':'Mais colunas'}</button><button onclick="finalizeSelectedDelivery()">☷ &nbsp; Finalizar</button><button onclick="focusDeliveryAdvancedSearch()">⌕ &nbsp; Busca avançada</button></div>`:''}</div><button class="pdv-action" onclick="selectedDeliveryId?openDeliveryModal(selectedDeliveryId):toast('Selecione um pedido para editar.')">✎ &nbsp; Editar</button><button class="pdv-action" onclick="openDeliveryModal()">＋ &nbsp; Novo</button></div><div class="pdv-table-wrap"><table class="pdv-table"><thead><tr><th>Pedido</th><th>Data Abertura</th><th>Cliente</th><th>Local de Entrega</th><th>Status do Delivery</th><th>Data do Status</th><th>Entregador</th><th>Total</th>${deliveryShowMore?'<th>Operador</th><th>Referência</th><th>Itens</th>':''}</tr></thead><tbody id="deliveryRows">${rows||`<tr><td colspan="${columnCount}" class="pdv-empty">Nenhum pedido encontrado</td></tr>`}</tbody></table></div><div class="pdv-footer"><b>${list.length}</b><label>Mostrar pedidos finalizados: <select onchange="deliveryShowClosed=this.value==='sim';selectedDeliveryId=null;renderDelivery()"><option value="nao" ${!deliveryShowClosed?'selected':''}>Não mostrar</option><option value="sim" ${deliveryShowClosed?'selected':''}>Mostrar</option></select></label></div></div>`;
  document.getElementById('deliverySearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#deliveryRows tr[data-search]').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none');};
}
function selectDeliveryRow(id){selectedDeliveryId=id;document.querySelectorAll('#deliveryRows tr').forEach(r=>r.classList.toggle('selected',r.getAttribute('onclick')?.includes(id)));}
function toggleDeliveryOptions(){deliveryOptionsOpen=!deliveryOptionsOpen;renderDelivery();}
function toggleDeliveryColumns(){deliveryShowMore=!deliveryShowMore;deliveryOptionsOpen=false;renderDelivery();}
function finalizeSelectedDelivery(){deliveryOptionsOpen=false;if(!selectedDeliveryId){renderDelivery();toast('Selecione um pedido para finalizar.');return;}const sale=state.sales.find(s=>s.id===selectedDeliveryId&&s.type==='delivery');if(!sale||sale.status==='closed'){renderDelivery();toast('Selecione um Delivery aberto.');return;}renderDelivery();openDeliveryPayment(sale.id);}
function focusDeliveryAdvancedSearch(){deliveryOptionsOpen=false;deliveryShowClosed=true;renderDelivery();const input=document.getElementById('deliverySearch');input.placeholder='Busca avançada: cliente, pedido, endereço ou operador...';input.focus();}
function openDeliveryModal(id){
  const sale=id?state.sales.find(s=>s.id===id&&s.type==='delivery'):null;if(sale&&sale.status==='closed'){openDeliveryReadOnly(sale);return;}
  window.currentDeliveryEditingId=sale?sale.id:null;
  currentSaleDraft=sale?{items:JSON.parse(JSON.stringify(sale.items||[])),memberId:sale.memberId||null,customerName:sale.customerName||'',type:'delivery',deliveryFee:Number(sale.deliveryFee)||0}:{items:[],memberId:null,customerName:'',type:'delivery',deliveryFee:0};
  const memberOptions=state.members.filter(m=>!m.archived).map(m=>`<option value="${m.id}" ${currentSaleDraft.memberId===m.id?'selected':''}>${h((m.code?m.code+' — ':'')+m.name)}</option>`).join('');
  const statusNow=sale?sale.deliveryStatus||'iniciado':'iniciado';
  const statusSteps=[['iniciado','#8b9297','Iniciado'],['preparando','#d24949','Preparando'],['pronto','#2e9e5b','Pronto'],['saiu','#e0a430','Em Rota'],['entregue','#1c86ee','Finalizado']];
  const statusOrder=statusSteps.map(s=>s[0]);
  const statusIdx=Math.max(0,statusOrder.indexOf(statusNow));
  openModal(sale?'Pedido Delivery #'+(sale.orderNumber||'—'):'Pedido Delivery',`<div class="record-body"><div class="delivery-order-layout"><aside class="delivery-order-side"><span class="delivery-open-badge">Em Aberto</span><h2>Pedido #${sale?sale.orderNumber||'—':'Novo'}</h2><div class="delivery-meta">◷ &nbsp; Iniciado em ${reportDateTime(sale?sale.openedAt:new Date().toISOString())}<br>♙ &nbsp; Criado por: <b>${h(sale?sale.operatorName||currentUser.name:currentUser.name)}</b></div><div class="field"><select id="delDriver"><option value="">Entregador</option>${sale&&sale.driver?`<option selected>${h(sale.driver)}</option>`:''}</select></div><button class="delivery-locate" onclick="toast('As ações de pagamento, cancelamento e retorno ficam no rodapé.')">☰ &nbsp; Mais Opções</button></aside><main class="delivery-items-column"><div class="delivery-items-toolbar"><div class="op-search"><input placeholder="Buscar Produto..." onfocus="toggleDeliveryCatalog(true)" oninput="filterDeliveryProducts(this.value)"></div><button class="delivery-locate" onclick="toggleDeliveryCatalog()"><span style="font-size:25px">＋</span> Produtos</button></div><div id="deliveryPicker" class="delivery-product-list"></div><div class="delivery-items-empty"><div id="draftItemsList"></div></div><div class="delivery-totalbar"><span>Total com entrega</span><span id="draftTotal"></span></div></main><aside class="delivery-data-column"><h2>Dados do Delivery</h2><div id="deliveryClientEmpty" class="delivery-client-empty" style="display:${sale||currentSaleDraft.memberId?'none':'block'}"><b>Nenhum cliente selecionado.</b><span>Selecione ou cadastre um cliente para ver os endereços e outras opções de entrega.</span><br><button class="delivery-locate" onclick="showDeliveryClientForm()">⌕ &nbsp; Localizar Cliente</button></div><div id="deliveryClientForm" class="delivery-client-form ${sale||currentSaleDraft.memberId?'visible':''}"><div class="field"><label>Cliente cadastrado</label><input id="delMemberSearch" placeholder="Buscar por nome ou cota..." autocomplete="off" value="${currentSaleDraft.memberId?h((()=>{const m=state.members.find(x=>x.id===currentSaleDraft.memberId);return m?(m.code?m.code+' — ':'')+m.name:'';})()):''}" oninput="filterDeliveryMemberSearch(this.value)"><div id="delMemberResults" class="comanda-account-results" style="display:none"></div></div><div class="field"><label>Nome do cliente</label><input id="delCustomer" value="${h(currentSaleDraft.customerName)}"></div><div class="field"><label style="font-weight:700;color:var(--navy)">📍 Local de entrega (no clube)</label><select id="delLocal"><option value="">— Selecione um local —</option>${state.locais.map(l=>`<option value="${h(l.nome)}" ${sale&&sale.deliveryLocal===l.nome?'selected':''}>${h(l.nome)}</option>`).join('')}</select></div><div class="field"><label>Endereço de entrega (se for fora do clube)</label><input id="delAddress" value="${h(sale?sale.address||'':'')}" placeholder="Rua, número, bairro"></div><div class="field"><label>Complemento / referência</label><input id="delReference" value="${h(sale?sale.deliveryReference||'':'')}"></div></div><div class="delivery-status-box"><b>Status do Pedido</b><div class="delivery-status-flow">${statusSteps.map(([v,color,n],i)=>`<button class="${statusNow===v?'active':''} ${i<=statusIdx?'done':''}" style="--flag-color:${color}" onclick="setDeliveryStatus('${sale?sale.id:''}','${v}')"><span class="delivery-flag">⚑</span>${n}</button>`).join('')}</div></div><div class="delivery-notes-box"><div class="field"><input id="delNotes" value="${h(sale?sale.notes||'':'')}" placeholder="Anotar observação..."></div><div class="field"><input id="delFee" type="number" min="0" step="0.01" value="${Number(currentSaleDraft.deliveryFee)||0}" placeholder="Taxa de entrega..."></div></div></aside></div><div class="record-actions"><button class="op-btn" onclick="closeModal()">Voltar</button>${sale?`<button class="op-btn" onclick="cancelDelivery('${sale.id}')">Cancelar Pedido</button><button class="op-btn" onclick="openDeliveryPayment('${sale.id}')">Pagamento</button>`:''}<button class="op-btn primary" id="deliverySave">${sale?'Salvar alterações':'Criar Pedido'}</button></div></div>`,true);
  document.querySelector('#modalRoot .modal').classList.add('record-modal','delivery-modal');
  const driverSelect=document.getElementById('delDriver');const driverInput=document.createElement('input');driverInput.id='delDriver';driverInput.placeholder='Entregador';driverInput.value=sale?sale.driver||'':'';driverSelect.replaceWith(driverInput);
  window.selectedDeliveryMemberId = currentSaleDraft.memberId || null;
  const areas=(state.settings.deliveryAreas||[]).filter(a=>a.active!==false),areaWrap=document.createElement('div');areaWrap.className='field';areaWrap.innerHTML=`<label>Área de entrega</label><select id="delArea"><option value="">— Informar taxa manualmente —</option>${areas.map(a=>`<option value="${a.id}" ${sale&&sale.deliveryAreaId===a.id?'selected':''}>${h(a.name)} — ${fmt(a.fee)} — ${Number(a.minutes)||0} min</option>`).join('')}</select><small id="delAreaInfo"></small>`;document.getElementById('delReference').closest('.field').after(areaWrap);document.getElementById('delArea').onchange=e=>{const area=areas.find(a=>a.id===e.target.value);if(!area)return;currentSaleDraft.deliveryFee=Number(area.fee)||0;document.getElementById('delFee').value=currentSaleDraft.deliveryFee;document.getElementById('delAreaInfo').textContent=`Pedido mínimo ${fmt(area.minimum)} · previsão ${area.minutes} min`;renderDraftItems();};
  document.getElementById('delCustomer').oninput=e=>currentSaleDraft.customerName=e.target.value;document.getElementById('delFee').oninput=e=>{currentSaleDraft.deliveryFee=Math.max(0,Number(e.target.value)||0);renderDraftItems();};
  document.getElementById('deliverySave').onclick=()=>saveDeliveryOrder(sale?sale.id:null);renderProductPicker('deliveryPicker');renderDraftItems();
}
function toggleDeliveryCatalog(force){const el=document.getElementById('deliveryPicker');if(!el)return;el.style.display=force===true?'block':force===false?'none':(el.style.display==='block'?'none':'block');}
function showDeliveryClientForm(){const empty=document.getElementById('deliveryClientEmpty'),form=document.getElementById('deliveryClientForm');if(empty)empty.style.display='none';if(form)form.classList.add('visible');document.getElementById('delMemberSearch')?.focus();}
function filterDeliveryMemberSearch(q){
  const el=document.getElementById('delMemberResults'); if(!el) return;
  const query=String(q||'').trim().toLowerCase();
  if(!query){ el.style.display='none'; el.innerHTML=''; window.selectedDeliveryMemberId=null; currentSaleDraft.memberId=null; return; }
  const matches=state.members.filter(m=>!m.archived && (((m.name||'').toLowerCase().includes(query))||((m.code||'').toLowerCase().includes(query)))).slice(0,8);
  el.style.display='block';
  el.innerHTML = matches.length ? matches.map(m=>`<button class="comanda-account-choice" onclick="selectDeliveryMember('${m.id}')"><span>${m.debt>0?'Deve '+fmt(m.debt):'Em dia'}</span>${m.code?h(m.code)+' — ':''}${h(m.name)}</button>`).join('')
    : `<button class="comanda-account-choice" onclick="clearDeliveryMemberSelection()"><span>Avulso</span>Nenhum associado encontrado — continuar sem vincular</button>`;
}
function selectDeliveryMember(memberId){
  const m=state.members.find(x=>x.id===memberId); if(!m) return;
  window.selectedDeliveryMemberId=m.id; currentSaleDraft.memberId=m.id;
  document.getElementById('delMemberSearch').value=(m.code?m.code+' — ':'')+m.name;
  document.getElementById('delMemberResults').style.display='none';
  document.getElementById('delCustomer').value=m.name;
  document.getElementById('delAddress').value=[m.address,m.addressNumber,m.district].filter(Boolean).join(', ');
  document.getElementById('delReference').value=m.reference||m.addressComplement||'';
  currentSaleDraft.customerName=m.name;
}
function clearDeliveryMemberSelection(){
  window.selectedDeliveryMemberId=null; currentSaleDraft.memberId=null;
  document.getElementById('delMemberSearch').value='';
  document.getElementById('delMemberResults').style.display='none';
}
function filterDeliveryProducts(q){document.querySelectorAll('#deliveryPicker .menu-item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(String(q).toLowerCase())?'':'none');}
function openDeliveryOrderOptions(){
  const id=window.currentDeliveryEditingId,sale=id?state.sales.find(x=>x.id===id):null;
  openModal('Opções do Delivery', `<div class="pdv-options-inner" style="border:1px solid #ddd">
    <button onclick="closeModal();${sale?`openDeliveryPayment('${sale.id}')`:`toast('Crie o pedido antes de registrar o pagamento.')`}"><span class="icn">${ICN.card}</span> Pagamento</button>
    <button onclick="closeModal();${sale?`duplicateDeliveryOrder('${sale.id}')`:`toast('Crie o pedido antes de duplicar.')`}"><span class="icn">${ICN.plus}</span> Duplicar pedido</button>
    <button onclick="window.print()"><span class="icn">${ICN.printer}</span> Imprimir pedido</button>
    <button onclick="closeModal();${sale?`transferDeliveryToCounter('${sale.id}')`:`toast('Crie o pedido antes de transferir.')`}"><span class="icn">${ICN.swap}</span> Transferir para balcão</button>
    <button class="danger" onclick="closeModal();${sale?`cancelDelivery('${sale.id}')`:`closeModal()`}"><span class="icn">${ICN.plus}</span> Cancelar pedido</button>
    <button class="cancel" onclick="closeModal()">Voltar</button>
  </div>`);
  const modal=document.querySelector('#modalRoot .modal'); modal.classList.add('record-modal'); modal.style.width='340px';
}
function duplicateDeliveryOrder(id){const source=state.sales.find(x=>x.id===id);if(!source)return;const copy={...JSON.parse(JSON.stringify(source)),id:uid(),orderNumber:nextOrderNumber(),status:'open',payments:[],openedAt:new Date().toISOString(),deliveryStatus:'iniciado',deliveryStatusAt:new Date().toISOString()};copy.items=(copy.items||[]).map(i=>({...i,sent:false}));state.sales.push(copy);save('sales');selectedDeliveryId=copy.id;renderAll();openDeliveryModal(copy.id);toast('Pedido duplicado. Revise antes de enviar.');}
function transferDeliveryToCounter(id){const sale=state.sales.find(x=>x.id===id);if(!sale||sale.status!=='open')return;if(!confirm('Transferir este pedido para o Caixa / PDV?'))return;sale.type='balcao';sale.origin='Delivery';delete sale.deliveryStatus;save('sales');renderAll();switchView('balcao');toast('Pedido transferido para o Caixa / PDV.');}
if(typeof document.addEventListener==='function')document.addEventListener('click',event=>{const button=event.target.closest&&event.target.closest('.delivery-modal .delivery-locate');if(!button||!button.textContent.includes('Mais Opções'))return;event.preventDefault();event.stopImmediatePropagation();openDeliveryOrderOptions();},true);
function saveDeliveryOrder(id){const existing=id?state.sales.find(s=>s.id===id):null;if(!currentSaleDraft.items.length){toast('Adicione ao menos um produto.');return;}const address=document.getElementById('delAddress').value.trim(),deliveryLocal=document.getElementById('delLocal')?.value||'',customer=document.getElementById('delCustomer').value.trim(),areaId=document.getElementById('delArea')?.value||null,area=(state.settings.deliveryAreas||[]).find(a=>a.id===areaId),itemsValue=currentSaleDraft.items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);if(!customer){toast('Informe o cliente.');return;}if(!address&&!deliveryLocal){toast('Informe o local de entrega no clube ou o endereço.');return;}if(area&&itemsValue<Number(area.minimum||0)){toast('O pedido não atingiu o valor mínimo de '+fmt(area.minimum)+' para esta área.');return;}const unsent=currentSaleDraft.items.filter(i=>!i.sent),saleId=existing?existing.id:uid();if(unsent.length&&!sendItemsToKitchen(saleId,unsent,customer,'delivery',deliveryLocal))return;unsent.forEach(i=>i.sent=true);const data={type:'delivery',memberId:window.selectedDeliveryMemberId||null,customerName:customer,address,deliveryLocal,deliveryReference:document.getElementById('delReference').value.trim(),deliveryAreaId:areaId,estimatedMinutes:area?Number(area.minutes)||0:0,notes:document.getElementById('delNotes').value.trim(),driver:document.getElementById('delDriver').value.trim(),deliveryFee:Math.max(0,Number(document.getElementById('delFee').value)||0),items:currentSaleDraft.items,total:draftTotal(),deliveryStatus:existing?(existing.deliveryStatus||'iniciado'):'iniciado',deliveryStatusAt:new Date().toISOString()};if(existing)Object.assign(existing,data);else state.sales.push({id:saleId,orderNumber:nextOrderNumber(),status:'open',payments:[],operatorId:currentUser.id,operatorName:currentUser.name,openedAt:new Date().toISOString(),...data});save('sales');closeModal();selectedDeliveryId=saleId;renderAll();toast(existing?'Delivery atualizado.':'Pedido Delivery criado e enviado para preparo.');}
function setDeliveryStatus(id,status){if(!id){toast('Crie o pedido antes de alterar o status.');return;}const s=state.sales.find(x=>x.id===id);if(!s||s.status==='closed')return;s.deliveryStatus=status;s.deliveryStatusAt=new Date().toISOString();save('sales');logAction('Delivery #'+(s.orderNumber||'')+' — '+deliveryStatusLabel(status));openDeliveryModal(id);renderAll();}
function openDeliveryPayment(id){const s=state.sales.find(x=>x.id===id);if(!s)return;if(!state.cashSession||state.cashSession.status!=='open'){toast('Abra o caixa antes de receber o pedido Delivery.');return;}currentSaleDraft={items:JSON.parse(JSON.stringify(s.items||[])),memberId:s.memberId||null,customerName:s.customerName||'',type:'delivery',deliveryFee:Number(s.deliveryFee)||0};openPaymentModal('delivery',id);}
function cancelDelivery(id){const s=state.sales.find(x=>x.id===id);if(!s||s.status==='closed')return;if(!confirm('Cancelar este Delivery e devolver os insumos enviados ao estoque?'))return;(s.items||[]).filter(i=>i.sent).forEach(it=>{const p=state.products.find(x=>x.id===it.productId);(p&&p.recipe||[]).forEach(r=>{const ins=state.insumos.find(x=>x.id===r.insumoId);if(ins){const qty=(Number(r.qty)||0)*(Number(it.qty)||0),before=Number(ins.stock)||0;ins.stock+=qty;state.stockMovements.unshift({id:uid(),insumoId:ins.id,name:ins.name,unit:ins.unit,type:'entrada',operation:'Estorno de Delivery cancelado',before,qty,after:ins.stock,user:currentUser.name,at:new Date().toISOString()});}});});s.status='closed';s.deliveryStatus='cancelado';s.deliveryStatusAt=new Date().toISOString();s.closedAt=s.deliveryStatusAt;state.orders.filter(o=>o.saleId===id&&o.status!=='entregue').forEach(o=>o.status='cancelado');save('insumos');save('stockMovements');save('orders');save('sales');logAction('Delivery #'+(s.orderNumber||'')+' cancelado');closeModal();renderAll();toast('Delivery cancelado e estoque devolvido.');}
function openDeliveryReadOnly(s){openModal('Delivery #'+(s.orderNumber||'—'),`<div class="panel"><p><b>Cliente:</b> ${h(s.customerName||'—')}</p><p><b>Endereço:</b> ${h(s.address||'—')}</p><p><b>Entregador:</b> ${h(s.driver||'—')}</p><p><b>Status:</b> ${deliveryStatusLabel(s.deliveryStatus)}</p><p><b>Total:</b> ${fmt(s.total)}</p><p><b>Finalizado:</b> ${reportDateTime(s.closedAt)}</p></div>`);}

/* ============ COMANDAS ============ */
let comandaOptionsOpen=false;
function toggleComandaOptions(){ comandaOptionsOpen=!comandaOptionsOpen; renderComandas(); }
function refreshComandas(){ comandaOptionsOpen=false; renderAll(); toast('Mesas e comandas atualizadas.'); }
function comandaDisplayName(s){
  const member=s.memberId?state.members.find(m=>m.id===s.memberId):null;
  const who=member?member.name:(s.customerName||'Cliente avulso');
  return `${s.tableNumber?'Mesa '+String(s.tableNumber).padStart(2,'0'):'Pedido balcão'} — ${who}`;
}
function openMergeOrdersModal(){
  comandaOptionsOpen=false;
  const open=state.sales.filter(s=>s.status==='open');
  if(open.length<2){ toast('É necessário ter pelo menos dois pedidos abertos para juntar.'); renderComandas(); return; }
  const options=open.map(s=>`<option value="${s.id}">${h(comandaDisplayName(s))} · ${fmt(s.total)}</option>`).join('');
  openModal('Juntar pedidos', `<p class="sub">Todos os itens e registros de cozinha do pedido de origem serão transferidos para o pedido de destino. Nenhum estoque será baixado novamente.</p><div class="field"><label>Pedido de origem</label><select id="mergeSource">${options}</select></div><div class="field"><label>Pedido de destino</label><select id="mergeTarget">${options}</select></div><button class="btn btn-primary btn-block" id="mergeConfirm">Juntar pedidos</button>`);
  document.getElementById('mergeTarget').selectedIndex=1;
  document.getElementById('mergeConfirm').onclick=mergeOpenOrders;
}
function mergeOpenOrders(){
  const sourceId=document.getElementById('mergeSource').value;
  const targetId=document.getElementById('mergeTarget').value;
  if(sourceId===targetId){ toast('Escolha pedidos diferentes.'); return; }
  const source=state.sales.find(s=>s.id===sourceId&&s.status==='open');
  const target=state.sales.find(s=>s.id===targetId&&s.status==='open');
  if(!source||!target){ toast('Um dos pedidos não está mais aberto. Atualize a tela.'); return; }
  target.items=[...(target.items||[]),...(source.items||[])];
  target.total=target.items.reduce((sum,item)=>sum+(Number(item.price)||0)*(Number(item.qty)||0),0);
  target.mergedFrom=[...(target.mergedFrom||[]),source.orderNumber||source.id,...(source.mergedFrom||[])];
  state.orders.forEach(order=>{if(order.saleId===source.id) order.saleId=target.id;});
  state.sales=state.sales.filter(s=>s.id!==source.id);
  save('sales'); save('orders'); closeModal(); logAction(`Pedidos juntados: ${comandaDisplayName(source)} em ${comandaDisplayName(target)}`); renderAll(); toast('Pedidos juntados com sucesso.');
}
function renderComandas(){
  const el = document.getElementById('view-comandas');
  if(!state.cashSession || state.cashSession.status!=='open'){
    el.innerHTML = `<div class="consumer-workspace"><section class="free-cash"><h2>CAIXA LIVRE</h2><div class="free-cash-actions"><button class="op-btn" onclick="switchView('caixa')">‹ &nbsp; Abrir caixa</button><button class="op-btn primary" onclick="switchView('caixa')"><span class="op-ico">＋</span> Iniciar atendimento</button></div><p class="sub" style="margin-top:25px">Abra o caixa para liberar mesas e comandas.</p></section></div>`; return;
  }
  const open = state.sales.filter(s=>s.status==='open');
  const tableCount=Math.max(1,Number(state.settings.tableCount)||20);

function confirmNovoPedidoModal(saleId){
  const s = state.sales.find(x=>x.id===saleId); if(!s) return;
  const member = s.memberId ? state.members.find(m=>m.id===s.memberId) : null;
  const reqValue = document.getElementById('npRequester').value;
  if(!reqValue){ toast('Selecione quem está pedindo.'); return; }
  let requester;
  if(reqValue==='guest') requester={id:null,name:s.customerName||'Cliente avulso',type:'avulso',canOrder:true};
  else if(reqValue.startsWith('holder:')) requester={id:member.id,name:member.name,type:'titular',canOrder:true};
  else { const depId=reqValue.split(':')[1], dep=(member.dependents||[]).find(d=>d.id===depId); requester={id:dep&&dep.id,name:dep&&dep.name||'Dependente',type:'dependente',canOrder:!!dep&&dep.canOrder!==false}; }
  if(!requester.canOrder){ toast('Esta pessoa está bloqueada para consumir nesta cota.'); return; }
  if(!npCart.length){ toast('Adicione ao menos um produto.'); return; }
  const local = document.getElementById('npLocal').value;
  const origem = currentUser.origem||'caixa';
  const who = requester.name;
  const items = npCart.map(i=>({...i, sent:false, addedAt:new Date().toISOString(), addedBy:currentUser.name, requesterId:requester.id, requesterName:who, requesterType:requester.type}));
  if(!sendItemsToKitchen(saleId, items, who, 'comanda', local)) return;
  items.forEach(i=>i.sent=true);
  s.items = [...s.items, ...items];
  s.total = s.items.reduce((a,i)=>a+i.price*i.qty,0);
  save('sales');
  const groups = {};
  items.forEach(i=>{ const key=i.estacao||'cozinha'; (groups[key]=groups[key]||[]).push(i); });
  const printJobs = Object.keys(groups).map(estacao=>{
    const printer = resolvePrinterFor(estacao, origem);
    return { estacao, items:groups[estacao], printer: printer?printer.nome:null };
  });
  logAction('Pedido registrado para '+who+(local?' — local: '+local:'')+' — origem: '+origemLabel(origem));
  printNovoPedidoTickets(who, member?member.code:'', local, printJobs, s.orderNumber);
  toast('Pedido confirmado e enviado para a cozinha.');
  closeModal(); openComanda(saleId, true);
}
function printNovoPedidoTickets(who, cota, local, printJobs, orderNumber){

  jobsToPrint.forEach((job, idx)=>{

  });
}

async function pingPrintAgent(base, timeoutMs){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), timeoutMs||1200);
    const res = await fetch((base||PRINT_AGENT_URL)+'/status', {signal:ctrl.signal});
    clearTimeout(t);
    return res.ok;
  }catch(e){ return false; }
}
async function checkPrintAgentStatus(){

          .eq('tenant_id', getTenantId()).eq('printer_name', targetName).eq('status','impresso')
          .gte('printed_at', since).limit(1);

      }catch(e){ cell.innerHTML = '<span class="tag tag-gray">○ não verificado</span>'; }

  }
  const isHttpsPage = window.location.protocol==='https:';
  if(isHttpsPage) box.innerHTML='<span class="tag tag-amber">⚠ Site em HTTPS — o agente local roda em HTTP, então o navegador pode bloquear isso por padrão. Veja a explicação abaixo de cada impressora.</span>';
  else box.className='tag tag-gray', box.textContent='Verificando agentes de impressão...';
  for(const imp of state.impressoras){
    const base = printerAgentBase(imp);
    const ok = await pingPrintAgent(base, 1200);
    const cell = document.getElementById('impStatus-'+imp.id);
    if(!cell) continue;
    if(ok){ cell.innerHTML = '<span class="tag tag-green">● conectado</span>'; continue; }
    if(isHttpsPage && base.startsWith('http://')){
      cell.innerHTML = '<span class="tag tag-amber">⚠ bloqueado pelo navegador (HTTPS→HTTP)</span><br><button class="btn btn-sm" onclick="explainMixedContentFix()" style="margin-top:4px">Como resolver</button>';
    } else {
      cell.innerHTML = '<span class="tag tag-amber">○ não encontrado</span>';
    }
  }
  if(!isHttpsPage){ box.className='tag tag-gray'; box.textContent='Status por impressora atualizado abaixo — cada impressora fala com o agente do computador onde ela está ligada.'; }
}
function stripAccentsForPrint(s){ const lo=String.fromCharCode(0x0300), hi=String.fromCharCode(0x036f); return String(s||'').normalize('NFD').replace(new RegExp('['+lo+'-'+hi+']','g'),''); }
// Postgres nunca aceita byte nulo (0x00) em coluna de texto — mas vários comandos ESC/POS
// (reset de tamanho de letra, corte total, etc.) precisam de um parâmetro 0x00. Guardamos
// esse placeholder no banco, e só o agente (na hora de mandar pro socket da impressora,
// fora do banco) troca pelo byte nulo de verdade. Ver printRawTcp no agente.
const NUL_PLACEHOLDER = String.fromCharCode(0x01);
function paperColumns(imp){ return imp && Number(imp.larguraPapel)===58 ? 32 : 48; }
function buildTicketText(who, cota, local, estacao, items, orderNumber, columns, escPos){
  const cfg = state.settings.ticketConfig || {};
  const nameSizeByte = {normal:NUL_PLACEHOLDER, grande:'\x11', extra:'\x22'}[cfg.nomeProdutoTamanho] || '\x11';
  const entregaDestaque = cfg.entregaDestaque!==false;
  const W = columns || 48;
  const line = ch=>ch.repeat(W);
  const wrap = t => t.length>W ? t.slice(0,W) : t;
  let out = '';
  out += line('=')+'\n';
  out += wrap((estacaoLabel(estacao)||estacao||'').toUpperCase())+'\n';
  out += line('=')+'\n';
  out += 'Pedido '+(orderNumber?'#'+orderNumber:'')+'\n';
  out += new Date().toLocaleString('pt-BR')+'\n';
  out += line('-')+'\n';
  out += wrap('Solicitante: '+who)+'\n';
  if(cota) out += wrap('Cota: '+cota)+'\n';
  out += line('-')+'\n';
  if(local){
    const localLabel = 'ENTREGAR EM: ';
    const localValueW = Math.max(1, W-localLabel.length);
    const localValue = local.length>localValueW ? local.slice(0,localValueW) : local;
    // Só o nome do local fica em negrito (label continua no tamanho normal) — configurável
    // em Impressoras > Formatação dos tickets.
    const boldOn = entregaDestaque ? '\x1B\x45\x01' : '';
    const boldOff = entregaDestaque ? '\x1B\x45'+NUL_PLACEHOLDER : '';
    out += (escPos ? localLabel+boldOn+localValue+boldOff : wrap(localLabel+local)) + '\n';
    out += line('-')+'\n';
  }
  const showPrices = estacao==='caixa' || !!cfg.mostrarPrecoProducao; // comprovante do caixa sempre mostra; estação é configurável
  let total = 0;
  items.forEach(i=>{
    total += i.price*i.qty;
    const nameLine = i.qty+'x '+i.name;
    // GS ! (tamanho da letra) — configurável em Impressoras > Formatação dos tickets.
    // Só no modo ESC/POS, senão o driver do Windows mostraria os bytes de controle como
    // texto (impressora local não é ESC/POS puro).
    out += (escPos ? '\x1D\x21'+nameSizeByte+nameLine+'\x1D\x21'+NUL_PLACEHOLDER : nameLine) + '\n';
    if(showPrices) out += fmt(i.price*i.qty)+'\n';
  });
  out += line('-')+'\n';
  if(showPrices) out += 'TOTAL: '+fmt(total)+'\n';
  out += line('=')+'\n\n\n';
  if(!escPos) return out;
  // Modo ESC/POS (impressora de rede, via socket cru): sem driver do Windows no meio,
  // então a gente mesmo controla início/corte do papel — e evita acentuação (o code
  // page da impressora térmica é incerto; texto puro ASCII imprime certo em qualquer uma).
  // GS V usa corte PARCIAL (parâmetro 1), não total (parâmetro 0) — Postgres não aceita
  // byte nulo (\x00) em coluna de texto, quebraria o insert do print_jobs.
  return '\x1B\x40' + stripAccentsForPrint(out) + '\n\n\n\x1D\x56\x01';
}
async function printCaixaReceipt(who, cota, items, orderNumber, printerOsName){
  const text = buildTicketText(who, cota, '', 'caixa', items, orderNumber, 48, false).replace('CAIXA','COMPROVANTE DE VENDA');
  if(supabaseClient && getTenantId()){
    try{
      const { error } = await supabaseClient.from('print_jobs').insert({ tenant_id: getTenantId(), printer_name: printerOsName, content: text, status: 'pendente' });
      if(!error) return;
    }catch(e){ /* segue pro modo manual abaixo */ }
  }
  try{
    const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 3000);
    const res = await fetch(PRINT_AGENT_URL+'/print', { method:'POST', signal:ctrl.signal, headers:{'Content-Type':'application/json'}, body: JSON.stringify({ printer: printerOsName, text }) });
    clearTimeout(t);
    if(res.ok) return;
  }catch(e){}
  toast('Não foi possível enviar o comprovante do caixa pra fila — verifique a impressora deste usuário.');
}
async function printSingleTicket(who, cota, local, estacao, printer, items, orderNumber){
  if(printer){
    const imp = state.impressoras.find(p=>p.nome===printer);
    const targetName = imp&&imp.osName ? imp.osName : printer;
    const useEscPos = !!(imp && imp.ip);
    const text = buildTicketText(who, cota, local, estacao, items, orderNumber, paperColumns(imp), useEscPos);
    if(supabaseClient && getTenantId()){
      try{
        const { error } = await supabaseClient.from('print_jobs').insert({ tenant_id: getTenantId(), printer_name: targetName, printer_ip: imp&&imp.ip||null, content: text, status: 'pendente' });
        if(!error){ toast('Pedido enviado pra fila de impressão: '+printer); return; }
      }catch(e){ /* cai pro modo antigo abaixo */ }
    }
    const base = printerAgentBase(imp);
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 4000);
      const res = await fetch(base+'/print', {
        method:'POST', signal:ctrl.signal,
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ printer: targetName, text })
      });
      clearTimeout(t);
      if(res.ok){ toast('Impresso automaticamente: '+printer); return; }
    }catch(e){ /* agente indisponível — cai no modo com caixa de diálogo abaixo */ }
  }
  const win = window.open('', '_blank', 'width=380,height=600');
  if(!win){ toast('Permita pop-ups no navegador para imprimir o pedido.'); return; }
  const total = items.reduce((a,i)=>a+i.price*i.qty,0);
  win.document.write(`<html><head><title>Pedido — ${estacaoLabel(estacao)||estacao}</title><style>
    body{font-family:Arial,sans-serif;padding:16px;font-size:13px;color:#111}
    h1{font-size:16px;margin:0 0 4px}
    .muted{color:#666;font-size:11px;margin-bottom:12px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    td{padding:4px 0;border-bottom:1px dashed #ccc}
    .total{font-weight:bold;font-size:15px;margin-top:12px;text-align:right}
    .local{background:#111;color:#fff;padding:6px 10px;font-weight:bold;margin:8px 0}
    .estacao{background:#0EA57E;color:#fff;padding:6px 10px;font-weight:bold;margin:8px 0 4px}
    .printer{color:#666;font-size:11px;margin-top:8px}
    .warn{color:#c1443c;font-size:11px;margin-top:8px;font-weight:bold}
  </style></head><body>
    <div class="estacao">${(estacaoLabel(estacao)||estacao).toUpperCase()}</div>
    <h1>Pedido ${orderNumber?'#'+orderNumber:''}</h1>
    <div class="muted">${new Date().toLocaleString('pt-BR')}</div>
    <div><b>Solicitante:</b> ${h(who)}</div>
    ${cota?`<div><b>Cota:</b> ${h(cota)}</div>`:''}
    ${local?`<div class="local">ENTREGAR EM: ${h(local)}</div>`:''}
    <table>${items.map(i=>`<tr><td>${i.qty}x ${h(i.name)}</td><td style="text-align:right">${fmt(i.price*i.qty)}</td></tr>`).join('')}</table>
    <div class="total">Total: ${fmt(total)}</div>
    ${printer?`<div class="printer">Imprimir na: <b>${h(printer)}</b> (agente local não conectado — instale o agente pra imprimir automático)</div>`:`<div class="warn">Nenhuma impressora configurada para ${estacaoLabel(estacao)||estacao} nesta origem — encaminhar manualmente.</div>`}
  </body></html>`);
  win.document.close(); win.focus();
  setTimeout(()=>{ win.print(); }, 300);
}

function renderComandaLocatorTabs(){
  const tabs=document.getElementById('clTabs'); if(!tabs) return;
  const categories=[...new Set(state.products.filter(productEnabledForCurrentChannel).map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const tab=(label,val)=>`<button data-cat="${h(val)}" style="border:0;border-bottom:3px solid ${comandaLocatorCategory===val?'#237bd1':'transparent'};background:none;padding:9px 14px;color:${comandaLocatorCategory===val?'#222':'#555'};font-size:13px">${h(label)}</button>`;
  tabs.innerHTML = tab('Todas','') + categories.map(c=>tab(c,c)).join('');

function renderComandaLocatorGrid(){
  const el=document.getElementById('clGrid'); if(!el) return;
  const q=(document.getElementById('clSearch')?.value||'').toLowerCase();
  let list = state.products.filter(productEnabledForCurrentChannel);
  if(comandaLocatorCategory) list = list.filter(p=>p.category===comandaLocatorCategory);
  if(q) list = list.filter(p=>((p.category||'')+' '+(p.code||'')+' '+p.name).toLowerCase().includes(q));
  const countEl=document.getElementById('clCount'); if(countEl) countEl.textContent = list.length+' Produto'+(list.length===1?'':'s')+' encontrado'+(list.length===1?'':'s')+'.';
  const head = `<thead><tr><th>Categoria</th><th>Código</th><th>Nome do Produto</th><th>Preço de Venda</th><th>Adicionar (F11)</th><th>Personalizar (Enter)</th></tr></thead>`;
  const row = p => `<tr><td>${h(p.category||'—')}</td><td>${h(p.code||'—')}</td><td>${h(p.name)}</td><td class="mono">${fmt(p.price)}</td>
    <td style="text-align:center"><button class="op-mini" onclick="addComandaLocatorProduct('${p.id}')" title="Adicionar">✓</button></td>
    <td style="text-align:center"><button class="op-mini" onclick="addComandaLocatorProduct('${p.id}')" title="Personalizar">✎</button></td></tr>`;
  if(!list.length){ el.innerHTML = `<table>${head}</table><p class="empty">Nenhum produto encontrado.</p>`; return; }
  if(comandaLocatorGroup && !comandaLocatorCategory){
    const groups={};
    list.forEach(p=>{ const key=p.category||'Sem categoria'; (groups[key]=groups[key]||[]).push(p); });
    el.innerHTML = `<table>${head}<tbody>${Object.keys(groups).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(cat=>groups[cat].map(row).join('')).join('')}</tbody></table>`;
  } else {
    el.innerHTML = `<table>${head}<tbody>${list.map(row).join('')}</tbody></table>`;
  }
}
function addComandaLocatorProduct(productId){

function confirmComandaItemTransfer(saleId){const targetId=document.getElementById('transferTargetSale').value,mode=document.getElementById('transferMode').value,target=state.sales.find(x=>x.id===targetId);if(!target){toast('Selecione um pedido de destino.');return;}const unsent=currentSaleDraft.items.filter(i=>!i.sent);if(!unsent.length){toast('Não há itens novos (ainda não enviados) para transferir ou copiar.');return;}target.items=[...(target.items||[]),...unsent.map(i=>({...i}))];target.total=target.items.reduce((a,i)=>a+i.price*i.qty,0);if(mode==='move'){currentSaleDraft.items=currentSaleDraft.items.filter(i=>i.sent);const s=state.sales.find(x=>x.id===saleId);if(s){s.items=currentSaleDraft.items;s.total=draftTotal();}}save('sales');closeModal();renderAll();toast(mode==='move'?'Itens transferidos.':'Itens copiados.');logAction('Itens '+(mode==='move'?'transferidos':'copiados')+' entre pedidos');if(mode==='move')openComanda(saleId,true);}
function printComandaConsumption(saleId){toggleComandaOrderOptions(false);window.print();}
function recalculateComandaOrder(saleId){toggleComandaOrderOptions(false);renderDraftItems();toast('Pedido recalculado.');}
function deleteComandaOrder(saleId){toggleComandaOrderOptions(false);const s=state.sales.find(x=>x.id===saleId);if(!s)return;if((s.items||[]).some(i=>i.sent)){toast('Este pedido já tem itens enviados à cozinha e não pode ser excluído. Use o fechamento normal.');return;}if(!confirm('Excluir este pedido? Essa ação não pode ser desfeita.'))return;state.sales=state.sales.filter(x=>x.id!==saleId);save('sales');closeModal();renderAll();toast('Pedido excluído.');logAction('Pedido excluído: '+saleId);}

/* Comandas nominais: exibe somente atendimentos abertos, sem grade fixa numerada. */
function comandaPersonData(s){const member=s.memberId?state.members.find(m=>m.id===s.memberId):null,person=member&&member.name||s.customerName||'Sem identificação',quota=member&&member.code?String(member.code):'';return{member,person,quota,label:quota?person+' — Cota '+quota:person};}
renderComandas=function(){
  const el=document.getElementById('view-comandas');
  if(!state.cashSession||state.cashSession.status!=='open'){el.innerHTML=`<div class="consumer-workspace"><section class="free-cash"><h2>CAIXA LIVRE</h2><div class="free-cash-actions"><button class="op-btn" onclick="switchView('caixa')">‹ &nbsp; Abrir caixa</button><button class="op-btn primary" onclick="switchView('caixa')"><span class="op-ico">＋</span> Iniciar atendimento</button></div><p class="sub" style="margin-top:25px">Abra o caixa para liberar mesas e comandas.</p></section></div>`;return;}
  const open=state.sales.filter(s=>s.status==='open'&&s.type==='comanda');
  const cards=open.map(s=>{const info=comandaPersonData(s);return `<button class="table-seat occupied comanda-person-card" data-search="${h(([info.person,info.quota,info.member&&info.member.name,s.orderNumber,s.local].filter(Boolean).join(' ')).toLowerCase())}" onclick="openComanda('${s.id}')"><div class="cap">EM ATENDIMENTO</div><div class="comanda-card-name">${h(info.person)}</div>${info.quota?`<div class="comanda-card-quota">Cota ${h(info.quota)}</div>`:info.member&&info.person!==info.member.name?`<div class="comanda-card-quota">${h(info.member.name)}</div>`:''}${s.local?`<div class="comanda-card-local"><span class="icn">${ICN.mapPin}</span>${h(s.local)}</div>`:''}<div class="comanda-card-total">${fmt(s.total)}</div></button>`;}).join('');

  document.getElementById('comandaSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#comandaTiles .comanda-person-card[data-search]').forEach(card=>card.style.display=card.dataset.search.includes(q)?'':'none');};
};
function comandaAccountChoices(){return state.members.filter(m=>!m.archived&&m.active!==false).map(m=>({key:m.id,memberId:m.id,dependentId:null,name:m.name,owner:m.name,quota:m.code||'',canOrder:true}));}
openNewComandaModal=function(){
  window.selectedComandaAccount=null;
  if((state.settings.operationMode||'clube')==='bar'){
    openModal('Abrir Comanda', `<div class="consumer-form-frame"><div class="field"><label>Número da mesa ou nome do cliente</label><input id="ncCustomer" placeholder="Ex: Mesa 5, ou o nome do cliente"></div></div><div class="consumer-modal-actions"><button class="consumer-back" onclick="closeModal()">〈 Voltar</button><button class="consumer-save" onclick="saveNewNamedComanda()">✓ Abrir Comanda</button></div>`,true);
    document.querySelector('#modalRoot .modal').classList.add('finance-record-modal','named-comanda-modal');
    setTimeout(()=>document.getElementById('ncCustomer')?.focus(),0);
    return;
  }
  openModal('Abrir Mesa / Comanda',`<div class="consumer-form-frame"><div class="field"><label>Buscar pelo nome do titular ou número da cota</label><div class="op-search comanda-account-search" style="width:100%"><input id="ncAccountSearch" autocomplete="off" placeholder="Digite o nome do titular ou a cota..." oninput="clearSelectedComandaAccount();filterComandaAccountChoices(this.value)"></div></div><div id="ncAccountResults" class="comanda-account-results"><p class="empty">Digite ao menos parte do nome ou da cota para pesquisar.</p></div><div id="ncSelectedAccount" class="panel" hidden></div><div class="field"><label>Cliente avulso</label><input id="ncCustomer" placeholder="Use somente quando não houver cota cadastrada" oninput="if(this.value.trim())clearSelectedComandaAccount(true)"></div></div><div class="consumer-modal-actions"><button class="consumer-back" onclick="closeModal()">〈 Voltar</button><button class="consumer-save" onclick="saveNewNamedComanda()">✓ Abrir Comanda</button></div>`,true);document.querySelector('#modalRoot .modal').classList.add('finance-record-modal','named-comanda-modal');setTimeout(()=>document.getElementById('ncAccountSearch')?.focus(),0);};
function filterComandaAccountChoices(value){const q=String(value||'').trim().toLowerCase(),box=document.getElementById('ncAccountResults');if(!box)return;if(!q){box.innerHTML='<p class="empty">Digite ao menos parte do nome ou da cota para pesquisar.</p>';return;}const choices=comandaAccountChoices().filter(x=>[x.name,x.quota].join(' ').toLowerCase().includes(q)).slice(0,30);box.innerHTML=choices.map(x=>`<button type="button" class="comanda-account-choice" onclick="selectComandaAccount('${x.key}')"><b>${h(x.name)}</b><span>Titular${x.quota?' · Cota '+h(x.quota):''}</span></button>`).join('')||'<p class="empty">Nenhum titular ou cota encontrado.</p>';}
function clearSelectedComandaAccount(keepSearch){window.selectedComandaAccount=null;const selected=document.getElementById('ncSelectedAccount');if(selected){selected.hidden=true;selected.innerHTML='';}if(!keepSearch){const customer=document.getElementById('ncCustomer');if(customer)customer.value='';}}
function selectComandaAccount(key){const choice=comandaAccountChoices().find(x=>x.key===key);if(!choice||!choice.canOrder)return;window.selectedComandaAccount=choice;document.getElementById('ncAccountSearch').value=choice.quota?choice.name+' — Cota '+choice.quota:choice.name;document.getElementById('ncAccountResults').innerHTML='';const selected=document.getElementById('ncSelectedAccount');selected.hidden=false;selected.innerHTML=`<b>${h(choice.name)}</b><p class="sub">${choice.dependentId?'Dependente de '+h(choice.owner):'Titular da conta'}${choice.quota?' · Cota '+h(choice.quota):''}</p>`;document.getElementById('ncCustomer').value='';}
function saveNewNamedComanda(){
  const customerName=document.getElementById('ncCustomer').value.trim();
  if((state.settings.operationMode||'clube')==='bar'){
    if(!customerName){ toast('Informe a mesa ou o nome do cliente.'); return; }
    const s={id:uid(),type:'comanda',tableNumber:null,orderNumber:nextOrderNumber(),memberId:null,dependentId:null,dependentName:'',customerName,items:[],total:0,status:'open',payments:[],openedAt:new Date().toISOString(),operatorName:currentUser.name};
    state.sales.push(s);save('sales');closeModal();renderAll();openNovoPedidoModal(s.id);
    return;
  }
  const choice=window.selectedComandaAccount;if(!choice&&!customerName){toast('Busque e selecione uma cota ou informe o cliente avulso.');return;}
  if(choice&&choice.memberId){
    const member = state.members.find(x=>x.id===choice.memberId);
    if(blockIfMemberInDebt(member)) return;
    const existing=state.sales.find(x=>x.status==='open'&&x.memberId===choice.memberId);if(existing){closeModal();renderAll();toast('Essa cota já tem uma comanda aberta — abrindo ela.');openComanda(existing.id,true);return;}
  }
  const s={id:uid(),type:'comanda',tableNumber:null,orderNumber:nextOrderNumber(),memberId:choice&&choice.memberId||null,dependentId:null,dependentName:'',customerName:choice?choice.name:customerName,items:[],total:0,status:'open',payments:[],openedAt:new Date().toISOString()};state.sales.push(s);save('sales');closeModal();renderAll();openNovoPedidoModal(s.id);
}

/* ============ MODO GARÇOM (mobile) ============ */
let gcFlow = { saleId:null, step:'home', category:null };
let gcCart = [];
let gcRequester = null;

function gcRenderHome(){
  gcFlow = { saleId:null, step:'home', category:null }; gcCart=[]; gcRequester=null;
  const screen = document.getElementById('gcScreen'); if(!screen) return;
  const open = state.sales.filter(s=>s.status==='open');
  const isBar = (state.settings.operationMode||'clube')==='bar';
  screen.innerHTML = `
    <div class="gc-bar"><div class="gc-title">Comandas</div><button class="gc-menu-btn" onclick="gcToggleMenu()">${ICN.menu}</button><div class="gc-menu-panel" id="gcMenuPanel"><button onclick="gcLogout()">Sair</button></div></div>
    <div class="gc-body">
      ${isBar ? `<input id="gcSearch" placeholder="Número da mesa ou nome do cliente..." oninput="gcRenderHomeSearch(this.value)" autocomplete="off">
      <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="gcOpenBarComanda()">+ Abrir nova comanda</button>`

function gcOpenBarComanda(){
  const name = (document.getElementById('gcSearch')?.value||'').trim();
  if(!name){ toast('Digite o número da mesa ou o nome do cliente na busca acima.'); return; }
  const s = { id:uid(), type:'comanda', tableNumber:null, orderNumber:nextOrderNumber(), memberId:null, dependentId:null, dependentName:'', customerName:name, items:[], total:0, status:'open', payments:[], openedAt:new Date().toISOString(), operatorName:currentUser.name };
  state.sales.push(s); save('sales');
  gcOpenFlow(s.id);
}
function gcRenderOpenTiles(){
  const el = document.getElementById('gcOpenTiles'); if(!el) return;
  const open = state.sales.filter(s=>s.status==='open');
  el.innerHTML = open.length ? open.map(s=>{
    const info = comandaPersonData(s);
    const label = info.quota || (info.person||'?').slice(0,4).toUpperCase();
    return `<button class="gc-tile ${s.locked?'gc-amber':'gc-green'}" onclick="gcOpenFlow('${s.id}')">${s.locked?'<span class="gc-lock">🔒</span>':''}<div>${h(label)}</div><div class="gc-tile-cap">${h((info.person||'').split(' ')[0])}</div></button>`;
  }).join('') : '<p class="gc-empty">Nenhuma comanda em andamento.</p>';
}
function gcRenderHomeSearch(q){
  const el = document.getElementById('gcHomeResults'); if(!el) return;
  const query = String(q||'').trim().toLowerCase();
  if(!query){ el.innerHTML=''; return; }
  const matches = state.members.filter(m=>!m.archived && m.active!==false && (((m.name||'').toLowerCase().includes(query))||((m.code||'').toLowerCase().includes(query)))).slice(0,8);
  el.innerHTML = matches.length ? matches.map(m=>{
    const existing = state.sales.find(s=>s.status==='open'&&s.memberId===m.id);
    return `<div class="gc-card ${m.debt>0?'gc-debt':''}"><div><div class="gc-name">${h(m.name)}</div><div class="gc-sub">${m.code?'Cota '+h(m.code):''}${m.debt>0?' · Deve '+fmt(m.debt):''}</div></div><button onclick="gcSelectMember('${m.id}')">${existing?'Abrir':'+ Comanda'}</button></div>`;
  }).join('') : '<p class="gc-empty">Nenhum associado encontrado.</p>';
}
function gcToggleMenu(){ const p=document.getElementById('gcMenuPanel'); if(p) p.classList.toggle('open'); }
function gcLogout(){ logAction('Logout realizado'); currentUser=null; document.getElementById('garcomApp').classList.remove('show'); renderLogin(); }

function gcOpenFlow(saleId){
  const s = state.sales.find(x=>x.id===saleId); if(!s) return;
  gcFlow = { saleId, step:'categories', category:null }; gcCart=[]; gcRequester=null;
  gcRenderCategories();
}
function gcBarHtml(title, sub){
  return `<div class="gc-bar"><div class="gc-title">${h(title)}${sub?`<small>${h(sub)}</small>`:''}</div><button class="gc-menu-btn" onclick="gcToggleMenu()">${ICN.menu}</button><div class="gc-menu-panel" id="gcMenuPanel"><button onclick="gcLogout()">Sair</button></div></div>`;
}
function gcFooterHtml(backFn){
  const count = gcCart.reduce((a,i)=>a+i.qty,0);
  return `<div class="gc-footer"><button class="gc-btn-back" onclick="${backFn}">‹ VOLTAR</button><button class="gc-btn-review" ${count?'':'disabled'} onclick="gcRenderReview()">✓ REVISAR${count?' ('+count+')':''}</button></div>`;
}
function gcRenderCategories(){
  const s = state.sales.find(x=>x.id===gcFlow.saleId); if(!s){ gcRenderHome(); return; }
  const info = comandaPersonData(s);
  const member = s.memberId ? state.members.find(m=>m.id===s.memberId) : null;
  const requesterOptions = member
    ? `<option value="">— Selecione —</option><option value="holder:${member.id}" ${memberBlockedByDebt(member)?'disabled':''}>Titular — ${h(member.name)}${memberBlockedByDebt(member)?' (bloqueado — deve '+fmt(member.debt)+')':''}</option>${(member.dependents||[]).map(d=>`<option value="dependent:${d.id}" ${d.canOrder===false||memberBlockedByDebt(member)?'disabled':''}>Dependente — ${h(d.name)}${d.canOrder===false?' (bloqueado)':memberBlockedByDebt(member)?' (bloqueado — cota com pendência)':''}</option>`).join('')}`
    : `<option value="guest">${h(s.customerName||'Cliente avulso')}</option>`;
  const cats = [...new Set(state.products.filter(p=>p.active!==false).map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const screen = document.getElementById('gcScreen');
  screen.innerHTML = gcBarHtml('Novo Pedido', info.person+(info.quota?' — Cota '+info.quota:'')) + `
    <div class="gc-body">
      ${member?`<div class="field" style="margin-bottom:14px"><label class="np-label">Quem está pedindo *</label><select id="gcRequesterSel" onchange="gcSetRequester(this.value)">${requesterOptions}</select></div>`:`<select id="gcRequesterSel" style="display:none">${requesterOptions}</select>`}
      <input id="gcProdSearch" placeholder="Buscar em todas categorias por nome" oninput="gcSearchAllProducts(this.value)">
      <div id="gcSearchProductResults"></div>
      <div class="gc-cat-grid" id="gcCatGrid" style="margin-top:14px">
        ${cats.map(c=>`<button class="gc-cat-tile" onclick="gcSelectCategory('${h(c).replace(/'/g,"\\'")}')">${h(c).toUpperCase()}</button>`).join('')}
        <button class="gc-cat-all" onclick="gcSelectCategory('')">TODOS OS PRODUTOS</button>
      </div>
    </div>` + gcFooterHtml('gcBackFromCategories()');
  if(!member){ gcSetRequester('guest'); document.getElementById('gcRequesterSel').value='guest'; }
  else if(gcRequester) document.getElementById('gcRequesterSel').value = gcRequester.key||'';
}
function gcBackFromCategories(){
  if(gcCart.length && !confirm('Você tem itens ainda não confirmados neste pedido. Sair mesmo assim?')) return;
  gcRenderHome();
}
function gcSetRequester(value){
  const s = state.sales.find(x=>x.id===gcFlow.saleId); if(!s) return;
  const member = s.memberId?state.members.find(m=>m.id===s.memberId):null;
  if(!value){ gcRequester=null; return; }
  if(value==='guest'){ gcRequester={key:'guest',id:null,name:s.customerName||'Cliente avulso',type:'avulso',canOrder:true}; return; }
  if(value.startsWith('holder:')){ if(memberBlockedByDebt(member)){ toast('Titular com pendência de '+fmt(member.debt)+' — bloqueado até quitar.'); gcRequester=null; return; } gcRequester={key:value,id:member.id,name:member.name,type:'titular',canOrder:true}; return; }
  const depId=value.split(':')[1], dep=member&&(member.dependents||[]).find(d=>d.id===depId);
  if(dep && dep.canOrder===false){ toast('Este dependente está bloqueado para consumir nesta cota.'); gcRequester=null; return; }
  gcRequester={key:value,id:dep&&dep.id,name:dep&&dep.name||'Dependente',type:'dependente',canOrder:true};
}
function gcSearchAllProducts(q){
  const catGrid = document.getElementById('gcCatGrid');
  const results = document.getElementById('gcSearchProductResults');
  if(!q){ if(catGrid)catGrid.style.display='grid'; if(results)results.innerHTML=''; return; }
  if(catGrid) catGrid.style.display='none';
  const list = state.products.filter(p=>p.active!==false && p.name.toLowerCase().includes(q.toLowerCase()));
  results.innerHTML = `<div class="gc-prod-grid" style="margin-top:10px">${list.length?list.map(p=>{
    const inCart = gcCart.find(i=>i.productId===p.id);
    return `<button class="gc-prod-tile" onclick="gcAddToCart('${p.id}');gcSearchAllProducts(document.getElementById('gcProdSearch').value)"><span>${h(p.name)}</span><span class="gc-price-badge">${inCart?'x'+inCart.qty:fmt(p.price)}</span></button>`;
  }).join(''):'<p class="gc-empty">Nada encontrado.</p>'}</div>`;
}
function gcSelectCategory(cat){
  if(!gcRequester){ toast('Selecione quem está pedindo antes.'); return; }
  gcFlow.category = cat; gcFlow.step='products';
  gcRenderProducts();
}
function gcRenderProducts(q){
  const s = state.sales.find(x=>x.id===gcFlow.saleId); if(!s){ gcRenderHome(); return; }
  const info = comandaPersonData(s);
  const cat = gcFlow.category;
  let list = state.products.filter(p=>p.active!==false);
  if(cat) list = list.filter(p=>p.category===cat);
  const query = String(q||'').toLowerCase();
  if(query) list = list.filter(p=>p.name.toLowerCase().includes(query));
  const screen = document.getElementById('gcScreen');
  screen.innerHTML = gcBarHtml('Novo Pedido', info.person+(info.quota?' — Cota '+info.quota:'')) + `
    <div class="gc-body">
      <input id="gcProdSearch2" placeholder="Buscar em todas categorias por nome" value="${h(q||'')}" oninput="gcRenderProducts(this.value)">
      ${cat?`<div class="gc-section-label">${h(cat)}</div>`:'<div class="gc-section-label">Todos os produtos</div>'}
      <div class="gc-prod-grid" id="gcProdGrid">
        ${list.length ? list.map(p=>{
          const av = productAvailable(p); const out = av!==Infinity && av<=0;
          const inCart = gcCart.find(i=>i.productId===p.id);
          return `<button class="gc-prod-tile" ${out?'disabled style="opacity:.5"':''} onclick="gcAddToCart('${p.id}')"><span>${h(p.name)}</span><span class="gc-price-badge">${inCart?'x'+inCart.qty:fmt(p.price)}</span></button>`;
        }).join('') : '<p class="gc-empty">Nenhum produto encontrado.</p>'}
      </div>
    </div>` + gcFooterHtml("gcFlow.step='categories';gcRenderCategories()");
}
function gcAddToCart(productId){
  if(!gcRequester){ toast('Selecione quem está pedindo antes.'); gcRenderCategories(); return; }
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  if(productAvailable(p)<=0){ toast('Sem estoque de insumos para este produto.'); return; }
  const existing = gcCart.find(i=>i.productId===productId);
  if(existing) existing.qty+=1; else gcCart.push({productId, name:p.name, price:p.price, qty:1, estacao:p.estacao||'cozinha'});
  const searchEl = document.getElementById('gcProdSearch2');
  gcRenderProducts(searchEl?searchEl.value:'');
}
function gcRenderReview(){
  if(!gcRequester){ toast('Selecione quem está pedindo.'); gcRenderCategories(); return; }
  if(!gcCart.length){ toast('Adicione ao menos um produto.'); return; }
  const s = state.sales.find(x=>x.id===gcFlow.saleId); if(!s) return;
  const info = comandaPersonData(s);
  const screen = document.getElementById('gcScreen');
  screen.innerHTML = gcBarHtml('Confirmar Pedido', info.person) + `
    <div class="gc-body">
      <div class="np-section">

function gcDiscardOrder(){
  if(!confirm('Descartar este pedido? Os itens ainda não foram enviados pra cozinha.')) return;
  gcCart=[]; gcRenderProducts();
}
function gcRenderReviewList(){
  const el = document.getElementById('gcReviewList'); if(!el) return;
  el.innerHTML = gcCart.length ? gcCart.map((i,idx)=>`
    <div class="gc-review-item"><span>${h(i.name)}</span>
    <div class="gc-qty"><button onclick="gcCartQty(${idx},-1)">−</button><span class="mono">${i.qty}</span><button onclick="gcCartQty(${idx},1)">+</button>
    <span class="mono" style="min-width:60px;text-align:right">${fmt(i.price*i.qty)}</span></div></div>`).join('') : '<p class="gc-empty">Nenhum item.</p>';
  const totEl = document.getElementById('gcReviewTotal'); if(totEl) totEl.textContent = fmt(gcCart.reduce((a,i)=>a+i.price*i.qty,0));
}
function gcCartQty(idx,delta){
  const it = gcCart[idx]; if(!it) return;
  it.qty+=delta; if(it.qty<=0) gcCart.splice(idx,1);
  if(!gcCart.length){ gcRenderProducts(); return; }
  gcRenderReviewList();
}
function gcConfirmOrder(){
  const s = state.sales.find(x=>x.id===gcFlow.saleId); if(!s) return;
  if(!gcCart.length){ toast('Adicione ao menos um produto.'); return; }
  const local = document.getElementById('gcLocal')?.value || '';
  s.notes = (document.getElementById('gcObs')?.value||'').trim();
  s.peopleCount = Math.max(1, parseInt(document.getElementById('gcPeople')?.value,10)||1);
  const origem = currentUser.origem||'app';
  const who = gcRequester.name;
  const items = gcCart.map(i=>({...i, sent:false, addedAt:new Date().toISOString(), addedBy:currentUser.name, requesterId:gcRequester.id, requesterName:who, requesterType:gcRequester.type}));
  if(!sendItemsToKitchen(s.id, items, who, 'comanda', local)) return;
  items.forEach(i=>i.sent=true);
  s.items = [...s.items, ...items];
  s.total = s.items.reduce((a,i)=>a+i.price*i.qty,0);
  save('sales');
  const groups = {};
  items.forEach(i=>{ const key=i.estacao||'cozinha'; (groups[key]=groups[key]||[]).push(i); });
  const printJobs = Object.keys(groups).map(estacao=>{
    const printer = resolvePrinterFor(estacao, origem);
    return { estacao, items:groups[estacao], printer: printer?printer.nome:null };
  });
  logAction('Pedido registrado para '+who+(local?' — local: '+local:'')+' — origem: '+origemLabel(origem));
  const gcMember = s.memberId ? state.members.find(m=>m.id===s.memberId) : null;
  printNovoPedidoTickets(who, gcMember?gcMember.code:'', local, printJobs, s.orderNumber);
  toast('Pedido confirmado e enviado!');
  gcRenderHome();
}
function gcSelectMember(memberId){
  const m = state.members.find(x=>x.id===memberId); if(!m) return;
  const existing = state.sales.find(s=>s.status==='open' && s.memberId===memberId);
  if(existing){ gcOpenFlow(existing.id); return; }
  if(memberBlockedByDebt(m)){ blockIfMemberInDebt(m); return; }
  const s = { id:uid(), type:'comanda', tableNumber:null, orderNumber:nextOrderNumber(), memberId:m.id, dependentId:null, dependentName:'', customerName:m.name, items:[], total:0, status:'open', payments:[], openedAt:new Date().toISOString(), operatorName:currentUser.name };
  state.sales.push(s); save('sales');
  gcOpenFlow(s.id);
}

function acceptRequest(id){
  const r = state.requests.find(x=>x.id===id); if(!r) return;
  let sale = state.sales.find(s=>s.status==='open' && ((r.memberId && s.memberId===r.memberId) || (!r.memberId && s.customerName===r.customerName)));
  const createdSale = !sale;
  if(!sale){
    sale = { id:uid(), type:'comanda', memberId:r.memberId, customerName:r.customerName, items:[], total:0, status:'open', payments:[], openedAt:new Date().toISOString() };
    state.sales.push(sale);
  }
  const newItems = r.items.map(i=>({...i, sent:false}));
  sale.items = sale.items.concat(newItems);
  sale.total = sale.items.reduce((a,i)=>a+i.price*i.qty,0);
  if(r.notes)sale.notes=[sale.notes,r.notes].filter(Boolean).join(' · ');
  const member = r.memberId ? state.members.find(m=>m.id===r.memberId) : null;
  const who = member ? member.name : (r.customerName||'Avulso');
  if(!sendItemsToKitchen(sale.id, newItems, who, 'cardapio')){
    sale.items=sale.items.filter(i=>!newItems.includes(i));
    sale.total=sale.items.reduce((a,i)=>a+i.price*i.qty,0);
    if(createdSale) state.sales=state.sales.filter(s=>s.id!==sale.id);
    return;
  }
  if(createdSale) sale.orderNumber=nextOrderNumber();
  newItems.forEach(i=>i.sent=true);
  r.status='aceito';
  r.statusAt=new Date().toISOString();r.statusHistory=r.statusHistory||[];r.statusHistory.push({status:'Aceito',at:r.statusAt,user:currentUser.name,note:'Enviado para a cozinha'});
  save('sales'); save('requests');
  toast('Pedido aceito e enviado para a cozinha.'); renderAll();
}
function rejectRequest(id){const r=state.requests.find(x=>x.id===id);if(!r)return;const preset=document.getElementById('requestRejectPreset')?.value||'',note=document.getElementById('requestRejectNote')?.value.trim()||'';if(document.getElementById('requestRejectPreset')&&!preset){toast('Selecione o motivo da recusa.');return;}r.status='recusado';r.rejectionReason=[preset,note].filter(Boolean).join(' — ')||'Recusado pela equipe';r.statusAt=new Date().toISOString();r.statusHistory=r.statusHistory||[];r.statusHistory.push({status:'Recusado',at:r.statusAt,user:currentUser.name,note:r.rejectionReason});save('requests');logAction('Solicitação do cardápio recusada — '+r.rejectionReason);closeModal();renderAll();toast('Solicitação recusada.');}

function addCardapioItem(productId){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  const channel=document.getElementById('view-totem')?.classList.contains('active')?'online':'qr';
  if(p.channels&&p.channels[channel]===false){toast('Este produto não está disponível neste canal.');return;}
  const existing = cardapioDraft.items.find(i=>i.productId===productId);
  const proposed=cardapioDraft.items.map(i=>({...i}));
  const candidate=proposed.find(i=>i.productId===productId);
  if(candidate) candidate.qty+=1; else proposed.push({productId,qty:1});
  if(!canFulfillItems(proposed)){ toast('Estoque insuficiente para aumentar este item.'); return; }
  if(existing) existing.qty += 1; else cardapioDraft.items.push({productId, name:p.name, price:p.price, qty:1});
  renderCardapioItems();
}
function changeCardapioQty(idx, delta){
  const it = cardapioDraft.items[idx]; if(!it) return;
  if(delta>0){ const proposed=cardapioDraft.items.map(i=>({...i})); proposed[idx].qty+=delta; if(!canFulfillItems(proposed)){ toast('Estoque insuficiente para aumentar este item.'); return; } }
  it.qty += delta; if(it.qty<=0) cardapioDraft.items.splice(idx,1);
  renderCardapioItems();
}

function submitCardapioRequest(){

    items, total, notes:(cardapioDraft.notes||'').trim(), channel:'cardapio-digital', status:'pendente', createdAt:new Date().toISOString() });

  cardapioDraft = { items:[], memberId:null, customerName:'', notes:'' };
