function paymentMethodLabel(method){if(method==='dinheiro')return'Dinheiro';if(method==='credito')return'Crédito';if(method==='debito')return'Débito';if(method==='cartao')return'Cartão';if(method==='pix')return'Pix';if(method==='vale')return'Vale Refeição';if(method==='fiado')return'Fiado';return String(method||'Outro').replace(/^outro:/,'');}
function cashClosingSnapshot(){const s=state.cashSession;if(!s)return null;const sales=state.sales.filter(sl=>sl.status==='closed'&&sl.deliveryStatus!=='cancelado'&&new Date(sl.closedAt)>=new Date(s.openedAt));const totals={dinheiro:0,cartao:0,pix:0,fiado:0,outros:0};sales.forEach(sl=>(sl.payments||[]).forEach(p=>totals[methodBucket(p.method)]+=Number(p.amount)||0));const movements=state.cashMovements.filter(m=>m.cashSessionId===s.id),suprimentos=movements.filter(m=>m.type==='suprimento').reduce((a,m)=>a+(Number(m.amount)||0),0),sangrias=movements.filter(m=>m.type==='sangria').reduce((a,m)=>a+(Number(m.amount)||0),0),cashIn=movements.filter(m=>m.type==='suprimento'&&(!m.method||m.method==='dinheiro')).reduce((a,m)=>a+(Number(m.amount)||0),0),cashOut=movements.filter(m=>m.type==='sangria'&&(!m.method||m.method==='dinheiro')).reduce((a,m)=>a+(Number(m.amount)||0),0),totalVendido=Object.values(totals).reduce((a,b)=>a+b,0),money=(Number(s.openingAmount)||0)+totals.dinheiro+cashIn-cashOut,final=(Number(s.openingAmount)||0)+totalVendido+suprimentos-sangrias;return{s,totals,suprimentos,sangrias,totalVendido,money,final};}
function openCloseCashModal(){const snap=cashClosingSnapshot();if(!snap)return;openModal('Fechamento do Caixa',`<div class="cash-close-body"><h2>Confirma o fechamento do seu caixa?</h2><p class="sub">Faça a conferência dos seguintes valores<br>na gaveta do seu caixa:</p><div class="cash-close-values"><div class="cash-close-value money">Apenas Dinheiro<strong>${fmt(snap.money)}</strong></div><div class="cash-close-value final">Saldo Final<strong>${fmt(snap.final)}</strong></div></div><p class="cash-close-note">Saldo final: dinheiro + pagamentos recebidos − saídas</p><div class="cash-close-actions"><button onclick="closeModal()">‹ &nbsp; Voltar</button><button onclick="finalizeCashSession(true)">▣ &nbsp; Finalizar e Imprimir</button><button onclick="finalizeCashSession(false)">✓ &nbsp; Finalizar</button></div></div>`);document.querySelector('#modalRoot .modal').classList.add('cash-close-modal');}
function finalizeCashSession(printAfter){const snap=cashClosingSnapshot();if(!snap)return;const closed={...snap.s,status:'closed',closedAt:new Date().toISOString(),totals:snap.totals,suprimentos:snap.suprimentos,sangrias:snap.sangrias,countedAmount:snap.money,expectedAmount:snap.money,diff:0,closedBy:currentUser.name};state.cashHistory.unshift(closed);state.cashSession=null;save('cashHistory');save('cashSession');document.getElementById('modalRoot').innerHTML='';logAction('Caixa fechado');renderAll();toast('Caixa fechado.');if(printAfter)setTimeout(()=>window.print(),100);}

function reportDate(value){return value?String(value).slice(0,10):'';}

function exportCurrentReport(){const table=document.querySelector('#view-relatorios table');if(!table){toast('Não há grade para exportar.');return;}const rows=[...table.rows].filter(r=>r.style.display!=='none').map(r=>[...r.cells].map(c=>c.innerText.trim()));const csv=rows.map(r=>r.map(v=>'"'+v.replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='relatorio-'+todayStr()+'.csv';a.click();URL.revokeObjectURL(a.href);}

function renderFinancialSummaryReport(sales){const month=new Date().getMonth(),year=new Date().getFullYear(),days=new Date(year,month+1,0).getDate(),rows=Array.from({length:days},(_,i)=>{const d=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,received=sales.filter(s=>reportDate(s.closedAt)===d).reduce((a,s)=>a+Number(s.total||0),0),accounts=(state.contas||[]).filter(c=>reportDate(c.vencimento)===d&&c.tipo==='pagar'),payable=accounts.reduce((a,c)=>a+Number(c.valor||0),0),paid=accounts.filter(c=>c.pago).reduce((a,c)=>a+Number(c.valorPago||c.valor||0),0);return `<tr><td>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}</td><td>${fmt(received)}</td><td>${fmt(payable)}</td><td>${fmt(paid)}</td><td>${fmt(received-payable)}</td><td>${fmt(received-paid)}</td></tr>`}).join('');document.getElementById('view-relatorios').innerHTML=`<section class="full-report-page"><div class="full-report-layout" style="height:calc(100vh - 220px);padding-top:61px"><aside class="full-report-filter financial-summary-filter"><h4>Opções de Pesquisa</h4><b>Tipo do cálculo:</b><label><input type="radio" name="summaryCalc" checked> <span>Recebimentos baseados na <b>data do pagamento</b> (fechamento do pedido)</span></label><label><input type="radio" name="summaryCalc"> <span>Recebimentos baseados na <b>data do crédito</b> (operadora do cartão)</span></label><label><input type="radio" name="summaryPeriod" checked> Exibir por Dia</label><label><input type="radio" name="summaryPeriod"> Exibir por Mês</label><b>Mês e Ano:</b><div class="month-year"><select><option>${new Date().toLocaleDateString('pt-BR',{month:'long'})}</option></select><select><option>${year}</option></select></div><button class="report-search-button" onclick="renderRelatorios()">⌕ &nbsp; Pesquisar</button></aside><main class="full-report-main"><div class="finance-tabs"><button class="active">Resumo Financeiro</button></div><div class="finance-grid report-grid-fill"><table><thead><tr><th>Data</th><th>Recebido (Data do Pagamento)</th><th>A Pagar</th><th>Pago</th><th>Saldo Previsto (Recebido - A Pagar)</th><th>Saldo Realizado (Recebido - Pago)</th></tr></thead><tbody>${rows}</tbody></table></div></main></div></section>`;}

function openDreMonthDetail(year,month){const sales=state.sales.filter(s=>s.status==='closed'&&s.deliveryStatus!=='cancelado'),data=dreMonthData(sales,year,month),title=new Date(year,month,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});openModal('DRE — '+title,`<div class="grid3" style="padding:12px"><div class="stat"><div class="lbl">Receita</div><div class="val" style="font-size:18px">${fmt(data.revenue)}</div></div><div class="stat"><div class="lbl">Custos + despesas</div><div class="val" style="font-size:18px">${fmt(data.costs+data.expenses)}</div></div><div class="stat"><div class="lbl">Resultado</div><div class="val" style="font-size:18px">${fmt(data.result)}</div></div></div><div class="finance-grid" style="height:370px"><table><thead><tr><th>Tipo</th><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${data.monthSales.map(s=>`<tr><td>Receita</td><td>${reportDateTime(s.closedAt)}</td><td>Pedido #${h(s.orderNumber||s.id)}</td><td>${fmt(s.total)}</td></tr>`).join('')}${data.payable.map(c=>`<tr><td>Despesa</td><td>${h(c.dataPagamento||c.vencimento)}</td><td>${h(c.descricao||'Conta paga')}</td><td>− ${fmt(c.valorPago||c.valor)}</td></tr>`).join('')||(!data.monthSales.length?'<tr><td colspan="4" class="empty">Sem movimentos no período.</td></tr>':'')}</tbody></table></div><div class="consumer-modal-actions"><button onclick="closeModal()">Voltar</button><button onclick="window.print()">▣ Imprimir</button></div>`,true);document.querySelector('#modalRoot .modal').classList.add('app-config-modal');}
function renderStockMovementsReport(){const rows=(state.stockMovements||[]).map(m=>`<tr data-special-date="${reportDate(m.at)}"><td>${h(m.type)}</td><td>${h(m.name)}</td><td>${h(m.unit)}</td><td>${h(m.operation)}</td><td>${m.before}</td><td>${m.qty}</td><td>${m.type==='entrada'?'E':'S'}</td><td>${m.after}</td><td>${h(m.user)}</td><td>${reportDateTime(m.at)}</td></tr>`).join('')||'<tr><td colspan="10" class="empty" style="height:390px">Não há registros para mostrar</td></tr>';document.getElementById('view-relatorios').innerHTML=`<section class="full-report-page"><div class="full-report-layout" style="padding-top:61px"><aside class="full-report-filter"><h4>Pesquisar Movimentações</h4>${reportPeriodFilterHtml('stockMove','Filtrar Período')}<div class="field"><label>Operação:</label><select><option></option><option>Entrada</option><option>Saída</option></select></div><div class="field"><label>Tipo:</label><select><option></option><option>Produto</option><option>Insumo</option></select></div><div class="field"><label>Categoria:</label><select><option></option>${[...new Set(state.products.map(p=>p.category).filter(Boolean))].map(x=>`<option>${h(x)}</option>`).join('')}</select></div><button class="report-search-button" onclick="filterSpecialReport('stockMove')">⌕ &nbsp; Pesquisar</button></aside><main class="finance-grid"><table><thead><tr><th>Tipo</th><th>Produto</th><th>Un. Méd.</th><th>Operação</th><th>Est. Anterior</th><th>Qtd.</th><th>E/S</th><th>Est. Final</th><th>Usuário</th><th>Data</th></tr></thead><tbody>${rows}</tbody></table></main></div></section>`;}

function renderRelatorios(){
  const report=activeRibbonAction||'Meu Negócio';const sales=state.sales.filter(s=>s.status==='closed'&&s.deliveryStatus!=='cancelado');
  if(report==='Meu Negócio'){renderRelatoriosDashboard();return;}
  if(report==='Mais Vendidos'){renderBestSellersReport(sales);return;}
  if(report==='Histórico de Pedidos'){renderOrderHistoryReport(sales);return;}
  if(report==='Histórico de Itens Vendidos'){renderSoldItemsReport(sales);return;}
  if(report==='Ranking de Atendimentos'){renderAttendanceRankingReport(sales);return;}
  if(report==='Histórico do Caixa'){const rows=state.cashHistory.map(c=>`<tr data-date="${reportDate(c.openedAt)}"><td>${h(c.id)}</td><td>${reportDateTime(c.openedAt)}</td><td>${reportDateTime(c.closedAt)}</td><td>${fmt(c.openingAmount)}</td><td>${fmt(Object.values(c.totals||{}).reduce((a,b)=>a+b,0))}</td><td>${fmt(c.countedAmount)}</td><td>${h(c.closedBy||'—')}</td><td>Fechado</td></tr>`).join('');reportShell(report,['Id','Aberto em','Fechado em','Saldo inicial','Saldo final','S. Final Informado','Usuário','Status'],rows,{extra:'<div class="field"><label>Últimos registros</label><input type="number" value="30" min="1"></div>'});return;}
  if(report==='Meu Delivery'){renderDeliveryReport(sales);return;}
  if(report==='Recebimentos (Pedidos e Fiado)'){renderReceiptsReport(sales);return;}
  if(report==='Resumo Financeiro'){renderFinancialSummaryReport(sales);return;}
  if(report==='DRE Simplificado'){renderDreReport(sales);return;}
  if(report==='Entradas e Saídas'){renderStockMovementsReport();return;}
  if(report==='Posição por Data'){renderStockPositionReport();return;}
  renderRelatoriosDashboard();
}

/* ============ LOGS ============ */
function logAction(text){
  state.logs.unshift({ id:uid(), text, user: currentUser? currentUser.name : '—', at:new Date().toISOString() });
  if(state.logs.length>300) state.logs = state.logs.slice(0,300);
  save('logs');
}
let logCategory='geral';
function setLogCategory(category){logCategory=category;renderLogs();}
function setLogPeriod(period){
  const from=document.getElementById('logFrom'),to=document.getElementById('logTo');if(!from||!to)return;
  const end=new Date(),start=new Date(end);end.setHours(12,0,0,0);start.setHours(12,0,0,0);
  if(period==='yesterday'){start.setDate(start.getDate()-1);end.setDate(end.getDate()-1);}
  else if(period==='previousMonth'){start.setDate(1);start.setMonth(start.getMonth()-1);end.setDate(0);}
  else if(period==='month')start.setDate(1);
  from.value=start.toISOString().slice(0,10);to.value=end.toISOString().slice(0,10);filterLogRows();
}
function exportLogsCsv(){const rows=[['Data/Hora','Usuário','Evento'],...state.logs.map(l=>[new Date(l.at).toLocaleString('pt-BR'),l.user,l.text])];const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='logs-'+todayStr()+'.csv';a.click();URL.revokeObjectURL(a.href);}
function renderLogs(){
  const el = document.getElementById('view-logs');
  const isQueue=activeRibbonAction==='Fila de Eventos';
  if(isQueue){
    const queue=state.eventQueue||[],now=Date.now();let queueChanged=false;queue.forEach(e=>{if(e.expiresAt&&new Date(e.expiresAt).getTime()<now&&e.status==='pendente'){e.status='expirado';queueChanged=true;}});
    const queueRows=queue.length?queue.map(l=>`<tr data-status="${h(l.status||'pendente')}" class="${l.status==='falha'?'low-stock':''}" ondblclick="openQueueEventModal('${l.id}')"><td class="mono">${h(l.id)}</td><td>${reportDateTime(l.at)}</td><td>${h(l.name||'Serviço local')}</td><td>${h(l.tag||'Notificação')}</td><td title="${h(l.message||'')}">${h(l.message||'')}</td><td>${Number(l.attempts)||0}</td><td>${l.expiresAt?reportDateTime(l.expiresAt):'—'}</td><td><span class="tag ${l.status==='concluido'?'tag-green':l.status==='falha'||l.status==='expirado'?'tag-red':'tag-amber'}">${h(l.status||'pendente')}</span></td><td><button class="op-mini" title="Editar" onclick="event.stopPropagation();openQueueEventModal('${l.id}')">✎</button><button class="op-mini" title="Reprocessar" onclick="event.stopPropagation();retryQueueEvent('${l.id}')">↻</button><button class="op-mini" title="Concluir" onclick="event.stopPropagation();completeQueueEvent('${l.id}')">✓</button><button class="op-mini" title="Excluir" onclick="event.stopPropagation();deleteQueueEvent('${l.id}')">✕</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">Não há eventos aguardando processamento.</td></tr>';
    el.innerHTML=`<div class="workspace-gray"><section class="op-window"><header class="op-titlebar">Fila de Eventos <span class="op-controls"><span>□</span><span onclick="switchView('principal')">×</span></span></header><div class="op-toolbar"><div class="op-search"><input id="queueSearch" placeholder="Pesquisar aqui..."></div><select id="queueStatus" onchange="filterQueueRows()"><option value="">Todos os status</option>${['pendente','falha','concluido','expirado'].map(x=>`<option>${x}</option>`).join('')}</select><div class="op-toolbar-spacer"></div><div class="pdv-menu-wrap"><button class="op-btn" onclick="toggleQueueOptions(this)">••• &nbsp; Opções</button></div><button class="op-btn" onclick="renderLogs()">↻ Atualizar</button><button class="op-btn primary" onclick="openQueueEventModal()">＋ Novo Evento</button></div><div class="op-grid"><table style="table-layout:fixed;width:100%"><thead><tr><th style="width:9%">ID</th><th style="width:12%">Inserida Em</th><th style="width:12%">Nome</th><th style="width:9%">Tag</th><th>Mensagem</th><th style="width:7%">Tent.</th><th style="width:12%">Expira em</th><th style="width:9%">Status</th><th style="width:13%">Ações</th></tr></thead><tbody id="queueRows">${queueRows}</tbody></table></div><footer class="op-footer"><span>Total=${queue.length} · Pendentes=${queue.filter(x=>x.status==='pendente').length} · Falhas=${queue.filter(x=>x.status==='falha').length}</span><span>Processamento externo depende do serviço integrado</span></footer></section></div>`;
    document.getElementById('queueSearch').oninput=filterQueueRows;if(queueChanged)save('eventQueue');return;
  }
  const filtered=state.logs.filter(l=>logCategory==='geral'||(logCategory==='pedidos'&&/pedido|venda|comanda|mesa/i.test(l.text))||(logCategory==='itens'&&/item|produto/i.test(l.text))||(logCategory==='clientes'&&/cliente|associado|unific/i.test(l.text)));

    : `<tr><td colspan="3" class="empty">Nenhum evento registrado ainda.</td></tr>`;
  const from=new Date();from.setDate(1);const fromValue=from.toISOString().slice(0,10);
  el.innerHTML = `<div class="workspace-gray"><section class="op-window"><header class="op-titlebar">Logs</header><div class="op-toolbar"><div class="op-search"><input id="logSearch" placeholder="Pesquisar usuário ou evento..."></div><div class="op-toolbar-spacer"></div><button class="op-btn" onclick="exportLogsCsv()">▧ Exportar CSV</button><button class="op-btn" onclick="window.print()">▣ Imprimir</button></div><div style="display:grid;grid-template-columns:290px 1fr;min-height:520px"><aside style="padding:16px;border-right:1px solid #ccc;background:#f7f7f7"><b>Opções de Pesquisa</b><hr><p><b>Período do evento</b></p><div class="grid2" style="gap:8px"><button class="op-btn" onclick="setLogPeriod('today')">Hoje</button><button class="op-btn" onclick="setLogPeriod('yesterday')">Ontem</button><button class="op-btn" onclick="setLogPeriod('previousMonth')">Mês Anterior</button><button class="op-btn" onclick="setLogPeriod('month')">Mês Atual</button></div><div class="field"><label>De</label><input id="logFrom" type="date" value="${fromValue}"></div><div class="field"><label>Até</label><input id="logTo" type="date" value="${todayStr()}"></div><button class="op-btn" style="width:100%" onclick="filterLogRows()">⌕ &nbsp; Pesquisar</button></aside><div><div class="record-tabs">${[['pedidos','Pedidos Excluídos'],['itens','Itens de Pedido Excluídos'],['geral','Geral'],['clientes','Clientes Unificados']].map(([id,n])=>`<button class="${logCategory===id?'active':''}" onclick="setLogCategory('${id}')">${n}</button>`).join('')}</div><div class="op-grid"><table><thead><tr><th>Data/Hora</th><th>Usuário</th><th>Evento / Motivo</th></tr></thead><tbody id="logRows">${rows}</tbody></table></div></div></div><footer class="op-footer"><span>Total Itens=${filtered.length}</span><span>Últimos 300 eventos</span></footer></section></div>`;

function toggleQueueOptions(button){let menu=button.parentElement.querySelector('.pdv-menu');if(menu){menu.remove();return;}menu=document.createElement('div');menu.className='pdv-menu';menu.style.top='48px';menu.innerHTML='<button onclick="exportQueueCsv()">▧ Exportar CSV</button><button onclick="retryAllQueueEvents()">↻ Reprocessar todos</button><button onclick="clearCompletedQueueEvents()">✕ Limpar concluídos</button>';button.parentElement.appendChild(menu);}

function saveQueueEvent(id){const name=document.getElementById('queueName').value.trim(),message=document.getElementById('queueMessage').value.trim(),expires=document.getElementById('queueExpires').value;if(!name||!message){toast('Informe nome e mensagem.');return;}const data={name,tag:document.getElementById('queueTag').value.trim(),message,note:document.getElementById('queueNote').value.trim(),expiresAt:expires?new Date(expires).toISOString():null,status:document.getElementById('queueEventStatus').value},item=state.eventQueue.find(x=>x.id===id);if(item)Object.assign(item,data,{updatedAt:new Date().toISOString()});else state.eventQueue.unshift({id:uid(),at:new Date().toISOString(),attempts:0,...data});save('eventQueue');closeModal();renderLogs();}
function completeQueueEvent(id){const item=state.eventQueue.find(x=>x.id===id);if(!item)return;item.status='concluido';item.completedAt=new Date().toISOString();item.note=item.note||'Concluído manualmente';save('eventQueue');renderLogs();}

function openCategoryModal(id){const item=id?state.categorias.find(x=>x.id===id):null,parents=state.categorias.filter(x=>x.id!==id&&!x.parentId);openModal(item?'Editar Categoria':'Nova Categoria',`<div class="record-body"><div class="record-tabs"><button class="active">Principal</button></div><div class="consumer-form-frame" style="min-height:310px"><div class="comp-code-row"><span>Código do sistema:</span><b>${h(item&&item.code||'')}</b><label class="comp-switch"><input id="categoryActive" type="checkbox" ${!item||item.active!==false?'checked':''}><span></span> Ativa</label></div><div class="field"><label>Nome</label><input id="categoryName" maxlength="100" value="${h(item&&item.nome||'')}" autofocus></div><div class="field"><label>Subcategoria de</label><select id="categoryParent"><option value="">Categoria principal</option>${parents.map(p=>`<option value="${p.id}" ${item&&item.parentId===p.id?'selected':''}>${h(p.nome)}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Código PDV</label><input id="categoryPdv" value="${h(item&&item.pdvCode||'')}"></div><div class="field"><label>Cor de identificação</label><input id="categoryColor" type="color" value="${h(item&&item.color||'#3568b0')}"></div></div></div><div class="consumer-modal-actions"><button class="consumer-delete" id="categoryDelete" ${item?'':'disabled'}>✕ Excluir</button><span style="flex:1"></span><button onclick="closeModal()">〈 Voltar</button><button class="consumer-save" id="categorySave">✓ Salvar</button></div></div>`);document.querySelector('#modalRoot .modal').classList.add('record-modal');document.getElementById('categorySave').onclick=()=>{const nome=document.getElementById('categoryName').value.trim();if(!nome){toast('Informe o nome da categoria.');return;}if(state.categorias.some(x=>x.id!==id&&String(x.nome).toLowerCase()===nome.toLowerCase())){toast('Já existe uma categoria com este nome.');return;}const oldName=item&&item.nome,target=item||{id:uid(),code:String(sta function openCardBrandModal(id){const item=id?state.cardBrands.find(x=>x.id===id):null;const fiscal=[['01','Visa'],['02','Mastercard'],['03','American Express'],['04','Sorocred'],['05','Diners Club'],['06','Elo'],['07','Hipercard'],['08','Aura'],['09','Cabal'],['99','Outros']];openModal('Bandeiras de Cartões',`<div class="consumer-form-frame brand-form-frame"><div class="field"><label>Descrição:</label><input id="brandDescription" value="${h(item&&item.nome||'')}" autofocus></div><div class="field"><label>Identificação Fiscal:</label><select id="brandFiscal"><option value=""></option>${fiscal.map(([code,name])=>`<option value="${code}" ${item&&item.identificacaoFiscal===code?'selected':''}>${code} - ${name}</option>`).join('')}</select></div></div><div class="consumer-modal-actions brand-actions"><button class="consumer-delete" id="brandDelete" ${item?'':'disabled'}>✕ &nbsp; Excluir</button><span></span><button class="consumer-back" onclick="closeModal()">〈 &nbsp; Voltar</button><button class="consumer-save" id="brandSave">✓ &nbsp; Salvar</button></div>`);const modal=document.querySelector('#modalRoot .modal');modal.classList.add('finance-record-modal','brand-record-modal');document.getElementById('brandSave').onclick=()=>{const nome=document.getElementById('brandDescription').value.trim(),identificacaoFiscal=document.getElementById('brandFiscal').value;if(!nome){toast('Informe a descrição.');return;}if(!identificacaoFiscal){toast('Selecione a identificação fiscal.');return;}if(item)Object.assign(item,{nome,identificacaoFiscal});else state.cardBrands.push({id:uid(),nome,identificacaoFiscal});save('cardBrands');closeModal();renderAll();toast('Bandeira salva.');};if(item)document.getElementById('brandDelete').onclick=()=>{if(!confirm('Excluir esta bandeira?'))return;state.cardBrands=state.cardBrands.filter(x=>x.id!==item.id);save('cardBrands');closeModal();renderAll();toast('Bandeira excluída.');};}
function openCrudModal(entityKey, id){
  if(entityKey==='paymentMethods'){openPaymentMethodModal(id);return;}
  if(entityKey==='contaCategorias'){openAccountCategoryModal(id);return;}
  if(entityKey==='fornecedores'){openSupplierModal(id);return;}
  if(entityKey==='perguntas'){openQuestionModal(id);return;}
  if(entityKey==='observacoes'){openObservationModal(id);return;}
  if(entityKey==='categorias'){openCategoryModal(id);return;}
  const cfg = CRUD_CONFIGS[entityKey];
  const item = id ? state[entityKey].find(x=>x.id===id) : null;
  openModal((item?'Editar':'Novo')+' — '+cfg.title, `
    ${cfg.fields.map(f=>`<div class="field"><label>${h(f.label)}</label><input id="crud_${f.key}" type="${f.type==='number'?'number':'text'}" ${f.type==='number'?'step="0.01"':''} value="${h(item?(item[f.key]??''):'')}"></div>`).join('')}
    <button class="btn btn-primary btn-block" id="crudSaveBtn">Salvar</button>`);
  document.querySelector('#modalRoot .modal').classList.add('record-modal');
  document.getElementById('crudSaveBtn').onclick = ()=>{
    const data = {};
    for(const f of cfg.fields){
      const v = document.getElementById('crud_'+f.key).value;
      data[f.key] = f.type==='number' ? (parseFloat(v)||0) : v.trim();
    }
    if(!data[cfg.fields[0].key]){ toast('Preencha o campo '+cfg.fields[0].label+'.'); return; }
    if(item){ Object.assign(item,data); } else { state[entityKey].push({id:uid(), ...data}); }
    save(entityKey); closeModal(); renderAll(); toast('Salvo com sucesso.'); logAction(cfg.title+' — registro salvo');
  };
}
function openQuestionModal(id){const item=id?state.perguntas.find(x=>x.id===id):null,answers=Array.isArray(item&&item.answers)?item.answers:[];openModal(item?'Editar Pergunta':'Nova Pergunta',`<div class="record-body"><div class="record-tabs"><button class="active">Principal</button><button>Respostas</button></div><div class="consumer-form-frame"><div class="field"><label>Pergunta</label><input id="questionText" value="${h(item&&item.texto||'')}"></div><div class="row"><div class="field"><label>Tipo da resposta</label><select id="questionType" onchange="toggleQuestionAnswers()">${[['single','Uma opção'],['multiple','Múltiplas opções'],['text','Texto livre'],['quantity','Quantidade']].map(([v,n])=>`<option value="${v}" ${item&&item.type===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Quantidade máxima de escolhas</label><input id="questionMax" type="number" min="1" value="${Number(item&&item.maxChoices)||1}"></div></div><label><input id="questionRequired" type="checkbox" ${item&&item.required?'checked':''}> Resposta obrigatória</label><label style="margin-left:18px"><input id="questionActive" type="checkbox" ${!item||item.active!==false?'checked':''}> Ativa</label><div id="questionAnswersBox" style="margin-top:15px"><div style="display:flex;justify-content:space-between"><b>Opções de resposta</b><button class="op-btn" onclick="addQuestionAnswer()">＋ Adicionar</button></div><div id="questionAnswerRows"></div></div></div><div class="consumer-modal-actions"><button onclick="closeModal()">Voltar</button><button class="consumer-save" onclick="saveQuestion('${id||''}')">✓ Salvar</button></div></div>`,true);document.querySelector('#modalRoot .modal').classList.add('record-modal');window.questionAnswersDraft=answers.map(x=>typeof x==='string'?{id:uid(),text:x,price:0}:({...x}));renderQuestionAnswers();toggleQuestionAnswers();}

function deleteCrudItem(entityKey, id){
  if(!confirm('Excluir este registro?')) return;
  state[entityKey] = state[entityKey].filter(x=>x.id!==id);
  if(entityKey==='paymentMethods'&&state.settings.paymentBrandLinks){delete state.settings.paymentBrandLinks[id];save('settings');if(selectedPaymentMethodId===id)selectedPaymentMethodId=null;}
  if(entityKey==='complementos'){state.products.forEach(p=>{p.complementIds=(p.complementIds||[]).filter(x=>x!==id);p.sizeIds=(p.sizeIds||[]).filter(x=>x!==id);});save('products');}
  if(entityKey==='perguntas'){state.products.forEach(p=>p.questionIds=(p.questionIds||[]).filter(x=>x!==id));save('products');}
  if(entityKey==='observacoes'){state.products.forEach(p=>p.observationIds=(p.observationIds||[]).filter(x=>x!==id));save('products');}
  save(entityKey); renderAll();
}

function slugifyEstacao(nome){ return String(nome||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40)||uid(); }

function renderOrigens(){
  const el = document.getElementById('view-origens'); if(!el) return;
  const rows = state.origens.length ? state.origens.map(o=>{
    const emUso = state.users.some(u=>u.origem===o.chave) || state.impressoras.some(p=>p.origem===o.chave);
    return `<tr><td><b>${h(o.nome)}</b><br><small class="mono" style="color:var(--muted)">${h(o.chave)}</small></td>
    <td>${state.users.filter(u=>u.origem===o.chave).length} usuário(s)</td>
    <td>${state.impressoras.filter(p=>p.origem===o.chave).length} impressora(s)</td>
    <td><button class="btn btn-sm" onclick="openOrigemModal('${o.id}')">Editar</button>
    <button class="btn btn-sm btn-danger" onclick="deleteOrigem('${o.id}')" ${emUso?'disabled title="Em uso por usuários ou impressoras — remova os vínculos primeiro"':''}>Excluir</button></td></tr>`;

async function checkPrintTokenStatus(){
  const box = document.getElementById('printTokenStatus'); if(!box || !supabaseClient) return;
  try{
    const { data, error } = await supabaseClient.from('print_agent_tokens').select('rotated_at').maybeSingle();
    if(error) throw error;
    box.textContent = data ? ('Token ativo, gerado/renovado em '+new Date(data.rotated_at).toLocaleString('pt-BR')+'.') : 'Nenhum token gerado ainda — clique em "Gerar/Regenerar token".';
  }catch(e){ box.textContent = 'Não foi possível checar o status do token.'; }
}
async function regeneratePrintAgentToken(){
  if(!supabaseClient){ toast('Disponível só no modo nuvem (Supabase).'); return; }
  if(!confirm('Gerar um novo token vai invalidar o token anterior — qualquer agente de impressão já configurado vai parar de funcionar até você colar o novo token nele. Continuar?')) return;
  try{
    const { data, error } = await supabaseClient.rpc('regenerate_print_agent_token');
    if(error) throw error;
    openModal('Token do agente de impressão', `
      <p class="sub">Copie esse token agora e cole no agente de impressão (ele pede na primeira vez que roda, ou quando o token muda). Ele não será mostrado de novo — se perder, gere outro.</p>
      <div class="field"><input value="${h(data)}" readonly class="mono" onclick="this.select()"></div>
    `);
    checkPrintTokenStatus();
  }catch(e){ toast('Não foi possível gerar o token: '+(e.message||e)); }
}

function resolvePrinterFor(estacao, origem){
  const exact = state.impressoras.find(p=>p.estacao===estacao && p.origem===origem);
  if(exact) return exact;
  const shared = state.impressoras.find(p=>p.estacao===estacao && p.origem==='ambos');
  if(shared) return shared;
  if(currentUser && currentUser.role==='admin'){
    return state.impressoras.find(p=>p.estacao===estacao) || null;
  }
  return null;
}

function openFiadoEntry(type){const m=state.members.find(x=>x.id===window.selectedFiadoMemberId);if(!m){toast('Selecione um cliente.');return;}openModal((type==='debt'?'Registrar Dívida':'Registrar Pagamento')+' — '+m.name,`<div class="field"><label>Valor</label><input id="fiadoValue" type="number" min="0.01" step="0.01"></div><div class="field"><label>Histórico / Motivo</label><input id="fiadoReason"></div><button class="btn btn-primary btn-block" id="fiadoSave">Confirmar</button>`);document.getElementById('fiadoSave').onclick=()=>{const value=parseFloat(document.getElementById('fiadoValue').value),reason=document.getElementById('fiadoReason').value.trim();if(!Number.isFinite(value)||value<=0||!reason){toast('Informe valor e motivo.');return;}if(type==='payment'&&value>Number(m.debt||0)){toast('O pagamento não pode superar o saldo devedor.');return;}m.debt=Math.max(0,Number(m.debt||0)+(type==='debt'?value:-value));m.debtHistory=Array.isArray(m.debtHistory)?m.debtHistory:[];m.debtHistory.unshift({id:uid(),type,value,reason,at:new Date().toISOString(),user:currentUser.name});save('members');logAction(`${type==='debt'?'Dívida':'Pagamento de fiado'}: ${m.name} — ${fmt(value)}`);closeModal();renderAll();toast('Conta corrente atualizada.');};}

function renderNumberingStandalone(el,s){

es||['tables','counter','delivery','cash']).includes('counter')?'checked':''}> Balcão</label><label><input class="numModule" value="cash" type="checkbox" ${(s.numberingModules||['tables','counter','delivery','cash']).includes('cash')?'checked':''}> Pedidos no Caixa</label></div><div class="settings-section"><b>Número atual (último criado)</b><div class="row" style="align-items:center;margin-top:10px"><div class="stat"><div class="val">${state.orderCounter||'—'}</div></div><button class="op-btn" onclick="resetOrderCounter()">↻ Limpar / Resetar</button></div>${history.slice(0,3).map(x=>`<p class="sub">${reportDateTime(x.at)} · ${h(x.user)} · início ${x.start} · ${h(x.prefix||'sem prefixo')}</p>`).join('')}</div><div class="record-actions"><button class="op-btn" onclick="openSystemSettings()">‹ Voltar</button><button class="op-btn primary" id="numSave">✓ Salvar</button></div></div></section></div>`;

function formatOrderNumber(number,settings=state.settings){const digits=Math.max(1,Number(settings.orderDigits)||4),prefix=settings.orderPrefix||'';return prefix+String(Number(number)||0).padStart(digits,'0');}
function updateNumberingPreview(){const enabled=document.getElementById('numEnabled')?.checked,start=Math.max(1,parseInt(document.getElementById('numStart')?.value,10)||1),prefix=document.getElementById('numPrefix')?.value||'',digits=parseInt(document.getElementById('numDigits')?.value,10)||4,next=enabled?Math.max(Number(state.orderCounter)||0,start-1)+1:(Number(state.orderCounter)||0)+1,el=document.getElementById('numberingPreview');if(el)el.textContent=formatOrderNumber(next,{orderPrefix:prefix,orderDigits:digits});}
let printerLocation='cash';
function printerDefaults(location){const old=Array.isArray(state.settings.printers)?state.settings.printers.find(p=>(location==='cash'?/caixa/i:/cozinha/i).test(p.purpose||'')):null;return {mode:location==='kitchen'?'same':'none',printerName:old&&old.name||'',networkPath:'',simplified:true,bold:false,font:'Consolas',fontSize:'Médio (8,25pt)',paperWidth:Number(old&&old.paperWidth||74),logo:'',...((state.settings.printerConfig||{})[location]||{})};}

function printerOptionsHtml(config){if(config.mode==='none')return `<div class="printer-disabled">Impressão Desabilitada.</div>`;if(config.mode==='same')return `<div class="printer-disabled">Utiliza a mesma impressora do caixa (Este PC).</div>`;const device=config.mode==='installed'?`<div class="field"><label>Impressora:</label><select id="printerName"><option value="">Selecione...</option><option value="browser" ${config.printerName==='browser'?'selected':''}>Impressora padrão do navegador</option>${config.printerName&&config.printerName!=='browser'?`<option selected value="${h(config.printerName)}">${h(config.printerName)}</option>`:''}</select></div>`:`<div class="field"><label>Caminho na rede:</label><div class="printer-network"><input id="printerNetwork" value="${h(config.networkPath||'')}" placeholder="Exemplo: \\\\NOME_PC\\NOME_IMPRESSORA"><button onclick="verifyPrinterPath()">Verificar Caminho</button></div></div>`;return `<div class="printer-options"><div class="printer-controls">${device}<label class="printer-check"><input id="printerSimplified" type="checkbox" ${config.simplified!==false?'checked':''}> Utilizar texto simplificado (impressoras com drivers genéricos)</label><label class="printer-check"><input id="printerBold" type="checkbox" ${config.bold?'checked':''}> Destacar alguns elementos em negrito</label><div class="printer-default"><div class="field"><label>Fonte:</label><select id="printerFont">${['Consolas','Arial','Courier New'].map(x=>`<option ${config.font===x?'selected':''}>${x}</option>`).join('')}</select></div><button onclick="setPrinterFieldDefault('font')">Definir padrão</button></div><div class="printer-default"><div class="field"><label>Tamanho:</label><select id="printerFontSize">${['Pequeno (7pt)','Médio (8,25pt)','Grande (10pt)'].map(x=>`<option ${config.fontSize===x?'selected':''}>${x}</option>`).join('')}</select></div><button onclick="setPrinterFieldDefault('size')">Definir padrão</button></div><div class="field"><label>Tamanho do papel:</label><div class="printer-paper"><input id="printerPaper" type="range" min="48" max="100" value="${Number(config.paperWidth)||74}" oninput="document.getElementById('printerPaperValue').textContent=this.value+'mm'"><b id="printerPaperValue">${Number(config.paperWidth)||74}mm</b></div></div><p class="printer-warning">O navegador não fornece a lista de drivers instalados. A opção padrão utiliza a caixa de impressão do dispositivo.</p></div><div class="printer-logo"><div class="printer-logo-title">Logotipo no cupom da conta</div><div class="printer-logo-preview" id="printerLogoPreview">${config.logo?`<img src="${config.logo}" alt="Logotipo">`:''}</div><div class="printer-logo-actions"><button onclick="clearPrinterLogo()">Limpar</button><button onclick="selectPrinterLogo()">Selecionar Imagem</button><input id="printerLogoFile" type="file" accept="image/*" hidden></div></div></div>`;}
function renderPrinterStandalone(el,s){const config=printerDefaults(printerLocation);const isCash=printerLocation==='cash';el.innerHTML=`<div class="workspace-gray"><section class="printer-window"><header class="op-titlebar">Impressoras <span class="op-controls"><span>×</span></span></header><div class="printer-layout"><aside class="printer-locations"><h4>Locais</h4><button class="printer-location ${isCash?'active':''}" onclick="setPrinterLocation('cash')"><span class="printer-icon">🖥️</span> Impressora do Caixa (Este PC)</button><button class="printer-location kitchen ${!isCash?'active':''}" onclick="setPrinterLocation('kitchen')"><span class="printer-icon">♨️</span> Cozinha principal</button></aside><main class="printer-panel"><h2 class="printer-heading">${isCash?'🖥️ Impressora do Caixa (Este PC)':'♨️ Cozinha principal'}</h2><div class="printer-modes">${(isCash?[['none','Não utilizo'],['installed','Impressoras Instaladas'],['shared','Compartilhadas']]:[['same','Mesma do caixa'],['installed','Impressoras Instaladas'],['shared','Compartilhadas']]).map(([value,label])=>`<label><input type="radio" name="printerMode" value="${value}" ${config.mode===value?'checked':''} onchange="setPrinterMode('${value}')"> ${label}</label>`).join('')}</div>${printerOptionsHtml(config)}${!isCash?`<button class="printer-disable-link" onclick="setPrinterMode('same')">Desabilitar Impressora</button>`:''}</main></div><div class="printer-actions"><span class="printer-test-note">A impressão real depende do navegador, driver e hardware configurados neste dispositivo.</span><button class="op-btn" onclick="testCurrentPrinter()">▣ &nbsp; Testar Impressora</button><button class="op-btn primary" onclick="savePrinterSettings()">✓ &nbsp; Salvar</button></div></section></div>`;}
function collectPrinterConfig(){const config=printerDefaults(printerLocation);const get=id=>document.getElementById(id);if(get('printerName'))config.printerName=get('printerName').value;if(get('printerNetwork'))config.networkPath=get('printerNetwork').value.trim();if(get('printerSimplified'))config.simplified=get('printerSimplified').checked;if(get('printerBold'))config.bold=get('printerBold').checked;if(get('printerFont'))config.font=get('printerFont').value;if(get('printerFontSize'))config.fontSize=get('printerFontSize').value;if(get('printerPaper'))config.paperWidth=Number(get('printerPaper').value)||74;return config;}

et:val('cfgPrinterTarget',s.printerTarget||'browser'),paperWidth:val('cfgPaperWidth',s.paperWidth||'80'),printKitchen:checked('cfgPrintKitchen',s.printKitchen)};

function resetOrderCounter(){ if(!confirm('Reiniciar a numeração de pedidos para #1?')) return; state.orderCounter=0; save('orderCounter'); renderAll(); toast('Numeração reiniciada.'); }
function openDeliveryAreaModal(id){const item=(state.settings.deliveryAreas||[]).find(x=>x.id===id);openModal(item?'Editar Área de Entrega':'Nova Área de Entrega',`<div class="consumer-form-frame"><div class="row"><div class="field"><label>Bairro / Região</label><input id="areaName" value="${h(item&&item.name||'')}"></div><div class="field"><label>Cidade</label><input id="areaCity" value="${h(item&&item.city||state.settings.city||'')}"></div></div><div class="row"><div class="field"><label>Taxa de entrega</label><input id="areaFee" type="number" min="0" step="0.01" value="${Number(item&&item.fee)||0}"></div><div class="field"><label>Prazo estimado (min)</label><input id="areaMinutes" type="number" min="1" value="${Number(item&&item.minutes)||40}"></div></div><div class="field"><label>Pedido mínimo</label><input id="areaMinimum" type="number" min="0" step="0.01" value="${Number(item&&item.minimum)||0}"></div><label><input id="areaActive" type="checkbox" ${!item||item.active!==false?'checked':''}> Área ativa</label></div><div class="consumer-modal-actions"><button onclick="closeModal()">〈 Voltar</button><button class="consumer-save" onclick="saveDeliveryArea('${id||''}')">✓ Salvar</button></div>`);document.querySelector('#modalRoot .modal').classList.add('finance-record-modal');}
function saveDeliveryArea(id){const name=document.getElementById('areaName').value.trim(),fee=parseFloat(document.getElementById('areaFee').value),minutes=parseInt(document.getElementById('areaMinutes').value,10),minimum=parseFloat(document.getElementById('areaMinimum').value)||0;if(!name||!Number.isFinite(fee)||fee<0||!Number.isFinite(minutes)||minutes<1){toast('Informe região, taxa e prazo válidos.');return;}state.settings.deliveryAreas=state.settings.deliveryAreas||[];const item=state.settings.deliveryAreas.find(x=>x.id===id),data={name,city:document.getElementById('areaCity').value.trim(),fee,minutes,minimum,active:document.getElementById('areaActive').checked};if(item)Object.assign(item,data);else state.settings.deliveryAreas.push({id:uid(),...data});save('settings');closeModal();renderConfigSistema();toast('Área de entrega salva.');}
function deleteDeliveryArea(id){if(!confirm('Excluir esta área de entrega?'))return;state.settings.deliveryAreas=(state.settings.deliveryAreas||[]).filter(x=>x.id!==id);save('settings');renderConfigSistema();}
function decodeScaleBarcode(code){const s=state.settings,clean=String(code||'').replace(/\D/g,'');if(clean.length!==Number(s.scaleBarcodeLength||13)||!clean.startsWith(String(s.scalePrefix||'2')))return null;const ps=Math.max(0,Number(s.scaleProductStart||2)-1),vs=Math.max(0,Number(s.scaleValueStart||7)-1),productCode=clean.slice(ps,ps+Number(s.scaleProductDigits||5)),raw=Number(clean.slice(vs,vs+Number(s.scaleValueDigits||5)))||0,product=state.products.find(p=>String(p.pdvCode||p.code||'').padStart(Number(s.scaleProductDigits||5),'0')===productCode);if(!product)return{productCode,raw,error:'Produto não localizado'};const value=raw/100,qty=s.scaleContent==='weight'?raw/1000:(Number(product.price)>0?value/Number(product.price):0);return{product,productCode,raw,value,qty};}
function openScaleBarcodeTest(){openModal('Testar Código de Barras por KG',`<div class="consumer-form-frame"><div class="field"><label>Código lido</label><input id="scaleBarcodeTest" inputmode="numeric" autofocus></div><button class="op-btn" onclick="runScaleBarcodeTest()">⌕ Interpretar</button><div id="scaleBarcodeResult" class="panel" style="margin-top:12px">Digite ou leia uma etiqueta.</div></div>`);document.querySelector('#modalRoot .modal').classList.add('finance-record-modal');}
function runScaleBarcodeTest(){const result=decodeScaleBarcode(document.getElementById('scaleBarcodeTest').value),el=document.getElementById('scaleBarcodeResult');if(!result){el.innerHTML='<span class="tag tag-red">Código incompatível com a configuração.</span>';return;}if(result.error){el.innerHTML=`<b>Código do produto:</b> ${h(result.productCode)}<br><span class="tag tag-amber">${h(result.error)}</span>`;return;}el.innerHTML=`<b>Produto:</b> ${h(result.product.name)}<br><b>Quantidade:</b> ${result.qty.toFixed(3)} ${h(result.product.measure||'un')}<br><b>Preço calculado:</b> ${fmt(result.product.price*result.qty)}`;}
function applyBackgroundImage(){const main=document.querySelector('.content');if(!main)return;const image=state.settings.backgroundImage||'';main.style.backgroundImage=image?`linear-gradient(#ffffffdd,#ffffffdd),url("${image}")`:'';main.style.backgroundSize=image?'cover':'';main.style.backgroundPosition=image?'center':'';}
function selectBackgroundImage(){const input=document.getElementById('backgroundImageFile');if(!input)return;input.onchange=()=>{const file=input.files&&input.files[0];if(!file)return;if(file.size>900000){toast('Escolha uma imagem de até 900 KB.');return;}const reader=new FileReader();reader.onload=()=>{state.settings.backgroundImage=reader.result;save('settings');applyBackgroundImage();renderConfigSistema();toast('Imagem de fundo atualizada.');};reader.readAsDataURL(file);};input.click();}
function clearBackgroundImage(){state.settings.backgroundImage='';save('settings');applyBackgroundImage();renderConfigSistema();toast('Imagem de fundo removida.');}
function selectBrandLogo(){const input=document.getElementById('brandLogoFile');if(!input)return;input.onchange=()=>{const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>700000){toast('Escolha uma imagem de até 700 KB.');return;}const reader=new FileReader();reader.onload=()=>{state.settings.brandLogo=reader.result;save('settings');applyBranding();renderConfigSistema();toast('Logotipo atualizado.');};reader.readAsDataURL(file);};input.click();}
function clearBrandLogo(){state.settings.brandLogo='';save('settings');applyBranding();renderConfigSistema();toast('Logotipo removido.');}
function resetBrandColors(){state.settings.brandPrimary='';state.settings.brandAccent='';save('settings');applyBranding();renderConfigSistema();toast('Cores restauradas para o padrão Commandah.');}
function nextOrderNumber(){const start=state.settings.customNumbering?Math.max(1,Number(state.settings.numberingStart)||1):1;state.orderCounter=Math.max(Number(state.orderCounter)||0,start-1)+1;save('orderCounter');return state.orderCounter;}

/* ============ BACKUP ============ */
const BACKUP_VERSION = 3;
function backupInventory(source=state){
  const inventory={};
  Object.keys(STORE).forEach(key=>{const value=source[key];inventory[key]=Array.isArray(value)?value.length:(value==null?0:1);});
  return inventory;
}
function renderBackup(){
  const el = document.getElementById('view-backup');
  const last=state.settings.lastBackupAt?new Date(state.settings.lastBackupAt).toLocaleString('pt-BR'):'Ainda não realizado nesta instalação';
  const total=Object.values(backupInventory()).reduce((sum,n)=>sum+n,0);
  el.innerHTML = `<div class="workspace-gray"><section class="op-window"><header class="op-titlebar">Backup do Sistema</header><div style="padding:22px;display:grid;grid-template-columns:2fr 1fr;gap:24px"><section style="padding-right:24px;border-right:1px solid #ccc"><h2>Configurar Backup</h2><div class="settings-section"><b>Backups manuais neste dispositivo</b><p class="sub">O navegador solicitará o local para salvar o arquivo. Último backup: ${last}.</p><div class="field"><label>Nome sugerido</label><input value="backup-cantina-${todayStr()}.json" disabled></div><p class="sub">${Object.keys(STORE).length} conjuntos persistentes e ${total} registros/itens serão incluídos com as configurações operacionais.</p></div><div class="settings-section"><b>Backups automáticos na nuvem</b><p class="sub">Google Drive, Dropbox ou outro provedor exigem credenciais e autorização externas.</p><div class="grid2"><div class="panel" style="text-align:center"><div style="font-size:34px">☁</div><b>Google Drive</b><br><button class="op-btn" onclick="toast('Google Drive não configurado: são necessárias credenciais OAuth.')">Configurar</button></div><div class="panel" style="text-align:center"><div style="font-size:34px">◇</div><b>Dropbox</b><br><button class="op-btn" onclick="toast('Dropbox não configurado: são necessárias credenciais OAuth.')">Configurar</button></div></div></div></section><section><h2>Restaurar Backup</h2><b>Restaurar um backup existente</b><p class="sub">A restauração substitui os dados locais atuais. Selecione um backup JSON exportado por este sistema.</p><input type="file" id="backupFile" accept=".json,application/json"><button class="op-btn" style="width:100%;margin-top:15px" onclick="importBackup()">⇧ Restaurar Backup de Dados</button><button class="op-btn" style="width:100%;margin-top:10px" onclick="toast('Fotos incorporadas não possuem um pacote separado nesta edição.')">▣ Restaurar Backup de Fotos</button><button class="op-btn" style="width:100%;margin-top:10px" onclick="toast('Importação XML depende do emissor e do leiaute fiscal do arquivo.')">XML &nbsp; Importar Dados</button></section></div><div class="record-actions"><button class="op-btn primary" onclick="exportBackup()">▷ &nbsp; Fazer Backup Agora</button></div><footer class="op-footer"><span>Formato JSON · versão ${BACKUP_VERSION}</span><span>Inclui todas as coleções persistidas</span></footer></section></div>`;
}
function exportBackup(){
  const exportedAt=new Date().toISOString();
  state.settings.lastBackupAt=exportedAt;
  const dump = {}; Object.keys(STORE).forEach(k=> dump[k]=state[k]);
  const backup = { format:'cantina-clube-backup', version:BACKUP_VERSION, exportedAt, inventory:backupInventory(dump), data:dump };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'backup-cantina-'+todayStr()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);save('settings');renderBackup();enhanceBackupActions();
  logAction('Backup exportado');
}
function exportMediaBackup(){const media={version:1,exportedAt:new Date().toISOString(),products:state.products.filter(p=>p.image).map(p=>({id:p.id,image:p.image})),backgroundImage:state.settings.backgroundImage||'',printerLogos:Object.fromEntries(Object.entries(state.settings.printerConfig||{}).map(([k,v])=>[k,v.logo||'']))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(media)],{type:'application/json'}));a.download='backup-midias-'+todayStr()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);logAction('Backup de mídias exportado');}
function enhanceBackupActions(){const actions=document.querySelector('#view-backup .record-actions');if(!actions||actions.querySelector('[data-media-backup]'))return;const b=document.createElement('button');b.className='op-btn';b.dataset.mediaBackup='true';b.textContent='▧ Fazer Backup de Mídias';b.onclick=exportMediaBackup;actions.prepend(b);}
function importMediaBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const media=JSON.parse(reader.result);if(media.version!==1||!Array.isArray(media.products))throw new Error();media.products.forEach(x=>{const p=state.products.find(y=>y.id===x.id);if(p&&typeof x.image==='string')p.image=x.image;});if(typeof media.backgroundImage==='string')state.settings.backgroundImage=media.backgroundImage;if(media.printerLogos&&typeof media.printerLogos==='object')Object.entries(media.printerLogos).forEach(([k,logo])=>{if(state.settings.printerConfig&&state.settings.printerConfig[k])state.settings.printerConfig[k].logo=logo;});save('products');save('settings');renderAll();toast('Mídias restauradas.');}catch(e){toast('Backup de mídias inválido.');}};reader.readAsText(file);};input.click();}

function saveCloudBackupConfig(provider){state.settings.cloudBackup=state.settings.cloudBackup||{};state.settings.cloudBackup[provider]={account:document.getElementById('cloudAccount').value.trim(),token:document.getElementById('cloudToken').value,folder:document.getElementById('cloudFolder').value.trim(),daily:document.getElementById('cloudDaily').checked,enabled:document.getElementById('cloudEnabled').checked};save('settings');closeModal();toast('Configuração de backup salva.');}
if(typeof document.addEventListener==='function')document.addEventListener('click',event=>{const b=event.target.closest&&event.target.closest('#view-backup button');if(!b)return;const text=b.textContent.trim();if(text==='Configurar'){const panel=b.closest('.panel'),provider=panel&&panel.querySelector('b')?.textContent;if(provider){event.preventDefault();event.stopImmediatePropagation();openCloudBackupConfig(provider);}}else if(text.includes('Restaurar Backup de Fotos')){event.preventDefault();event.stopImmediatePropagation();importMediaBackup();}},true);
function importBackup(){
  const inp = document.getElementById('backupFile');
  if(!inp.files.length){ toast('Selecione um arquivo de backup.'); return; }
  if(inp.files[0].size>50*1024*1024){toast('O arquivo excede o limite de 50 MB.');return;}
  if(!confirm('Isso vai substituir todos os dados atuais. Continuar?')) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(parsed && parsed.version!=null && ![2,3].includes(Number(parsed.version))) throw new Error('Versão de backup não suportada');
      if(Number(parsed.version)===3 && parsed.format!=='cantina-clube-backup') throw new Error('Origem de backup inválida');
      const dump = parsed && parsed.data ? parsed.data : parsed;
      if(!dump || typeof dump!=='object' || Array.isArray(dump)) throw new Error('Formato inválido');
      const scalarTypes={cashSession:'object',settings:'object',orderCounter:'number'};
      for(const k of Object.keys(STORE)){
        if(!(k in dump)) continue;
        if(k==='cashSession' && dump[k]===null) continue;
        if(scalarTypes[k]){ if(typeof dump[k]!==scalarTypes[k] || Array.isArray(dump[k]) || (k==='settings'&&dump[k]===null) || (k==='orderCounter'&&(!Number.isFinite(dump[k])||dump[k]<0))) throw new Error('Tipo inválido em '+k); }
        else if(!Array.isArray(dump[k])) throw new Error('Lista inválida em '+k);
        else if(dump[k].some(item=>!item || typeof item!=='object' || (item.id!=null && !/^[A-Za-z0-9_-]+$/.test(String(item.id))))) throw new Error('Registro inválido em '+k);
      }
      const snapshot={};Object.keys(STORE).forEach(k=>snapshot[k]=state[k]);
      try{for(const k of Object.keys(STORE)){if(k in dump){state[k]=dump[k];if(!(await save(k)))throw new Error('Falha ao persistir '+k);}}}
      catch(saveError){for(const k of Object.keys(STORE)){state[k]=snapshot[k];await save(k);}throw saveError;}
      state.settings.lastRestoreAt=new Date().toISOString();await save('settings');
      toast('Backup restaurado com sucesso.'); logAction('Backup restaurado'); renderAll();
    }catch(err){ toast('Arquivo inválido.'); }
  };
  reader.readAsText(inp.files[0]);
}

function diagnosticIntegrityRows(){
  const rows=[],allCollections=Object.keys(STORE).filter(k=>Array.isArray(state[k])),allIds=[];
  allCollections.forEach(k=>state[k].forEach(x=>{if(x&&x.id!=null)allIds.push(k+':'+x.id);}));
  const duplicateIds=allIds.filter((x,i,a)=>a.indexOf(x)!==i),productIds=new Set(state.products.map(x=>x.id)),insumoIds=new Set(state.insumos.map(x=>x.id)),memberIds=new Set(state.members.map(x=>x.id));
  const badRecipes=state.products.reduce((n,p)=>n+(p.recipe||[]).filter(r=>!insumoIds.has(r.insumoId)).length,0);
  const badSaleItems=state.sales.reduce((n,s)=>n+(s.items||[]).filter(i=>i.productId&&!productIds.has(i.productId)).length,0);
  const badMembers=state.sales.filter(s=>s.memberId&&!memberIds.has(s.memberId)).length;
  const invalidStock=state.insumos.filter(i=>!Number.isFinite(Number(i.stock))||Number(i.stock)<0).length;
  const orphanOrders=state.orders.filter(o=>o.saleId&&!state.sales.some(s=>s.id===o.saleId)).length;
  const add=(name,count,okMessage)=>rows.push([count?'✕':'✓',name,count?`${count} inconsistência(s) encontrada(s)`:okMessage,count?'Revise os registros indicados pelo módulo':'—',count?'ATENÇÃO':'OK']);
  add('Identificadores',duplicateIds.length,'Identificadores únicos nas coleções');add('Fichas técnicas',badRecipes,'Todos os insumos vinculados existem');add('Itens vendidos',badSaleItems,'Todos os produtos históricos estão vinculados');add('Clientes em pedidos',badMembers,'Todos os clientes vinculados existem');add('Estoque',invalidStock,'Saldos numéricos e não negativos');add('Pedidos da cozinha',orphanOrders,'Todos os pedidos possuem venda de origem');
  const last=state.settings.lastBackupAt?Date.now()-new Date(state.settings.lastBackupAt).getTime():Infinity,days=Math.floor(last/86400000);rows.push([days<=7?'✓':'!', 'Backup',days<=7?'Backup realizado nos últimos 7 dias':state.settings.lastBackupAt?`Último backup há ${days} dia(s)`:'Nenhum backup registrado','—',days<=7?'OK':'RECOMENDADO']);
  return rows;
}
async function runDiagnostics(){const body=document.getElementById('diagRows');body.innerHTML='<tr><td colspan="5" class="empty">Verificando...</td></tr>';const rows=[];try{const probe=JSON.stringify({t:Date.now()});await storageApi.set('cantina2:diagcheck',probe);const read=await storageApi.get('cantina2:diagcheck');if(!read||read.value!==probe)throw new Error('Leitura de conferência divergente');rows.push(['✓','Armazenamento','Leitura e gravação disponíveis','—','OK']);}catch(e){rows.push(['✕','Armazenamento','Falha ao conferir dados',e.message||'Erro','FALHA']);}rows.push(['✓','Aplicação','JavaScript carregado e estado inicializado','—','OK'],...diagnosticIntegrityRows());rows.push([navigator.onLine?'✓':'!','Rede',navigator.onLine?'Navegador informa conexão disponível':'Navegador está offline','Teste de internet não executado','INFORMATIVO']);rows.push(['!','Impressão','Usa a impressora configurada no navegador','Driver/hardware não testados','INFORMATIVO']);const integrations=[['WhatsApp',state.settings.whatsappBot],['Pix Online',state.settings.pixOnline],['SMS',state.settings.sms],['Bina',state.settings.bina],['Balança',state.settings.scale]];integrations.forEach(([name,c])=>rows.push([c&&c.enabled?'✓':'!',name,c&&c.enabled?'Configuração local ativa':'Não configurado ou pausado','Conexão externa não executada',c&&c.enabled?'CONFIGURADO':'INFORMATIVO']));body.innerHTML=rows.map(r=>`<tr><td>${r[0]==='✓'?'<span class="tag tag-green">Sim</span>':r[0]==='✕'?'<span class="tag tag-red">Não</span>':'<span class="tag tag-amber">Info</span>'}</td><td>${h(r[1])}</td><td>${h(r[2])}</td><td>${h(r[3])}</td><td>${h(r[4])}</td></tr>`).join('');state.settings.lastDiagnostic={at:new Date().toISOString(),rows};save('settings');logAction('Diagnóstico local executado');}

      <button class="btn btn-primary btn-block" onclick="submitTotemOrder()">Confirmar e enviar para a cozinha</button>
    </div>
  </div>`;
  document.getElementById('totMember').onchange = e=>{ cardapioDraft.memberId = e.target.value||null; };
  document.getElementById('totCustomer').oninput = e=>{ cardapioDraft.customerName = e.target.value; };
  document.getElementById('totNotes').oninput = e=>{ cardapioDraft.notes = e.target.value; };
  renderCardapioItems();
}
function submitTotemOrder(){
  if(!cardapioDraft.items.length){ toast('Selecione ao menos um item.'); return; }
  if(!cardapioDraft.memberId && !cardapioDraft.customerName.trim()){ toast('Informe sua cota de associado ou seu nome.'); return; }
  const member = cardapioDraft.memberId ? state.members.find(m=>m.id===cardapioDraft.memberId) : null;
  const who = member ? member.name : cardapioDraft.customerName.trim();
  const sale = { id:uid(), type:'totem', memberId:cardapioDraft.memberId, customerName:cardapioDraft.customerName.trim(), notes:(cardapioDraft.notes||'').trim(),
    items:cardapioDraft.items, total:cardapioDraft.items.reduce((a,i)=>a+i.price*i.qty,0), status:'open', payments:[], openedAt:new Date().toISOString() };
  state.sales.push(sale);
  if(!sendItemsToKitchen(sale.id, cardapioDraft.items, who, 'totem')){ state.sales=state.sales.filter(s=>s.id!==sale.id); return; }
  sale.orderNumber=nextOrderNumber();
  sale.items.forEach(i=>i.sent=true);
  save('sales');
  cardapioDraft = { items:[], memberId:null, customerName:'', notes:'' };
  toast('Pedido enviado! Aguarde ser chamado no painel de senhas.');
  renderAll();
}

function openBulkPriceModal(){
  window.bulkProductIds=new Set(state.products.map(p=>p.id));const categories=[...new Set(state.products.map(p=>p.category||'Sem categoria'))].sort();
  openModal('Alterar Produtos em Lote', `<div class="bulk-product-window"><aside><h3>Selecionar Produtos</h3><div class="op-search"><span>⌕</span><input id="bulkSearch" placeholder="Pesquisar produto..."></div><div class="field"><label>Categoria</label><select id="bulkCategory"><option value="">Todas</option>${categories.map(c=>`<option>${h(c)}</option>`).join('')}</select></div><div class="bulk-selection-actions"><button onclick="setBulkProductSelection(true)">Marcar todos</button><button onclick="setBulkProductSelection(false)">Desmarcar</button></div><div id="bulkProductList" class="bulk-product-list">${state.products.map(p=>`<label data-search="${h(((p.name||'')+' '+(p.category||'')).toLowerCase())}" data-category="${h(p.category||'Sem categoria')}"><input class="bulk-product-check" type="checkbox" value="${p.id}" checked onchange="syncBulkProductSelection()"><span>${h(p.name)}</span><small>${h(p.category||'Sem categoria')} · ${fmt(p.price)}</small></label>`).join('')||'<p class="empty">Nenhum produto cadastrado.</p>'}</div></aside><main><div class="record-tabs"><button class="active">Alteração</button><button onclick="previewBulkProductChange()">Pré-visualização</button></div><div class="consumer-form-frame"><div class="field"><label>Campo a alterar</label><select id="bulkField" onchange="updateBulkOperationOptions()"><option value="price">Preço de venda</option><option value="minStock">Estoque mínimo</option><option value="active">Status de venda</option><option value="category">Categoria</option></select></div><div id="bulkNumericOptions"><div class="field"><label>Operação</label><select id="bulkOperation"><option value="percent">Ajustar por percentual</option><option value="fixed">Definir valor</option><option value="amount">Somar valor</option></select></div><div class="field"><label>Valor</label><input id="bulkValue" type="number" step="0.01"></div></div><div id="bulkStatusOptions" hidden><div class="field"><label>Novo status</label><select id="bulkStatus"><option value="true">Ativo para venda</option><option value="false">Pausado</option></select></div></div><div id="bulkCategoryOptions" hidden><div class="field"><label>Nova categoria</label><select id="bulkNewCategory">${categories.map(c=>`<option>${h(c)}</option>`).join('')}</select></div></div><div class="panel"><b id="bulkSelectionCount">${state.products.length} produto(s) selecionado(s)</b><p class="sub">A alteração só será gravada após a confirmação.</p></div><div id="bulkPreview" class="bulk-preview"></div></div></main></div><div class="consumer-modal-actions"><button onclick="closeModal()">〈 Voltar</button><button class="op-btn" onclick="previewBulkProductChange()">Pré-visualizar</button><button class="consumer-save" id="bulkSaveBtn">✓ Aplicar Alterações</button></div>`,true);
  document.querySelector('#modalRoot .modal').classList.add('record-modal','bulk-product-modal');document.getElementById('bulkSearch').oninput=filterBulkProducts;document.getElementById('bulkCategory').onchange=filterBulkProducts;
  document.getElementById('bulkSaveBtn').onclick = ()=>{
    const selected=state.products.filter(p=>window.bulkProductIds.has(p.id));if(!selected.length){toast('Selecione ao menos um produto.');return;}const field=document.getElementById('bulkField').value;if(['price','minStock'].includes(field)){const value=parseFloat(document.getElementById('bulkValue').value);if(!Number.isFinite(value)){toast('Informe um valor válido.');return;}const operation=document.getElementById('bulkOperation').value;selected.forEach(p=>{const current=Number(p[field])||0;p[field]=Math.max(0,operation==='percent'?+(current*(1+value/100)).toFixed(2):operation==='amount'?+(current+value).toFixed(2):value);});}else if(field==='active')selected.forEach(p=>p.active=document.getElementById('bulkStatus').value==='true');else{const category=document.getElementById('bulkNewCategory').value;selected.forEach(p=>p.category=category);}save('products');closeModal();renderAll();toast(selected.length+' produto(s) atualizado(s).');logAction('Alteração em lote de produtos: '+field+' — '+selected.length+' item(ns)');
  };
}
function syncBulkProductSelection(){window.bulkProductIds=new Set([...document.querySelectorAll('.bulk-product-check:checked')].map(x=>x.value));const count=document.getElementById('bulkSelectionCount');if(count)count.textContent=window.bulkProductIds.size+' produto(s) selecionado(s)';}
function setBulkProductSelection(checked){document.querySelectorAll('.bulk-product-check').forEach(x=>{if(x.closest('label').style.display!=='none')x.checked=checked;});syncBulkProductSelection();}
function filterBulkProducts(){const q=(document.getElementById('bulkSearch')?.value||'').toLowerCase(),category=document.getElementById('bulkCategory')?.value||'';document.querySelectorAll('#bulkProductList label').forEach(x=>x.style.display=(!q||x.dataset.search.includes(q))&&(!category||x.dataset.category===category)?'':'none');}
function updateBulkOperationOptions(){const field=document.getElementById('bulkField').value;document.getElementById('bulkNumericOptions').hidden=!['price','minStock'].includes(field);document.getElementById('bulkStatusOptions').hidden=field!=='active';document.getElementById('bulkCategoryOptions').hidden=field!=='category';document.getElementById('bulkPreview').innerHTML='';}
function previewBulkProductChange(){syncBulkProductSelection();const field=document.getElementById('bulkField').value,value=parseFloat(document.getElementById('bulkValue')?.value),operation=document.getElementById('bulkOperation')?.value,selected=state.products.filter(p=>window.bulkProductIds.has(p.id)).slice(0,12),preview=document.getElementById('bulkPreview');if(!preview)return;const next=p=>field==='active'?(document.getElementById('bulkStatus').value==='true'?'Ativo':'Pausado'):field==='category'?document.getElementById('bulkNewCategory').value:!Number.isFinite(value)?'—':fmt(Math.max(0,operation==='percent'?(Number(p[field])||0)*(1+value/100):operation==='amount'?(Number(p[field])||0)+value:value));preview.innerHTML=`<b>Pré-visualização</b>${selected.map(p=>`<div><span>${h(p.name)}</span><strong>${h(next(p))}</strong></div>`).join('')}${window.bulkProductIds.size>12?`<small>e mais ${window.bulkProductIds.size-12} produto(s)...</small>`:''}`;}

function renderTenantSetup(){
  const overlay = document.getElementById('tenantSetupOverlay');
  overlay.style.display = 'flex';
  overlay.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy);position:fixed;inset:0;z-index:999;padding:20px;overflow:auto;';
  overlay.innerHTML = `<div class="login-box" style="max-width:440px">
    <h1>Entrar no Commandah</h1>
    <p class="sub">Uma conta por estabelecimento. Compartilhe esse login (e-mail/senha) com quem for configurar outros computadores e celulares do mesmo lugar.</p>
    <div class="field" style="text-align:left"><label>E-mail</label><input id="tsEmail" type="email" placeholder="seu@email.com" autocomplete="username"></div>
    <div class="field" style="text-align:left"><label>Senha</label><input id="tsPassword" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password"></div>
    <p id="tsError" class="sub" style="display:none;color:var(--red);text-align:left"></p>
    <button class="btn btn-primary btn-block" id="tsSignInBtn" onclick="tenantSignIn()">Entrar</button>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
    <p class="sub" style="text-align:left;margin-bottom:8px"><b>Ainda não tem conta? Crie o estabelecimento:</b></p>
    <div class="field" style="text-align:left"><label>Nome do estabelecimento</label><input id="tsBusinessName" placeholder="Ex: Clube Olímpico Maringá"></div>
    <button class="btn btn-block" id="tsSignUpBtn" onclick="tenantSignUp()">Criar novo estabelecimento</button>
  </div>`;
}
function slugifyTenant(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,60); }
function showTenantError(msg){ const el=document.getElementById('tsError'); if(el){ el.style.display='block'; el.textContent=msg; } }
function copyTenantCode(){
  const code = getTenantId();
  navigator.clipboard?.writeText(code).then(()=>toast('Código copiado.')).catch(()=>toast('Não foi possível copiar automaticamente — selecione o texto e copie manualmente.'));
}
async function changeTenantSetup(){
  if(!confirm('Isso vai desconectar este aparelho e pedir login de novo. Os dados continuam salvos no Supabase, só esse aparelho vai precisar entrar de novo. Continuar?')) return;
  try{ if(supabaseClient) await supabaseClient.auth.signOut(); }catch(e){}
  try{ localStorage.removeItem(TENANT_KEY); }catch(e){}
  location.reload();
}
async function tenantSignIn(){
  const email = (document.getElementById('tsEmail').value||'').trim();
  const password = document.getElementById('tsPassword').value||'';
  if(!email || !password){ showTenantError('Preencha e-mail e senha.'); return; }
  const btn=document.getElementById('tsSignInBtn'); btn.disabled=true; btn.textContent='Entrando...';
  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ showTenantError('E-mail ou senha incorretos.'); return; }
    const tenantId = await resolveTenantId(data.user.id);
    if(!tenantId){ showTenantError('Essa conta ainda não tem um estabelecimento vinculado.'); return; }
    setTenantId(tenantId);
    document.getElementById('tenantSetupOverlay').style.display = 'none';
    startApp();
  } finally { btn.disabled=false; btn.textContent='Entrar'; }
}
async function tenantSignUp(){
  const email = (document.getElementById('tsEmail').value||'').trim();
  const password = document.getElementById('tsPassword').value||'';
  const name = (document.getElementById('tsBusinessName').value||'').trim();
  if(!email || !password || !name){ showTenantError('Preencha nome do estabelecimento, e-mail e senha.'); return; }
  if(password.length<6){ showTenantError('A senha precisa ter pelo menos 6 caracteres.'); return; }
  const btn=document.getElementById('tsSignUpBtn'); btn.disabled=true; btn.textContent='Criando...';
  try{
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if(error){ showTenantError(error.message); return; }
    if(!data.user){ showTenantError('Conta criada — verifique seu e-mail pra confirmar antes de continuar.'); return; }
    const tenantId = slugifyTenant(name) + '-' + Math.random().toString(36).slice(2,6);
    const { error: insertErr } = await supabaseClient.from('tenant_owners').insert({ user_id: data.user.id, tenant_id: tenantId, business_name: name });
    if(insertErr){ showTenantError('Conta criada, mas houve erro ao vincular o estabelecimento: '+insertErr.message); return; }
    setTenantId(tenantId);
    document.getElementById('tenantSetupOverlay').style.display = 'none';
    startApp();
  } finally { btn.disabled=false; btn.textContent='Criar novo estabelecimento'; }
}
function startApp(){
  loadAll();
  setInterval(async ()=>{
    if(!currentUser) return;
    try{
      const rOrders = await storageApi.get(STORE.orders);
      const freshOrders = rOrders ? JSON.parse(rOrders.value) : [];
      const changedOrders = JSON.stringify(freshOrders) !== JSON.stringify(state.orders);
      const rSales = await storageApi.get(STORE.sales);
      const freshSales = rSales ? JSON.parse(rSales.value) : [];
      const changedSales = JSON.stringify(freshSales) !== JSON.stringify(state.sales);
      if(changedOrders) state.orders = freshOrders;
      if(changedSales) state.sales = freshSales;
      if(changedOrders || changedSales){
        const cozView = document.getElementById('view-cozinha');
        if(cozView && cozView.classList.contains('active')) renderCozinha();
        const garcomApp = document.getElementById('garcomApp');
        if(garcomApp && garcomApp.classList.contains('show') && (!gcFlow || gcFlow.step==='home')) gcRenderHome();
        renderScoreboard();
      }
    }catch(e){}
  }, 6000);
  setTimeout(()=>{
    const overlay = document.getElementById('loginOverlay');
    const appShown = document.getElementById('app') && document.getElementById('app').classList.contains('show');
    const garcomShown = document.getElementById('garcomApp') && document.getElementById('garcomApp').classList.contains('show');
    if(overlay && !overlay.innerHTML.trim() && !appShown && !garcomShown){
      overlay.innerHTML = '<div class="login-box"><h1>Não foi possível carregar</h1><p class="sub">A tela não terminou de carregar. Isso costuma acontecer quando o computador bloqueia algum recurso externo (rede corporativa/firewall) ou por falta de conexão à internet. Tente: 1) recarregar a página, 2) checar sua conexão, 3) se estiver numa rede de trabalho, tentar em outra rede.</p><button class="btn btn-primary btn-block" onclick="location.reload()">Recarregar</button></div>';
    }
  }, 6000);
}
async function boot(){
  const hasClaudeStorage = window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function';
  if(hasClaudeStorage){ storageApi = await createStorageAdapter(); startApp(); return; }
  const ready = await waitForSupabaseSdk(6000);
  if(!ready){
    storageApi = await createStorageAdapter();
    startApp();
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){
    const tenantId = await resolveTenantId(session.user.id);
    if(tenantId){
      setTenantId(tenantId);
      storageApi = buildSupabaseStorageApi(supabaseClient, tenantId);
      startApp();
      return;
    }
  }
  renderTenantSetup();
}
boot();
</script>
