name: Check index.html JS syntax

# O app não tem bundler nem build step, e o GitHub Pages deste repo publica direto
# da branch main (sem staging) - um script quebrado, um arquivo faltando ou um ?v=
# esquecido só aparece quando a página carrega no navegador do cliente do bar.
# Este workflow roda as mesmas checagens de scripts/ usadas localmente (hook
# guard-index-syntax.sh) em todo PR, como segundo gate antes do merge.
# O nome do workflow e o job "syntax-check" são o check exigido pela proteção da
# main: não renomear sem atualizar a regra no GitHub.

on:
  # Roda em TODO PR (nao so nos que mexem no index.html): desde o OPS-05 a main
  # esta protegida e exige este check; com filtro de caminho, PR so de
  # documentacao ficaria esperando um check que nunca roda.
  pull_request:
  # Push direto em main publica no Pages sem passar por PR: roda aqui tambem,
  # pra pelo menos ficar vermelho (e mandar e-mail) se algo quebrado subiu.
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: check-index-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validar index.html e assets (sintaxe, arquivos, ?v= único, órfãos)
        run: node scripts/check-app.js

      - name: Validar ordem de carregamento dos scripts
        run: |
          npm i --no-save --no-package-lock --silent acorn@8.14.0 acorn-walk@8.3.4
          node scripts/check-load-order.js

      - name: Mudou assets/js ou assets/css? O ?v= do index.html tem que mudar junto
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- assets/js assets/css; then exit 0; fi
          ver() { grep -o "?v=[A-Za-z0-9]*" | head -1; }
          old=$(git show "$BASE_SHA:index.html" | ver); new=$(ver < index.html)
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "::error file=index.html::assets/ mudou mas o $new continua igual. Rode: node scripts/bump-version.js"
            exit 1
          fi
          echo "OK: versão $old -> $new"
