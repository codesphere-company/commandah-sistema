name: Check index.html JS syntax

# index.html não tem bundler nem build step, e o GitHub Pages deste repo
# publica direto da branch main (sem staging) - um <script> quebrado só
# aparece quando a página carrega no navegador do cliente do bar. Esse
# workflow roda o mesmo check de sintaxe usado localmente (guard-index-syntax.sh)
# em todo PR que tocar index.html, como segundo gate antes do merge.

on:
  # Roda em TODO PR (nao so nos que mexem no index.html): desde o OPS-05 a main
  # esta protegida e exige este check; com filtro de caminho, PR so de
  # documentacao ficaria esperando um check que nunca roda.
  pull_request:
  # Push direto em main publica no Pages sem passar por PR: roda aqui tambem,
  # pra pelo menos ficar vermelho (e mandar e-mail) se algo quebrado subiu.
  push:
    branches: [main]
    paths:
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: check-index-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validar sintaxe dos blocos <script> inline
        run: |
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const re = /<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g;
          let m, i = 0, errors = [];
          while ((m = re.exec(html))) {
            i++;
            try { new Function(m[1]); }
            catch (e) { errors.push("bloco " + i + ": " + e.message); }
          }
          if (errors.length) {
            console.error("Erro de sintaxe JS em index.html:");
            errors.forEach(e => console.error("  - " + e));
            process.exit(1);
          }
          console.log("OK: " + i + " bloco(s) <script> validado(s).");
          '
